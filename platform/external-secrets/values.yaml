# External Secrets Operator 값: Helm 차트 external-secrets 2.12.0 (ESO v2.12.0). ArgoCD의 external-secrets Application(argocd/apps/external-secrets.yaml)이 차트의 기본값 위에 이 파일을 얹어 external-secrets 네임스페이스에 배포한다.
# 적지 않은 값은 그 차트 버전의 기본값이다: helm show values external-secrets --repo https://charts.external-secrets.io --version 2.12.0
#
# 하는 일: ExternalSecret 리소스(외부 저장소의 어느 값을 어느 Secret의 어느 키에 둘지)를 보고 Secret을 만들어 주기적으로 맞춘다. 이 클러스터에서 쓰는 외부 저장소는 AWS SSM 파라미터 스토어다.
# 인증은 AWS 접근 키 없이 ServiceAccount 토큰으로 한다: ESO가 ServiceAccount(monitoring/eso-ssm)의 토큰을 TokenRequest API로 받아 STS의 AssumeRoleWithWebIdentity에 내고, IAM 역할(dev-ops-study-eso-monitoring)의 임시 자격 증명을 받는다.
# 이 파일은 ESO 자체만 설정한다. SecretStore·ExternalSecret·ServiceAccount는 다른 Application이 배포한다(argocd/apps/external-secrets-config.yaml, platform/external-secrets-config).
# 파드는 셋이다: 컨트롤러(ExternalSecret을 보고 Secret을 만든다), 웹훅(ExternalSecret·SecretStore를 적용할 때 검사하는 어드미션 웹훅), cert-controller(웹훅의 TLS 인증서를 만들고 웹훅 설정과 CRD의 caBundle을 채운다).
#
# 이미지는 차트 버전이 정하는 태그를 그대로 쓴다(ghcr.io/external-secrets/external-secrets:v2.12.0). 값 파일 맨 위의 차트 버전과 argocd/apps/external-secrets.yaml의 targetRevision은 함께 바꾼다.
# CRD가 차트에 들어 있어서 고정의 단위가 차트 버전인 것은 kube-prometheus-stack 값 파일 맨 위와 같은 이유다.
# 리소스: 모든 컨테이너에 요청과 메모리 한도를 두고 CPU 한도는 두지 않는다(앱 차트와 같은 이유: CPU 한도는 CFS 쿼터 스로틀링을 부른다). 차트 기본값은 셋 모두 아무것도 정하지 않는다.
# 값은 클러스터에서 잰 사용량(2026-10-12, 이 규모: ExternalSecret 3개)에 맞췄다. 잰 값과 근거는 파드별 주석에 있다. 규모나 차트 버전이 바뀌면 kubectl top pods -n external-secrets 또는 Prometheus의 container_memory_working_set_bytes로 다시 잰다.
#
# 이 파일에는 빈 줄을 두지 않는다(환경 값 파일과 같은 yq 모양. validate 워크플로가 yq '.'로 다시 써도 그대로인지 검사한다).
#
# --- CRD ---
# 차트가 CRD(ExternalSecret, SecretStore, ClusterSecretStore, Password 등 생성기)를 설치하게 한다(차트 기본값 true를 명시한다). CRD가 차트의 templates/ 아래에 있어서 이 값이 꺼지면 렌더링에서 CRD가 빠지고
# ArgoCD의 prune이 CRD를 지우며, 그러면 모든 네임스페이스의 ExternalSecret·SecretStore가 함께 지워진다. 그래서 끄지 않는다. CRD가 커서(SecretStore가 YAML로 약 722KB) 서버 쪽 적용이 필요하다(argocd/apps/external-secrets.yaml).
installCRDs: true
# --- 컨트롤러 ---
# 파드 1개(차트 기본값). 컨트롤러가 잠시 없어도 이미 만든 Secret은 그대로 남는다. 새 Secret의 생성과 갱신만 컨트롤러가 돌아올 때까지 미뤄진다.
# 잰 값(인스턴스를 다시 띄운 직후 30분 동안 Prometheus의 최댓값): 시작 직후 최대 75.0MiB, 안정 상태 약 38MiB. 요청 64Mi는 안정 상태보다 넉넉한 값이고, 한도 128Mi는 시작 최대치의 약 1.7배다(시작할 때 감시 대상을 한꺼번에 읽어 캐시를 채우는 때의 여유). 그대로 둔다.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
# --- 웹훅 ---
webhook:
  # 파드 1개(차트 기본값). 웹훅이 없으면 ExternalSecret·SecretStore를 만들거나 고치는 요청이 실패한다(웹훅 설정의 failurePolicy: Fail). 이미 만든 Secret에는 영향이 없다.
  # 잰 값(인스턴스를 다시 띄운 직후 30분 동안 Prometheus의 최댓값): 시작 직후 최대 52.9MiB로 예전 한도 64Mi의 83%였고, 안정 상태는 약 30MiB다.
  # 시작 최대치가 한도에 가까우면 시작할 때 조금만 더 써도 OOM으로 죽고 재시작이 반복될 수 있어서(웹훅이 죽으면 ExternalSecret·SecretStore 적용이 실패한다) 한도를 128Mi로 올렸다(시작 최대치의 약 2.4배).
  # 요청 48Mi는 안정 상태(약 30MiB)보다 위이고 시작 최대치(52.9MiB)에 가깝다. 요청은 스케줄러가 노드의 남은 메모리를 계산할 때 쓰는 값이라 한도처럼 올리지 않았다(노드 메모리 사용률은 같은 때 68%였다).
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi
# --- cert-controller ---
certController:
  # 파드 1개(차트 기본값). 하는 일은 웹훅 서버가 쓸 TLS 인증서를 Secret(external-secrets-webhook)에 만들고, 그 CA를 웹훅 설정과 CRD의 caBundle에 넣는 것뿐이다.
  # caBundle은 Git에 없는 값이지만 ArgoCD는 OutOfSync로 보지 않는다(argocd/apps/cert-manager.yaml의 ServerSideApply 주석과 같은 이유).
  # 잰 값(웹훅과 같은 때, 같은 방법): 시작 직후 최대 59.2MiB로 예전 한도 64Mi의 93%였고, 안정 상태는 약 52MiB다. 시작 최대치가 한도에 거의 닿아 있어서 OOM 위험이 가장 컸다.
  # 한도를 128Mi로 올렸다(시작 최대치의 약 2.2배). 요청 64Mi는 안정 상태(약 52MiB)와 시작 최대치(59.2MiB)를 덮는 값이다.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
# --- 지표 ---
serviceMonitor:
  # 컨트롤러·웹훅·cert-controller의 /metrics(포트 metrics)를 Prometheus가 수집하게 하는 ServiceMonitor와 그것이 고르는 Service를 만든다(차트 기본값은 꺼짐).
  # kube-prometheus-stack의 Prometheus는 레이블이 없는 ServiceMonitor도 모든 네임스페이스에서 고르므로(platform/kube-prometheus-stack/values.yaml의 *SelectorNilUsesHelmValues: false) 레이블을 더하지 않는다.
  enabled: true
  # 차트 기본값(skipIfMissing)은 렌더링하는 시점에 클러스터에 ServiceMonitor CRD가 있을 때만 ServiceMonitor를 만든다. ArgoCD는 렌더링 결과를 캐시해서 CRD가 나중에 생겨도 다시 렌더링하기 전까지 빠진 채로 남을 수 있고,
  # CI의 helm template은 클러스터가 없어 늘 빠뜨리므로 스키마 검사도 건너뛴다. alwaysRender는 CRD 유무와 상관없이 늘 렌더링해서 둘 다 없앤다.
  # 대가: ServiceMonitor CRD는 kube-prometheus-stack이 설치하므로 새 클러스터에서 이쪽이 먼저 동기화되면 ServiceMonitor만 "kind를 모른다"로 실패한다.
  # 이 차트에는 ServiceMonitor에만 SkipDryRunOnMissingResource를 붙일 값이 없어서 Application 전체에 붙이고(argocd/apps/external-secrets.yaml), 실패한 ServiceMonitor는 그 Application의 retry가 CRD가 생긴 뒤에 다시 적용한다.
  renderMode: alwaysRender

# Secret grafana-admin: Grafana의 관리자 계정. 키 admin-user(값 admin)와 admin-password(무작위 32자). 읽는 쪽은 platform/kube-prometheus-stack/values.yaml의 grafana다
# (admin.existingSecret: grafana-admin, userKey: admin-user, passwordKey: admin-password).
# 비밀번호는 Git에도 SSM에도 없다. ESO의 Password 생성기가 클러스터 안에서 만들고, ExternalSecret이 그 값을 Secret에 담는다. 클러스터를 새로 만들면 새 비밀번호가 나오고, 그것으로 충분하다
# (Grafana의 DB는 emptyDir이라 이전 비밀번호로 남는 것이 없다). 비밀번호는 접속 전에 kubectl -n monitoring get secret grafana-admin으로 읽는다(README).
# 두 리소스 모두 동기화 순서와 SkipDryRunOnMissingResource는 secretstore.yaml 맨 위와 같다.
#
# 1) Password: 생성 규칙만 담은 리소스다(생성한 값은 담지 않는다). length 32, symbols 0(기호가 없으면 URL·셸에 넣을 때 이스케이프가 필요 없다). digits는 적지 않아 길이의 25%(8자)가 숫자다.
#    allowRepeat와 noUpper는 CRD의 필수 필드라 적는다(같은 문자가 반복돼도 되고, 대문자를 쓴다). 결과는 ExternalSecret이 키 password로 읽는다(생성기가 기본으로 내놓는 키 이름).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  length: 32
  symbols: 0
  allowRepeat: true
  noUpper: false
---
# 2) ExternalSecret: Password 생성기의 값을 받아 Secret grafana-admin을 만든다.
# refreshPolicy: CreatedOnce: Secret을 처음 만들 때 한 번만 값을 만든다. 기본값(Periodic)이면 refreshInterval(기본 1시간)마다 생성기를 다시 불러 비밀번호가 시간마다 바뀐다.
# CreatedOnce에서 다시 만들어지는 때는 Secret이 없어졌을 때(지웠거나 ExternalSecret이 새로 만들어졌을 때)와, Secret의 데이터를 손으로 바꿔 ESO의 해시 어노테이션과 어긋났을 때다(ESO v2.12.0 소스 기준). 그래서 이 Secret은 손으로 고치지 않는다. 다시 만들면 새 비밀번호가 나온다. Grafana의 비밀번호가 바뀔 뿐이라 문제가 없다.
# target.template: 생성기는 password 키 하나만 내놓으므로 템플릿으로 Secret의 모양을 만든다: admin-user는 고정값 admin, admin-password는 생성한 password.
# 템플릿의 metadata를 두는 이유는 alertmanager-discord.yaml 맨 위와 같다(ArgoCD의 추적 정보가 Secret에 복사되지 않게).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-admin

# ESO가 AWS에 로그인할 때 쓰는 ServiceAccount. SecretStore aws-ssm(secretstore.yaml)의 auth.jwt.serviceAccountRef가 이 이름을 가리킨다.
# 로그인 흐름(AWS 접근 키는 어디에도 없다):
#   1) ESO 컨트롤러가 이 ServiceAccount의 토큰을 TokenRequest API로 요청한다(audience sts.amazonaws.com). 토큰의 발급자(iss)는 k3s의 service-account-issuer로 정한 공개 S3 주소이고,
#      subject(sub)는 system:serviceaccount:monitoring:eso-ssm이다.
#   2) ESO가 그 토큰을 STS의 AssumeRoleWithWebIdentity에 내면, STS가 발급자의 공개 키(S3의 JWKS)로 서명을 확인하고 IAM 역할의 신뢰 정책(sub·aud 조건)과 맞춰 본 뒤 임시 자격 증명을 준다.
#   3) 그 자격 증명으로 ssm:GetParameter를 부른다. 역할은 파라미터 /dev-ops-study/discord-webhook-url 하나만 읽을 수 있다(infra/bootstrap).
# 역할은 아래 어노테이션에서 읽는다: SecretStore에는 역할을 적는 필드가 없다(SecretStore의 role 필드는 이 로그인 뒤에 한 번 더 역할을 넘는 별개의 기능이다).
# 어노테이션 이름의 eks.amazonaws.com은 이름이 역사적일 뿐이다. EKS의 IRSA가 정한 이름을 ESO가 같게 읽는 것이고, 이 클러스터는 EKS가 아니라 EC2 위의 k3s다. 어노테이션을 읽는 쪽은 ESO뿐이다(EKS의 파드 웹훅은 없다).
# 신뢰 정책이 이 네임스페이스와 이름(monitoring:eso-ssm)에만 역할을 열어 주므로 다른 ServiceAccount는 이 역할을 맡을 수 없다. 이름을 바꾸면 infra/bootstrap의 신뢰 정책도 함께 바꾼다.
# 역할 ARN의 계정 번호는 이 저장소에 이미 공개된 값이다(상태 버킷 이름). ARN은 비밀이 아니다: 맡으려면 위 토큰이 있어야 한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-ssm
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::803879842357:role/dev-ops-study-eso-monitoring

# SecretStore: ESO가 값을 읽어 올 곳. monitoring 네임스페이스의 ExternalSecret만 이 저장소를 쓸 수 있다(SecretStore는 네임스페이스 범위, ClusterSecretStore는 클러스터 범위).
# AWS Systems Manager 파라미터 스토어(service: ParameterStore)를 서울 리전에서 읽고, 인증은 ServiceAccount eso-ssm의 토큰(jwt)으로 한다(로그인 흐름은 serviceaccount.yaml).
# 값을 읽을 때 ESO는 ssm:GetParameter를 WithDecryption=true로 부르므로 SecureString은 서버 쪽에서 복호화된 채 온다(ExternalSecret에서 따로 할 일이 없다).
# 동기화 순서: SecretStore의 kind는 external-secrets Application이 설치하는 CRD가 정의한다. 아래 어노테이션(SkipDryRunOnMissingResource=true)은 CRD가 아직 없을 때 동기화 전 검증(dry-run)이
# "kind를 모른다"로 동기화를 통째로 거부하지 않게 하고, 실제 적용의 실패(CRD 없음, 웹훅이 아직 응답하지 않음)는 이 Application의 retry가 다시 시도한다(argocd/apps/external-secrets-config.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-ssm
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: eso-ssm

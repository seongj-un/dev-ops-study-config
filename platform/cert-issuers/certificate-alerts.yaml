# 인증서 경보(PrometheusRule): cert-manager가 내놓는 인증서 지표로, 갱신이 막혀 만료가 다가오는 것과 인증서가 준비되지 않은 것을 Discord로 알린다.
# cert-issuers Application(argocd/apps/cert-issuers.yaml)이 이 디렉터리의 ClusterIssuer와 함께 그대로 적용하고, Prometheus Operator가 Prometheus의 규칙 파일로 넣는다
# (kube-prometheus-stack의 ruleSelectorNilUsesHelmValues: false라 레이블 없이 모든 네임스페이스의 PrometheusRule을 고른다).
#
# 지표(cert-manager v1.21.2의 internal/collectors/certificate_collector.go): 컨트롤러가 수집될 때마다 클러스터의 모든 Certificate를 읽어 값을 만든다. Certificate가 지워지면 계열도 사라진다.
#   - certmanager_certificate_expiration_timestamp_seconds{name, namespace, issuer_name, issuer_kind, issuer_group}: 인증서의 만료 시각(status.notAfter, 유닉스 초).
#     아직 인증서를 받은 적이 없으면(notAfter가 없으면) 0이다.
#   - certmanager_certificate_ready_status{name, namespace, condition, issuer_name, issuer_kind, issuer_group}: Certificate의 Ready 조건. condition이 True·False·Unknown인
#     계열 셋을 늘 내고 지금 상태인 계열만 1이다. Ready 조건이 아직 없으면 Unknown이 1이다.
#   이 저장소의 Certificate는 앱 Ingress마다 하나다(shortener-<환경>-tls. ingress-shim이 만든다). 발급자는 dev가 letsencrypt-staging, prod가 letsencrypt-prod다.
#   수집은 cert-manager 차트의 ServiceMonitor가 한다(platform/cert-manager/values.yaml의 prometheus.servicemonitor, 주기 60초).
# 레이블: 그 ServiceMonitor는 honorLabels가 false(차트 기본값)라서, 지표의 namespace(인증서의 네임스페이스)는 exported_namespace로 바뀌어 저장되고 namespace에는 수집 대상인
#   컨트롤러의 네임스페이스 cert-manager가 붙는다(Argo Rollouts의 지표와 같다. 앱 차트 templates/prometheusrule.yaml의 [앱 파드 경보]).
#   그래서 식은 label_replace로 namespace를 exported_namespace의 값으로 덮어쓴 뒤 max by (namespace, name, issuer_name)로 묶는다.
#   - 경보의 namespace가 shortener-dev·shortener-prod가 된다. Alertmanager가 환경마다 따로 묶고(group_by: alertname, namespace) Discord에 어느 환경인지 보인다.
#   - max가 수집 대상의 레이블(pod, instance 등)을 지워서 컨트롤러 파드가 바뀌어도 같은 경보로 이어진다.
#   - 정규식 (.+)는 exported_namespace가 없으면 맞지 않아 namespace를 그대로 둔다. 나중에 honorLabels를 켜도(지표의 namespace가 그대로 남는다) 같은 결과다.
# 라우팅: 둘 다 severity: critical이라 Alertmanager의 "그 밖의 critical → Discord" 경로로 간다(platform/kube-prometheus-stack/values.yaml의 route).
#   앱의 경보가 아니라서 service 레이블은 붙이지 않는다.
# 동기화 순서: PrometheusRule의 kind는 kube-prometheus-stack이, 네임스페이스 cert-manager는 cert-manager Application이 만든다. 새 클러스터에서 둘보다 먼저 동기화되면
#   ClusterIssuer와 같은 방법으로 기다린다: 아래 SkipDryRunOnMissingResource=true로 kind가 없을 때의 동기화 전 검증을 건너뛰고, 적용의 실패는 Application의 retry가 다시 시도한다.
# 단위 테스트: tests/certificates/certificate-alerts.test.yaml(validate의 "인증서 경보 검사" 단계가 이 파일의 spec을 꺼내 promtool로 돌린다).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: certificate-alerts
  # 네임스페이스 범위 리소스라 네임스페이스가 있어야 하는데, cert-issuers Application에는 destination.namespace가 없어서 여기에 적는다. 지표를 내는 cert-manager 옆에 둔다.
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: certificates
      rules:
        # 남은 기간이 14일보다 짧으면 울린다. cert-manager는 수명의 2/3이 지나면 갱신하므로(Let's Encrypt의 90일 인증서는 만료 30일 전) 14일 남았다는 것은
        # 갱신이 16일째 실패하고 있다는 뜻이다(실패하면 1시간 뒤부터 2배씩, 최대 32시간 간격으로 다시 시도한다. README의 발급 한도).
        # 갱신이 실패해도 인증서가 아직 유효하면 Ready는 True로 남아서 CertificateNotReady로는 보이지 않는다. 이 경보가 그 빈자리를 맡는다.
        # 만료 시각이 0인 계열(아직 받은 적이 없다)은 뺀다(> 0). 0 - time()은 늘 기준 아래라 첫 발급 전마다 울리게 된다. 받지 못한 인증서는 CertificateNotReady가 맡는다.
        # 발급자로 거르지 않는다: dev의 staging 인증서도 똑같이 갱신되어야 하고, 갱신이 막힌 것은 발급 흐름이 깨졌다는 신호다.
        # for: 15m: EC2를 오래 멈춰 두었다 켜면 갱신 시점이 이미 지나 있어 켜자마자 갱신한다(몇 분 걸린다). 그 사이의 평가로 울리지 않게 기다린다.
        # 값은 남은 초(만료가 지났으면 음수)이고, humanizeDuration이 13d 23h 45m 0s처럼 쓴다.
        - alert: CertificateExpiringSoon
          expr: |-
            max by (namespace, name, issuer_name) (
              label_replace(certmanager_certificate_expiration_timestamp_seconds > 0, "namespace", "$1", "exported_namespace", "(.+)")
            ) - time() < 14 * 24 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.namespace }}: 인증서 {{ $labels.name }}의 남은 기간이 14일보다 짧다(갱신이 실패하고 있다)'
            description: >-
              남은 기간 {{ $value | humanizeDuration }}(음수면 이미 만료됐다), 발급자 {{ $labels.issuer_name }}.
              cert-manager는 만료 30일 전(수명 90일의 1/3)에 갱신하므로 갱신이 2주 넘게 실패하고 있다. 만료되면 브라우저와 클라이언트가 연결을 거부한다.
              kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}의 Issuing 조건과 Events, kubectl get order,challenge -A로 원인을 본다.
        # Ready가 15분 넘게 True가 아니면 울린다: 인증서가 아직 없거나(첫 발급), 만료됐거나, 지금 스펙(이름, 발급자)과 맞지 않는데 다시 받아 오는 것이 끝나지 않는다.
        # False와 Unknown(Ready 조건이 아직 없다)을 모두 준비되지 않은 것으로 본다. Unknown은 Certificate가 만들어진 직후 잠깐뿐이라 15분을 채울 일이 없다.
        # for: 15m: HTTP-01 발급은 보통 1~2분이고, 클러스터 안의 검증 주소 확인(self-check)은 DuckDNS가 새 IP를 가리킬 때까지 기다린다. 첫 발급, 발급자 변경(staging → prod),
        # 오래 멈췄다 켠 뒤의 갱신이 그 안에 끝나므로 평소의 발급으로는 울리지 않는다. 실패하면 cert-manager가 1시간 뒤에야 다시 시도하므로 그때는 계속 울린다.
        # condition 레이블은 max로 지운다: Unknown에서 False로 바뀌어도 같은 경보로 이어진다.
        - alert: CertificateNotReady
          expr: |-
            max by (namespace, name, issuer_name) (
              label_replace(certmanager_certificate_ready_status{condition!="True"} == 1, "namespace", "$1", "exported_namespace", "(.+)")
            )
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.namespace }}: 인증서 {{ $labels.name }}가 15분 넘게 준비되지 않았다'
            description: >-
              Certificate {{ $labels.name }}(발급자 {{ $labels.issuer_name }})의 Ready가 15분 넘게 True가 아니다.
              첫 발급이면 Traefik이 아직 자기 기본 자체 서명 인증서로 응답하고 있다. 흔한 원인은 HTTP-01 검증 실패(80 포트, DuckDNS가 옛 IP), Let's Encrypt의 발급 한도다.
              kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}, kubectl get order,challenge -A, kubectl -n {{ $labels.namespace }} describe challenge로 원인을 본다.

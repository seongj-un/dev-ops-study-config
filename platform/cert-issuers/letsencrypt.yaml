# Let's Encrypt 발급자 두 개(ClusterIssuer): letsencrypt-staging과 letsencrypt-prod. cert-issuers Application(argocd/apps/cert-issuers.yaml)이 이 디렉터리의 YAML을 그대로 적용한다.
# ClusterIssuer는 클러스터 범위라 어느 네임스페이스의 Certificate·Ingress든 이름으로 가리킬 수 있다. 앱 차트의 Ingress는 cert-manager.io/cluster-issuer 어노테이션에
# 환경 값 파일의 ingress.tls.clusterIssuer(두 이름 중 하나)를 적는다. validate가 그 값이 이 파일의 ClusterIssuer 이름인지 확인한다.
#
# 공통 설정
#   - ACME v2: Let's Encrypt가 쓰는 자동 발급 프로토콜이다. cert-manager가 계정을 만들고(키는 privateKeySecretRef의 Secret, 컨트롤러가 cert-manager 네임스페이스에 만든다),
#     인증서마다 주문(Order)을 넣고, 이름의 소유를 검증(Challenge)한 뒤 인증서를 받는다. 계정과 키는 환경(staging·prod)마다 따로다.
#   - 검증은 HTTP-01이다: Let's Encrypt가 http://<이름>/.well-known/acme-challenge/<토큰>을 80 포트로 요청해 정해진 응답이 오는지 본다. cert-manager는 검증하는 동안
#     인증서를 받는 Ingress와 같은 네임스페이스에 응답용 파드(acmesolver)·Service·Ingress를 만들고, 끝나면 지운다. ingressClassName traefik이 그 Ingress를 k3s의 Traefik이 처리하게 한다.
#     그 Ingress는 앱 Ingress와 별개라서 앱 Ingress의 HTTP→HTTPS 리다이렉트가 붙지 않는다. 경로가 더 길어서 Traefik이 같은 호스트의 앱 라우터보다 먼저 고른다(앱 차트의 ingress.yaml 머리말).
#     DuckDNS의 이름은 DNS-01(TXT 레코드)을 쓰려면 DuckDNS용 외부 웹훅이 필요해서, 80 포트가 이미 열려 있는 이 클러스터에는 HTTP-01이 가장 단순하다. 와일드카드 인증서는 DNS-01로만 받는다(쓰지 않는다).
#   - email을 적지 않는다. ACME의 email은 선택 필드이고(이 CRD의 필수 필드는 server·privateKeySecretRef뿐), Let's Encrypt는 2025-06-04에 만료 알림 메일을 그만 보냈다.
#     적으면 공개 저장소에 주소가 남기만 한다. 만료는 cert-manager가 갱신으로 막고(수명의 2/3이 지나면 갱신한다), 갱신이 막히면 인증서 경보가 Discord로 알린다
#     (platform/kube-prometheus-stack/values.yaml의 additionalPrometheusRulesMap.certificates).
#
# 동기화 순서: 이 리소스의 kind(ClusterIssuer)와 그것을 검사하는 웹훅은 cert-manager Application이 만든다. 두 Application은 따로 동기화되므로 새 클러스터에서는 이쪽이 먼저 올 수 있다.
# 아래 어노테이션(SkipDryRunOnMissingResource=true)은 CRD가 아직 없을 때 동기화 전 검증(dry-run)이 "kind를 모른다"로 동기화를 통째로 거부하지 않게 하고,
# 실제 적용의 실패(CRD 없음, 웹훅이 아직 응답하지 않음)는 이 Application의 retry가 다시 시도한다(argocd/apps/cert-issuers.yaml의 retry 주석).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  # staging: 신뢰되지 않는 가짜 루트("(STAGING) ..." 이름의 CA)로 서명한 인증서를 준다. 브라우저와 curl은 경고를 내거나 연결을 거부한다(curl -k로 본다).
  # 대신 발급 한도가 production보다 훨씬 크다. 발급 흐름(검증, Secret 생성, Traefik이 인증서를 고르는 것)을 이것으로 먼저 확인한 뒤 prod 환경만 letsencrypt-prod로 바꿨다.
  # dev 환경은 이것을 그대로 쓴다(이유는 environments/dev/values.yaml의 ingress 주석, README의 HTTPS 절).
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  # production: 브라우저가 믿는 인증서를 준다. 발급 한도가 작다(같은 이름 묶음으로 7일에 5장 등. README의 HTTPS 절).
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik

# Argo Rollouts 값: Helm 차트 argo/argo-rollouts 2.43.2 (Argo Rollouts v1.10.0). ArgoCD의 argo-rollouts Application(argocd/apps/argo-rollouts.yaml)이 차트의 기본값 위에 이 파일을 얹어 argo-rollouts 네임스페이스에 배포한다.
# 적지 않은 값은 그 차트 버전의 기본값이다: helm show values argo/argo-rollouts --version 2.43.2
#
# 하는 일: 컨트롤러가 Rollout 리소스(Deployment 대신 점진 배포 방식을 적는 워크로드)를 보고 새 버전의 ReplicaSet을 단계적으로 늘린다. 이 Application은 컨트롤러·CRD·대시보드만 설치하고,
# Rollout을 쓰는 쪽(앱 차트)은 따로 배포된다. 이 저장소는 트래픽 라우터(Ingress·서비스 메시) 없이 파드 수의 비율로 나누는 기본 카나리만 쓴다.
#
# 이미지는 차트 버전이 정하는 태그를 그대로 쓴다(컨트롤러 quay.io/argoproj/argo-rollouts:v1.10.0, 대시보드 quay.io/argoproj/kubectl-argo-rollouts:v1.10.0. 둘 다 arm64·amd64 지원).
# CRD가 차트에 들어 있어서 이미지 태그만 따로 고정하면 차트를 올릴 때 컨트롤러와 CRD가 어긋날 수 있다. 고정의 단위가 차트 버전인 것은 kube-prometheus-stack 값 파일 맨 위와 같은 이유다.
#
# 접속: 대시보드에 Ingress도 HTTPRoute도 만들지 않고 Service도 ClusterIP다. 대시보드에는 인증이 없고(차트 README: 관리 콘솔로 노출하려고 만든 것이 아니라 네트워크 접근이나 OAuth 프록시로 막아야 한다),
# 80 포트는 인터넷에 열린 평문 HTTP라서 그대로 내놓게 된다. 사람은 kubectl port-forward로만 본다(README의 Argo Rollouts 절).
# 리소스: 모든 컨테이너에 요청과 메모리 한도를 두고 CPU 한도는 두지 않는다(앱 차트와 같은 이유: CPU 한도는 CFS 쿼터 스로틀링을 부른다).
# 값은 클러스터에서 잰 것이 아니라 이 규모(Rollout 2개)를 가정한 추정이다. 띄운 뒤 kubectl top pods -n argo-rollouts로 보고 고친다. 합계는 README에 있다.
#
# 이 파일에는 빈 줄을 두지 않는다(환경 값 파일과 같은 yq 모양. validate 워크플로가 yq '.'로 다시 써도 그대로인지 검사한다).
#
# --- CRD ---
# 차트가 CRD 5개(Rollout, AnalysisRun, AnalysisTemplate, ClusterAnalysisTemplate, Experiment)를 설치한다(차트 기본값). CRD가 지워지면 그 종류의 리소스가 모든 네임스페이스에서 함께 지워진다:
# Rollout이 지워지면 그것이 만든 ReplicaSet과 파드도 지워져 앱이 내려간다. 그래서 CRD가 지워지는 길을 둘 막아 둔다.
#   - Application을 지울 때: 이 저장소의 Application에는 삭제 finalizer가 없어 배포한 리소스가 그대로 남는다. finalizer를 붙여 지워도 ArgoCD는 CRD를 지우지 않는다.
#     keepCRDs(차트 기본값 true)가 CRD에 붙이는 helm.sh/resource-policy: keep도 ArgoCD는 Delete=false로 읽는다.
#   - prune: ArgoCD의 prune은 그 어노테이션을 보지 않고 argocd.argoproj.io/sync-options의 Prune=false만 본다. 렌더링에서 CRD가 빠지면(installCRDs를 끄는 등) prune이 CRD를 지우므로
#     crdAnnotations로 모든 CRD에 Prune=false를 붙인다. 이 CRD를 정말 없앨 때는 먼저 모든 Rollout을 Deployment로 되돌린 뒤 kubectl delete crd로 손으로 지운다.
# 차트의 CRD는 설명(description) 필드를 뺀 것이라 kubectl explain은 필드 이름만 보여 준다.
installCRDs: true
keepCRDs: true
crdAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
# --- 컨트롤러 ---
controller:
  # 파드 1개. 차트 기본값은 2개(리더 선출로 하나만 일한다)인데, 노드가 하나라 둘째 파드는 노드 장애를 막지 못하고 메모리만 쓴다. 1개이면 차트가 --leader-elect도 켜지 않는다.
  # 컨트롤러가 잠시 없어도 이미 뜬 파드는 그대로 서비스되고, 진행 중인 카나리 단계만 컨트롤러가 돌아올 때까지 멈춘다.
  # 다만 HPA가 Rollout을 가리키는 환경(prod)에서는 그동안 HPA가 바꾼 파드 수도 파드에 반영되지 않는다(Rollout의 ReplicaSet 수는 이 컨트롤러가 맞춘다).
  replicas: 1
  # Rollout·AnalysisRun·ReplicaSet·Service 등을 클러스터 전체에서 감시해 메모리에 캐시한다. 이 클러스터는 Rollout이 2개(dev·prod)뿐이라 작다.
  # 요청 64Mi는 평소 사용량으로 짐작한 값(추정)이고, 한도 192Mi는 그 세 배다: 시작할 때 감시 대상을 한꺼번에 읽어 캐시를 채우는 때와 Rollout이 늘어난 경우의 여유다.
  # 컨트롤러는 쿠버네티스 API가 없으면 시작할 때 버전 조회에 실패해 죽어서(로컬 컨테이너로 확인했다) 로컬에서는 재지 못했다.
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi
  metrics:
    # 지표를 내놓는 Service(argo-rollouts-metrics, 포트 8090)를 만든다. 차트 기본값은 꺼짐이다.
    enabled: true
    serviceMonitor:
      # Prometheus가 위 Service를 수집하게 하는 ServiceMonitor(job은 Service 이름인 argo-rollouts-metrics). rollout_info, analysis_run_info 같은 지표가 나온다.
      # kube-prometheus-stack의 Prometheus는 레이블이 없는 ServiceMonitor도 모든 네임스페이스에서 고르므로(platform/kube-prometheus-stack/values.yaml의 *SelectorNilUsesHelmValues: false) 레이블을 더하지 않는다.
      # ServiceMonitor CRD는 kube-prometheus-stack이 설치한다. 차트는 CRD가 있는지 보지 않고 이 리소스를 만들어서, 새 클러스터에서는 두 Application의 첫 동기화 순서에 걸린다.
      # 아래 어노테이션은 ArgoCD가 이 리소스 하나만은 CRD가 아직 없어도 동기화 전 검증(dry-run)을 건너뛰게 한다. 그러면 나머지(CRD, 컨트롤러, 대시보드)가 먼저 적용되고
      # 이것만 CRD가 생길 때까지 다시 시도된다. Application 전체(syncOptions)에 걸지 않은 것은 CRD가 없는 다른 종류까지 검증을 건너뛰지 않게 하려는 것이다(argocd/apps/argo-rollouts.yaml의 retry 주석).
      enabled: true
      additionalAnnotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
# --- 대시보드 ---
dashboard:
  # 웹 UI: 롤아웃의 단계와 분석 결과를 그림으로 본다. 맨 위의 네임스페이스 선택에는 Rollout이 있는 네임스페이스가 나온다.
  enabled: true
  # 대시보드의 ClusterRole에서 Rollout·Deployment 쓰기 권한(update·patch)과 AnalysisRun·Experiment 생성 권한(create)을 뺀다. 대시보드에는 인증이 없고 이 저장소는 NetworkPolicy를 두지 않아서
  # 클러스터 안의 어느 파드든 그 Service로 요청을 보낼 수 있다. 쓰기 권한이 있으면 그 요청으로 Rollout의 승격·중단·재시도·되돌리기·이미지 교체까지 된다
  # (대시보드 API의 PromoteRollout, AbortRollout, RetryRollout, UndoRollout, SetRolloutImage). 읽기 권한(get·list·watch)은 그대로고 leases의 create·get·update는 차트가 readonly와 상관없이 남긴다.
  # 그래서 화면의 승격·중단 버튼을 누르면 쿠버네티스 API가 forbidden으로 거부해 오류가 난다. 조작이 필요하면 Git으로 바꾸거나 kubectl로 한다(README).
  readonly: true
  service:
    # ClusterIP(차트 기본값)라 클러스터 안에서만 닿는다. 적어 두는 것은 NodePort·LoadBalancer(k3s에서는 노드의 포트로 열린다)로 바꾸지 않는다는 뜻이다.
    type: ClusterIP
  ingress:
    enabled: false
  httproute:
    enabled: false
  # 보는 네임스페이스의 Rollout·ReplicaSet·파드를 감시한다. 평소에는 화면을 열 때만 일한다. 같은 이미지를 쿠버네티스 API 없이 띄운 로컬 컨테이너(읽기 전용 루트 파일시스템, UID 999)에서
  # 유휴 working set이 약 15MiB였다(docker stats). 요청 32Mi는 거기에 감시 캐시의 몫을 더한 추정이고 한도 128Mi는 그 네 배의 여유다.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
# --- 끈 것 ---
# 알림(Slack 등): 차트에는 끄는 스위치가 없다. 컨트롤러의 알림 기능은 설정(서비스·템플릿·트리거를 적는 ConfigMap, 토큰을 담는 Secret)이 있어야 무엇이든 보내는데,
# 둘 다 만들지 않는다. 둘이 없으면 컨트롤러는 빈 설정으로 읽는다(notifications-engine). 업스트림의 기본 설치 파일(install.yaml)도 알림 ConfigMap 없이 설치한다.
# 알림을 쓰게 되면 토큰은 Git에 두지 않는다(Grafana 관리자 Secret처럼 부트스트랩이 만든다).
notifications:
  configmap:
    create: false
  secret:
    create: false
# 트래픽 라우터 권한: 컨트롤러의 ClusterRole에서 Istio·SMI·Ambassador·AWS ALB·App Mesh·Traefik·Apisix·Contour·Gloo·Gateway API용 규칙을 뺀다(렌더링한 ClusterRole이 약 290줄에서 약 165줄로 준다).
# 이 저장소는 트래픽 라우터 없이 파드 수의 비율로 나누는 기본 카나리만 쓰므로 그 규칙은 쓸 곳이 없다. 트래픽 라우터를 쓰게 되면 다시 켠다.
# gatewayAPI는 enabled와 따로 기본 규칙의 configmaps에 create·update를 붙인다(Gateway API 플러그인이 ConfigMap을 쓴다). 컨트롤러 본체는 ConfigMap을 읽기만 하고 업스트림의 기본 ClusterRole도 get·list·watch뿐이라 함께 끈다.
# 남는 권한 중 이 차트의 값으로 줄일 수 없는 것: 모든 네임스페이스의 Secret 읽기(분석 템플릿이 Secret을 참조할 수 있다), Job·Service·Ingress 쓰기(분석 Job, 카나리·안정 Service의 selector, Ingress 어노테이션).
providerRBAC:
  enabled: false
  providers:
    gatewayAPI: false

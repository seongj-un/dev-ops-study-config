# k3s에 들어 있는 Traefik의 설정을 바꾸는 HelmChartConfig. traefik-config Application(argocd/apps/traefik-config.yaml)이 이 디렉터리의 YAML을 그대로 적용한다.
# k3s는 노드가 뜰 때 kube-system에 HelmChart traefik을 만들고(k3s v1.35.8+k3s1의 manifests/traefik.yaml: 차트 traefik-40.1.4+up40.1.0, Traefik v3.7.8),
# k3s 안의 helm-controller(v0.17.7)가 그것을 Helm으로 설치한다. 같은 네임스페이스·같은 이름의 HelmChartConfig가 있으면 helm-controller는 그 valuesContent를
# HelmChart의 valuesContent 다음 값 파일로 넘겨(helm의 -f를 차례로 준 것과 같다. 맵은 키 단위로 합쳐지고 적지 않은 값은 그대로다) Traefik을 다시 설치(helm upgrade)한다.
# k3s의 매니페스트 파일(/var/lib/rancher/k3s/server/manifests/traefik.yaml)은 k3s가 시작할 때마다 다시 쓰므로 고쳐도 남지 않는다. 그래서 이 리소스로 바꾼다.
#
# 이 파일을 바꾸거나 지우면 helm-controller가 Traefik을 다시 설치해서 Traefik 파드가 한 번 바뀐다(롤링 업데이트: 새 파드가 Ready가 된 뒤 옛 파드를 내린다).
# 그 사이 잠깐 연결이 끊기거나, 새 파드가 Ingress를 다 읽기 전에 받은 요청이 404가 될 수 있다. 새 클러스터에서는 ArgoCD의 첫 동기화 때 한 번 일어난다.
# 지우면 Traefik이 k3s의 기본값으로 돌아가 라우터 지표가 사라지고, 엣지 경보는 아무 경고 없이 울리지 않게 된다.
#
# 바꾸는 이유: 앱의 SLI(http_server_requests)는 요청이 앱에 닿아야 잰다. 엣지 SLI는 그 앞의 Traefik에서 재서, 앱 파드가 모두 NotReady일 때 Traefik이 직접 돌려주는
# 503도 센다(앱 차트 templates/prometheusrule.yaml의 [엣지 경보]). 그러려면 아래 값이 필요하다. validate가 k3s의 값에 이 값을 얹어 Traefik 차트를 렌더링하고
# 인자에 두 값이 들어가는지 확인한다(값의 이름이 틀리면 차트가 조용히 무시한다).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  # k3s의 HelmChart와 같은 이름·네임스페이스여야 helm-controller가 이 설정을 그 차트에 합친다.
  name: traefik
  namespace: kube-system
spec:
  # 설치·업그레이드가 실패했을 때 할 일. k3s의 HelmChart traefik은 retry다: 릴리스가 실패 상태면 지우지 않고 설정이 바뀔 때 helm upgrade를 다시 한다.
  # reinstall은 릴리스가 실패 상태면 Traefik을 지웠다가(helm uninstall) 다시 설치해서 그동안 모든 Ingress가 끊긴다(Helm 작업 파드의 klipper-helm 스크립트).
  # HelmChartConfig의 이 필드는 CRD의 기본값이 reinstall이라서, 적지 않으면 API 서버가 reinstall을 채우고 helm-controller가 그 값으로 HelmChart의 retry를 덮어쓴다.
  # k3s의 값을 그대로 두려고 retry를 적는다. validate의 kubeconform은 이 리소스를 건너뛴다(고정한 CRD 스키마 모음이 retry를 모른다. validate.yml의 Traefik 단계).
  failurePolicy: retry
  valuesContent: |-
    metrics:
      prometheus:
        # 라우터 지표(traefik_router_requests_total 등. 레이블 code·method·protocol·router·service). Traefik의 기본값은 끔이다(엔트리포인트·서비스 지표만 켜져 있다).
        # 서비스 지표(traefik_service_requests_total)로는 부족하다. Traefik v3.7은 서비스 지표를 서버(파드 주소)마다의 프록시에 붙여서, 서버가 하나도 없을 때
        # 로드 밸런서가 직접 돌려주는 503(no available server)은 서비스 지표에 남지 않는다. 라우터 지표는 미들웨어와 서비스를 통째로 감싸서 그 503도 센다.
        addRoutersLabels: true
    providers:
      kubernetesIngress:
        # 엔드포인트가 없는 Service를 가리키는 Ingress에도 라우터를 만든다. 그 라우터로 온 요청은 503이고 라우터 지표에 남는다.
        # false면 Traefik이 그 라우터를 버려서 요청이 404(맞는 라우터가 없다)가 되고 라우터 지표도 사라져 엣지 경보가 울리지 않는다.
        # 차트 40.1.0의 기본값이 이미 true이고(Traefik 자체의 기본값은 false) k3s도 바꾸지 않는다. 경보가 이 동작에 기대므로 기본값이 바뀌어도 그대로이게 적어 둔다.
        allowEmptyServices: true

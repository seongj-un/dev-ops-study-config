# Loki 값: Helm 차트 grafana/loki 7.3.0 (Loki 3.6.11). ArgoCD의 loki Application(argocd/apps/loki.yaml)이 차트의 기본값 위에 이 파일을 얹어 monitoring 네임스페이스에 배포한다.
# 적지 않은 값은 그 차트 버전의 기본값이다: helm show values grafana/loki --version 7.3.0
#
# 이미지는 차트 버전이 정하는 태그를 그대로 쓴다(grafana/loki:3.6.11. 차트의 appVersion 3.6.12는 엔터프라이즈(GEL) 이미지의 태그이고,
# OSS 이미지의 태그는 차트 값 loki.image.tag의 3.6.11이다). 고정의 단위가 차트 버전인 이유는 kube-prometheus-stack 값 파일 맨 위와 같다.
# 이 차트는 2026-03-16부터 grafana/helm-charts에서 GEL 사용자용으로만 관리되고, OSS용 차트는 grafana-community/helm-charts로 옮겨 갔다(차트 README).
# enterprise.enabled가 꺼져 있으면(기본값) 7.3.0도 OSS Loki를 띄운다. 차트 버전을 올릴 때는 커뮤니티 차트로 옮길지부터 정한다.
#
# 구성: 단일 바이너리(SingleBinary) 파드 하나가 쓰기·읽기·압축(compactor)을 모두 한다. 청크와 색인은 객체 저장소(S3 등)가 아니라 그 파드의 PVC에 파일로 둔다.
# 접속: Ingress를 만들지 않는다(차트의 ingress·gateway 모두 끔). Alloy(platform/alloy/values.yaml)가 클러스터 안에서 http://loki.monitoring.svc.cluster.local:3100 으로
# 보내고, Grafana의 Loki 데이터 소스(platform/kube-prometheus-stack/values.yaml)가 같은 주소에서 읽는다. 사람은 Grafana(port-forward)로 본다.
# 리소스: 모든 컨테이너에 요청과 메모리 한도를 두고 CPU 한도는 두지 않는다(앱 차트와 같은 이유: CPU 한도는 CFS 쿼터 스로틀링을 부른다). 숫자의 근거는 singleBinary.resources 위.
#
# 이 파일에는 빈 줄을 두지 않는다(validate 워크플로가 yq '.'로 다시 써도 그대로인지 검사한다).
deploymentMode: SingleBinary
loki:
  # 테넌트 인증 없이 받는다. 켜면 쓰는 쪽과 읽는 쪽이 모두 X-Scope-OrgID 헤더로 테넌트를 밝혀야 한다. 클러스터 안에서만 닿는 단일 테넌트라 끈다(테넌트 이름은 fake가 된다).
  auth_enabled: false
  commonConfig:
    # 쓰기 복제본 수. 파드가 하나라 1이다(차트 기본값 3이면 쓰기마다 복제본 3개 중 과반(2개)이 받아야 성공이라 파드 하나로는 실패한다).
    replication_factor: 1
  storage:
    # 청크와 색인을 파드의 볼륨(/var/loki, 아래 PVC)에 파일로 둔다. 파일시스템 저장소는 파드 하나만 쓸 수 있어서 SingleBinary의 짝이다(차트가 복제본 2개 이상을 거부한다).
    type: filesystem
  # 저장 형식. tsdb 색인과 v13 스키마가 Loki 3의 권장값이고, 아래 보존 기간을 쓰려면 색인 주기가 24h여야 한다.
  # from은 이 스키마를 쓰기 시작하는 날짜다. 처음 설치라 그 전 데이터가 없으므로 지난 날짜면 된다. 스키마를 바꿀 때는 이 항목을 고치지 않고 새 날짜의 항목을 뒤에 더한다.
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  # Helm은 맵을 키 단위로 합치므로 차트가 넣는 limits_config의 다른 값(reject_old_samples 등)은 그대로 남는다.
  limits_config:
    # 보존 기간 72시간. 이보다 오래된 로그는 compactor가 지운다. Prometheus의 보존(3일)과 같다: 인스턴스를 공부하는 동안만 띄워 더 길게 둘 일이 없다.
    retention_period: 72h
    # Loki 3은 service_name 레이블이 없는 스트림에 다른 레이블(app, container 등)의 값으로 그 레이블을 붙인다. 빈 목록이면 붙이지 않는다.
    # 그래서 레이블은 Alloy가 붙인 다섯 개(namespace, pod, container, app, level)뿐이다. 대시보드도 이 다섯 개로만 고른다.
    discover_service_name: []
  compactor:
    # compactor가 보존 기간을 넘은 청크와 색인을 지운다(기본은 압축만 하고 지우지 않는다). 켜려면 삭제 요청을 기록할 곳도 정해야 한다
    # (없으면 Loki가 "compactor.delete-request-store should be configured when retention is enabled"로 시작하지 않는다).
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    # Grafana Labs로 익명 사용 통계를 보내지 않는다(기본값 true).
    reporting_enabled: false
singleBinary:
  replicas: 1
  persistence:
    # PVC. k3s의 기본 StorageClass(local-path)가 노드 디렉터리에 볼륨을 만든다. local-path는 크기를 강제하지 않아 5Gi는 표시일 뿐이고, 실제로 쌓이는 양은 보존 기간이 정한다
    # (kubectl logs --since=5m으로 재 보니 클러스터 전체 로그가 5분에 약 92KB, 하루로 치면 약 26MB였다. Loki는 이것을 압축해 청크로 쓴다).
    # 차트 기본값(enableStatefulSetAutoDeletePVC)대로 StatefulSet을 지우면 PVC도 지워진다. 로그는 다시 쌓으면 되는 데이터라 그대로 둔다.
    size: 5Gi
    storageClass: local-path
  extraEnv:
    # Go 런타임의 메모리 목표(한도 512Mi의 약 90%). 힙이 이 근처에 오면 GC를 자주 돌려 한도에 닿기 전에 메모리를 돌려받는다.
    - name: GOMEMLIMIT
      value: 460MiB
  # 같은 이미지·설정의 로컬 컨테이너(한도 512Mi)에서 잰 working set: 지금 클러스터 로그량의 약 17배(초당 5KB)를 넣을 때 115~135MiB,
  # 하루치(약 21MB)를 넣고 하루 범위의 쿼리를 돌릴 때 최고 218MiB. 요청 256Mi는 평소 사용량에 쿼리의 몫을 더한 값이고,
  # 한도 512Mi는 재시작 때 WAL을 다시 읽거나 사흘치를 훑는 쿼리를 위한 여유다.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
# SimpleScalable 모드의 대상(write·read·backend)은 0개로 둔다. 차트 기본값(각 3)이 남아 있으면 차트가 두 모드를 함께 쓰는 설정으로 보고 렌더링을 거부한다.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
# --- 끈 것 ---
# gateway: 앞단 nginx(경로 나누기·인증). 파드가 하나라 나눌 곳이 없고 인증도 쓰지 않으므로 끈다. Grafana와 Alloy는 단일 바이너리의 Service loki:3100으로 바로 닿는다.
gateway:
  enabled: false
# 청크·쿼리 결과 캐시(memcached StatefulSet 2개). 차트 기본값대로면 청크 캐시 하나가 메모리 요청 9830Mi(allocatedMemory 8192MB × 1.2)라 이 노드에 뜨지도 못한다.
# 끄면 Loki가 프로세스 안의 캐시(embedded cache: 캐시마다 최대 100MB, 항목은 1시간 뒤 만료)를 쓴다. 위 측정에서 하루 범위 쿼리 뒤 청크 캐시는 약 2MB였다(청크가 압축돼 있다).
chunksCache:
  enabled: false
resultsCache:
  enabled: false
# loki-canary(시험 로그를 넣고 읽어 보는 DaemonSet)와 그것을 쓰는 helm test 파드(ArgoCD는 helm test를 돌리지 않는다).
lokiCanary:
  enabled: false
test:
  enabled: false
# 객체 저장소 MinIO와 자기 감시(Grafana Agent Operator). 둘 다 차트 기본값이 꺼짐이지만 끈 것을 값에 드러낸다.
minio:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
# 규칙 사이드카: loki_rule 레이블이 붙은 ConfigMap·Secret을 찾아 Loki의 규칙으로 넣는 컨테이너. Loki로 경보를 만들지 않으므로 끈다.
# 켜 두면 차트가 모든 네임스페이스의 ConfigMap·Secret을 읽는 ClusterRole을 Loki의 ServiceAccount에 준다.
sidecar:
  rules:
    enabled: false
# 사이드카를 끄면 Loki는 쿠버네티스 API를 쓰지 않는다(복제본끼리는 memberlist로 찾는다). namespaced: true면 빈 ClusterRole·ClusterRoleBinding도 만들지 않고,
# ServiceAccount 토큰도 파드에 넣지 않는다.
rbac:
  namespaced: true
serviceAccount:
  automountServiceAccountToken: false

{{- /*
DB 비밀번호 Secret. database.existingSecret이 비어 있을 때만 차트가 만든다(권장 경로는 Secret을 Git 밖에서 미리 만들어 existingSecret으로 가리키는 것이다).
앱(DB_PASSWORD)과 클러스터 안의 PostgreSQL(POSTGRES_PASSWORD)이 같은 Secret의 password 키를 읽으므로 두 쪽의 비밀번호가 어긋날 수 없다.
toString은 --set database.password=12345678처럼 숫자로만 된 값을 Helm이 문자열이 아니라 정수로 읽기 때문에 넣었다(b64enc는 문자열만 받는다).
*/ -}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shortener.dbSecretName" . }}
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "app") | nindent 4 }}
type: Opaque
data:
  password: {{ required "DB 비밀번호가 없다. database.existingSecret(권장: kubectl create secret generic shortener-db --from-literal=password=<값> 으로 미리 만든 Secret의 이름) 또는 database.password 중 하나를 넣어야 한다" .Values.database.password | toString | b64enc | quote }}
{{- end }}

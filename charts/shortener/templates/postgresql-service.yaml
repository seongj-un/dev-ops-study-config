{{- /*
PostgreSQL용 Service 두 개 (postgresql.enabled=true일 때만 만든다).

1) headless Service (clusterIP: None): 가상 IP를 만들지 않고, DNS가 파드의 IP를 직접 돌려준다. StatefulSet의 serviceName이 가리키는 Service라서,
   이게 있어야 파드가 <파드 이름>.<Service 이름>.<네임스페이스>.svc라는 고정 DNS 이름을 얻는다. 앱은 이 Service를 쓰지 않는다.
   headless Service에는 로드밸런싱이 없어서 클라이언트가 컨테이너 포트로 바로 붙으므로, port도 컨테이너 포트(5432)와 같게 둔다.
2) 일반 ClusterIP Service: 앱이 DB_HOST로 쓰는 주소다. 파드가 다시 만들어져 IP가 바뀌어도 이 Service의 이름과 IP는 그대로다.
   앱이 접속하는 포트는 database.port이고, 그 포트로 들어온 요청을 컨테이너의 postgres 포트(5432)로 보낸다.
*/ -}}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shortener.fullname" . }}-postgresql-headless
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "shortener.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shortener.fullname" . }}-postgresql
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shortener.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
{{- end }}

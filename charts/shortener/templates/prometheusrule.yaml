{{- /*
SLO 규칙과 앱 파드 경보(PrometheusRule). Prometheus Operator가 이 리소스를 Prometheus의 규칙 파일로 넣고, Prometheus가 평가 주기(30초)마다 규칙을 계산한다.
그룹이 둘이다: SLO의 기록 규칙·번 레이트 경보(<릴리스>-slo, 아래 [기록 규칙]~[레이블])와 앱 파드가 하나도 없을 때의 경보(<릴리스>-pods, 맨 아래 [앱 파드 경보]).
SLO 정의 (숫자는 values.yaml의 slo):
  - SLI: 앱의 http_server_requests_seconds 히스토그램 중 이 릴리스의 것(namespace, job = 앱 Service 이름)에서 /actuator로 시작하는 요청을 뺀 것.
    actuator 요청은 사용자 요청이 아니다. 지금은 따로 둔 management 포트(8081)에서 처리되어 이 지표에 잡히지 않지만, 같은 포트로 합치면
    kubelet 프로브와 Prometheus 수집 요청이 늘 성공하는 요청으로 섞여 나쁜 요청의 비율을 묽힌다.
  - 가용성: 좋은 요청 = 상태 코드가 5xx가 아닌 요청. 4xx(없는 코드, 잘못된 URL)는 클라이언트 탓이라 예산을 쓰지 않는다. 목표 99.5%.
  - 지연: 좋은 요청 = thresholdSeconds(0.3초) 안에 끝난 요청. 목표 99%.

[기록 규칙] 나쁜 요청의 비율을 창(5분·30분·1시간·6시간)마다 미리 계산해 새 시계열로 저장한다. 알림은 이 결과를 읽기만 하므로
  6시간 rate 같은 무거운 계산을 되풀이하지 않고, 대시보드도 같은 값을 쓴다. 이름은 Prometheus 관례 <집계 수준>:<지표>:<연산>을 따른다
  (namespace_job: 결과에 남는 레이블, ratio_rate5m: 5분 rate로 구한 비율).
  - namespace_job:http_server_requests_errors:ratio_rate<창>  5xx 비율 = 5xx 요청의 rate ÷ 전체 요청의 rate
  - namespace_job:http_server_requests_slow:ratio_rate<창>    느린 요청 비율 = 1 - (le 버킷의 rate ÷ 그 버킷이 있는 계열의 요청 rate)
    히스토그램 버킷은 누적이라 le="0.3" 버킷은 0.3초 안에 끝난 요청의 수다. 그 비율을 1에서 빼면 0.3초보다 오래 걸린 요청의 비율이다.
    분모를 버킷이 있는 계열로 한정하는 이유는 아래 기록 규칙 앞의 주석에 있다.
  분자와 분모를 각각 sum by (namespace, job)으로 모든 파드·URI·상태 코드에 걸쳐 더한 뒤 나눈다. 파드별 비율을 먼저 구해 평균 내면
  요청이 적은 파드가 많은 파드와 같은 무게를 가져 틀린 값이 나온다.
  요청이 하나도 없는 창은 0 ÷ 0 = NaN이 되고, NaN과의 비교(>)는 늘 거짓이라 알림이 울리지 않는다(요청이 없으면 예산도 쓰지 않는다).

[번 레이트] 오류 예산 = 100% - 목표 (가용성 0.5%, 지연 1%). 번 레이트(소진 속도) = 나쁜 요청의 비율 ÷ 오류 예산.
  번 레이트 1은 30일(720시간)에 걸쳐 예산을 딱 다 쓰는 속도다. 그래서 "비율 > 14.4 * (1 - 목표 / 100)"은 "번 레이트 > 14.4"와 같다.
  - 14.4배로 1시간이면 30일 예산의 2%를 쓴다: 14.4 × 1시간 ÷ 720시간 = 0.02
  - 6배로 6시간이면 30일 예산의 5%를 쓴다: 6 × 6시간 ÷ 720시간 = 0.05
  Google SRE Workbook 5장(Alerting on SLOs)이 사람을 바로 부르는(page) 알림에 권하는 짝이다. 그 속도가 이어지면 예산이 약 2일(30 ÷ 14.4), 5일(30 ÷ 6) 만에 바닥난다.
  Prometheus의 보존 기간(3일)으로는 30일 동안 남은 예산을 계산할 수 없지만, 번 레이트는 가장 긴 창(6시간)만큼의 데이터만 있으면 된다.

[다중 창] 긴 창(1시간·6시간)은 "예산을 의미 있게 썼다"를 본다. 긴 창 하나만 쓰면 장애가 끝난 뒤에도 평균이 한동안 기준 위에 남아서 알림이 늦게 풀린다
  (오래 간 100% 장애가 끝난 뒤 1시간 비율이 7.2% 아래로 내려가기까지 약 56분). 그래서 긴 창의 1/12인 짧은 창(5분·30분)도 함께 기준을 넘을 때만 울린다.
  짧은 창은 "지금도 타고 있다"를 본다. 장애가 멈추면 짧은 창은 길어야 그 창 길이(5분·30분) 안에 기준 아래로 내려가므로 알림이 그만큼 빨리 풀린다(RESOLVED).
  두 짝을 or로 묶는다: 급한 장애는 1시간·5분 짝이 몇 분 안에 잡고, 느리지만 오래가는 장애(예: 5xx 4% = 예산의 8배)는 6시간·30분 짝이 잡는다.

[for: 2m] 조건이 처음 참이 되면 알림은 pending이 되고, 2분 동안 매 평가(30초 간격)에서 계속 참이어야 firing이 되어 Alertmanager로 간다.
  중간에 한 번이라도 거짓이면 pending이 풀리고 처음부터 다시 센다. 5분 창에는 표본이 10개뿐이라 파드 재시작 직후나 요청 몇 건의 순간 오류에도
  크게 흔들리는데, 평가 한두 번에만 튀는 값으로 Discord가 울리지 않게 거른다. 대가로 알림이 2분 늦다. 100% 장애라면 1시간 비율이
  7.2%를 넘는 데만 약 4.3분(0.072 × 60분)이 걸리므로, 장애가 시작되고 알림이 Alertmanager로 가기까지 약 7분이다.

[레이블] severity·service·slo는 Alertmanager의 라우팅(service="shortener"·severity="critical" → Discord)과 Discord 메시지에 쓰인다.
  namespace·job은 기록 규칙의 결과에서 이어받는다. Prometheus 하나가 dev와 prod를 함께 보므로 알림의 namespace로 환경을 구분한다
  (Alertmanager는 alertname·namespace로 알림을 묶는다). 기록 규칙과 알림이 모두 namespace·job 매처로 이 릴리스의 시계열만 고르는 것도 그래서다:
  두 환경의 규칙이 같은 이름의 시계열을 만들기 때문에, 매처가 없으면 서로의 요청까지 계산하고 상대 환경의 알림까지 울린다.

[조건부 생성] PrometheusRule과 ServiceMonitor는 kube-prometheus-stack이 설치하는 CRD다. 새 클러스터에서는 ArgoCD가 이 차트와 kube-prometheus-stack을
  동시에 동기화하는데, CRD가 생기기 전에 이 리소스를 적용하려 하면 쿠버네티스가 그 kind를 몰라 이 Application의 동기화 전체가 실패한다.
  그래서 클러스터가 그 kind를 알 때만 만든다. ArgoCD는 helm template에 클러스터의 API 목록을 "그룹/버전"과 "그룹/버전/Kind" 두 형태로 넘기고(--api-versions),
  .Capabilities.APIVersions.Has는 그 목록과 문자열을 글자 그대로 비교한다. CRD가 설치되면 목록이 바뀌는데, ArgoCD의 렌더링 캐시 키에 이 목록이 들어 있어서
  다음 주기적 새로고침(기본 2분 + 최대 1분 지터) 때 다시 렌더링되고 이 리소스가 새로 나타난다(OutOfSync). 커밋은 그대로라 같은 커밋으로는 자동 동기화가
  다시 돌지 않지만, selfHeal(argocd/apps/shortener-<환경>.yaml)이 켜져 있어서 OutOfSync가 된 리소스를 동기화해 클러스터에 만든다.

[앱 파드 경보] ShortenerNoAvailablePods: 요청을 받을 수 있는(Ready인) 앱 파드가 1분 넘게 0개면 울린다.
  SLO 경보가 보지 못하는 장애를 맡는다. SLI는 앱 안에서 잰다. 앱 파드가 모두 NotReady가 되면 앱 Service의 엔드포인트가 비고, Traefik이 요청을 앱에 보내지 못해
  503을 스스로 돌려준다. 그 요청은 앱의 지표에 남지 않아서 5xx 비율의 분모가 0이 되고(0 ÷ 0 = NaN) SLO 경보는 장애가 얼마나 이어지든 울리지 않는다.
  v4 연습(prod, DB 차단 약 5분)이 그랬다: 앱 readiness에 DB가 들어 있어서 파드가 모두 NotReady가 되었고, 사용자는 503만 받았는데 경보도 Discord 알림도 없었다.
  - 지표: 클러스터가 Rollout을 알면(_helpers.tpl의 shortener.rolloutEnabled. 이 차트가 Deployment 대신 Rollout을 만드는 조건과 같다) Argo Rollouts 컨트롤러의
    rollout_info_replicas_available(Rollout의 status.availableReplicas = 그 Rollout의 모든 ReplicaSet의 available 파드 합. 레이블 namespace·name)을 읽는다.
    Deployment를 만들 때는 kube-state-metrics의 kube_deployment_status_replicas_available(레이블 namespace·deployment)을 읽는다.
    렌더링할 때 하나를 고르므로 규칙은 늘 실제로 있는 워크로드의 지표를 본다. Argo Rollouts 컨트롤러는 ReplicaSet의 상태가 바뀔 때마다(파드가 Ready가 되거나 빠질 때)
    Rollout의 status를 다시 계산하고, 수집될 때 그 값을 내놓는다. 파드 하나가 Ready가 아닌 것과 달리, available 0은 그 환경에 요청을 받을 파드가 없다는 뜻이다.
  - 레이블: Argo Rollouts 차트의 ServiceMonitor에는 honorLabels가 없어서(Prometheus Operator의 기본값 false. platform/argo-rollouts/values.yaml) 레이블 이름이 겹치면
    Prometheus가 수집할 때 붙이는 대상 레이블이 이긴다.
    지표의 namespace(Rollout의 네임스페이스)는 exported_namespace로 이름이 바뀌어 저장되고, namespace에는 컨트롤러의 네임스페이스 argo-rollouts가 붙는다.
    그래서 Rollout은 exported_namespace·name으로 고른다(kube-state-metrics의 ServiceMonitor는 honorLabels: true라 지표의 namespace가 그대로 남는다).
  - max로 묶는다: 결과에서 수집 대상의 레이블(컨트롤러 파드의 pod·instance, namespace="argo-rollouts" 등)을 지운다. 그대로 두면 컨트롤러 파드가 다시 뜰 때마다
    pod 레이블이 바뀌어 경보가 풀렸다가 처음부터(pending) 다시 울리고, namespace도 앱의 네임스페이스가 아니게 된다. 대신 namespace·job을 경보의 labels에
    렌더링할 때 적어 넣어 SLO 경보와 같은 모양(Alertmanager가 alertname·namespace로 묶는다)이 되게 한다. 같은 이유로 요약도 Prometheus 템플릿($labels) 대신
    Helm이 네임스페이스를 적어 넣는다($labels는 식의 결과에 있는 레이블만 보이고 labels에 적은 것은 보이지 않는다).
  - for: 1m: 1분 동안 계속 0이어야 울린다. 배포 중에는 0이 되지 않는다: 카나리와 롤링 업데이트 모두 maxUnavailable 0이라 새 파드가 Ready가 되어야 옛 파드를 내린다.
    파드 하나가 죽어도(v4의 파드 삭제 연습) 다른 파드가 남아 있어 울리지 않는다. 1분은 노드의 순간 장애로 잠깐 0이 된 것을 거르면서, SLO 경보(가장 빨라도 약 7분)보다
    훨씬 빨리 알리는 값이다. DB가 죽으면 readiness 실패(5초 × 3번) + 수집(최대 30초) + 평가(최대 30초) + for 1분 + Alertmanager의 group_wait 30초로 약 2~3분 안에 Discord에 닿는다.
  - 지표가 없으면 울리지 않는다(absent를 쓰지 않는다). 계열이 없다는 것은 파드가 없다는 뜻이 아니라 잴 수 없다는 뜻이라서다: 컨트롤러나 kube-state-metrics가
    내려갔거나 아직 수집되지 않았다(워크로드가 있으면 파드가 0개여도 계열은 0으로 있다). 그때 "파드가 없다"고 Discord를 울리면 틀린 경보다. 대가로 앱 장애와 컨트롤러 장애가
    겹치면 이 경보도 조용하다(수집 대상이 내려간 것은 차트의 기본 규칙 TargetDown이 알리지만 warning이라 Discord로 가지 않는다).
  - 새 클러스터를 처음 띄울 때 앱 파드가 1분 넘게 Ready가 되지 못하면(DB가 아직 뜨는 중 등) 한 번 울릴 수 있다. 그때는 실제로 요청을 받을 파드가 없다.
    Deployment에서 Rollout으로 옮기는 동기화(README의 카나리 배포)에서는 규칙이 Rollout과 함께 Rollout의 지표로 바뀌므로, Rollout의 첫 파드가 1분 넘게 Ready가
    되지 못하면 옛 Deployment의 파드가 아직 요청을 받고 있어도 울린다(틀린 경보). dev·prod는 이미 옮겼으니 새 클러스터에서만 생길 수 있다.
*/ -}}
{{- if and .Values.slo.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
{{- $namespace := .Release.Namespace }}
{{- $job := include "shortener.fullname" . }}
{{- $le := include "shortener.sloLatencyLe" . }}
{{- $windows := list "5m" "30m" "1h" "6h" }}
{{- /* 어노테이션에 보여 줄 숫자(오류 예산 %)는 Helm이 계산한다. round는 100 - 99.9 = 0.09999999999999432 같은 부동소수점 꼬리를 자른다. */}}
{{- $availabilityBudget := round (subf 100 .Values.slo.availability.objective) 6 }}
{{- $latencyBudget := round (subf 100 .Values.slo.latency.objective) 6 }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $job }}-slo
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "app") | nindent 4 }}
spec:
  groups:
    {{- /* 한 그룹 안의 규칙은 적힌 순서대로 같은 평가 시각에 계산된다. 기록 규칙을 먼저 두어 알림이 같은 평가에서 막 계산된 비율을 읽게 한다. */}}
    - name: {{ $job }}-slo
      rules:
        {{- /*
        5xx 비율의 분자에 붙인 or 0 * (전체): 앱(Micrometer)은 상태 코드마다 계열을 그 코드의 첫 응답 때 만든다. 5xx가 한 번도 없었던 동안에는 5xx 계열이 없어서
        분자가 비고, 빈 결과를 나누면 비율도 비어 대시보드에 "데이터 없음"으로 보인다. 그때 분자를 0으로 채워 비율 0을 기록한다(요청도 없으면 0 ÷ 0 = NaN).
        */}}
        {{- range $window := $windows }}
        - record: namespace_job:http_server_requests_errors:ratio_rate{{ $window }}
          expr: |-
            (
              sum by (namespace, job) (rate(http_server_requests_seconds_count{namespace="{{ $namespace }}", job="{{ $job }}", uri!~"/actuator.*", status=~"5.."}[{{ $window }}]))
              or
              0 * sum by (namespace, job) (rate(http_server_requests_seconds_count{namespace="{{ $namespace }}", job="{{ $job }}", uri!~"/actuator.*"}[{{ $window }}]))
            )
            /
            sum by (namespace, job) (rate(http_server_requests_seconds_count{namespace="{{ $namespace }}", job="{{ $job }}", uri!~"/actuator.*"}[{{ $window }}]))
        {{- end }}
        {{- /*
        느린 요청 비율은 분자(le 버킷)와 분모(_count)를 같은 계열(파드·URI·상태 코드 조합)끼리 맞춘 뒤 더한다. 분모의 "and ignoring (le) <le 버킷>"은
        _count 계열 중에서 le 레이블만 빼고 레이블이 모두 같은 le 버킷 계열이 있는 것만 남긴다.
        그 버킷은 그 경계를 넣은 앱 버전만 내보낸다. 그 버전을 처음 배포하는 롤아웃(prod 승격 포함)이나 그 전 버전으로 되돌리는 롤백 동안에는 버킷이 없는 파드와
        있는 파드가 한 창 안에 섞인다. 분모가 모든 계열을 세면 버킷이 없는 파드의 요청은 분모에만 들어가서 전부 느린 요청으로 계산된다
        (옛 파드와 새 파드가 반씩이면 요청이 모두 빨라도 30분 비율이 약 50%가 되어 지연 알림이 울린다: tests/slo의 (f)).
        5xx 비율처럼 0으로 채우지도 않는다: 버킷이 아예 없으면(그 경계를 내보내지 않는 앱) 지연은 잴 수 없으니 비율이 비어야 맞다.
        채우면 모든 요청이 느린 것(비율 1)으로 계산되어 알림이 잘못 울린다(tests/slo의 (g)).
        */}}
        {{- range $window := $windows }}
        - record: namespace_job:http_server_requests_slow:ratio_rate{{ $window }}
          expr: |-
            1 - (
              sum by (namespace, job) (rate(http_server_requests_seconds_bucket{namespace="{{ $namespace }}", job="{{ $job }}", uri!~"/actuator.*", le="{{ $le }}"}[{{ $window }}]))
              /
              sum by (namespace, job) (
                rate(http_server_requests_seconds_count{namespace="{{ $namespace }}", job="{{ $job }}", uri!~"/actuator.*"}[{{ $window }}])
                and ignoring (le)
                rate(http_server_requests_seconds_bucket{namespace="{{ $namespace }}", job="{{ $job }}", uri!~"/actuator.*", le="{{ $le }}"}[{{ $window }}])
              )
            )
        {{- end }}
        {{- /*
        어노테이션의 {{ $labels.namespace }}와 {{ $value | humanizePercentage }}는 Helm이 아니라 Prometheus가 알림을 만들 때 채우는 자리표시자라서
        Helm이 해석하지 않도록 백틱 문자열로 감쌌다. $value는 조건식의 값(1시간 비율, 6시간 짝으로만 울렸으면 6시간 비율)이고, humanizePercentage는 0.1671을 16.71%로 쓴다.
        */}}
        - alert: ShortenerAvailabilityBudgetBurn
          expr: |-
            {{- include "shortener.sloBurnRateAlertExpr" (dict "record" "namespace_job:http_server_requests_errors" "namespace" $namespace "job" $job "objective" .Values.slo.availability.objective) | nindent 12 }}
          for: 2m
          labels:
            severity: critical
            service: shortener
            slo: availability
          annotations:
            summary: '{{`{{ $labels.namespace }}`}}: 가용성 SLO({{ .Values.slo.availability.objective }}%)의 오류 예산이 빠르게 타고 있다'
            description: >-
              5xx 응답 비율 {{`{{ $value | humanizePercentage }}`}}(1시간 창, 6시간 짝으로만 울렸으면 6시간 창).
              오류 예산은 요청의 {{ $availabilityBudget }}%다.
              1시간·5분 비율이 모두 예산의 14.4배({{ round (mulf 14.4 $availabilityBudget) 6 }}%)를 넘었거나 6시간·30분 비율이 모두 6배({{ round (mulf 6 $availabilityBudget) 6 }}%)를 넘었다.
              이 속도가 이어지면 30일치 예산이 14.4배에서는 약 2일, 6배에서는 5일 만에 바닥난다.
        - alert: ShortenerLatencyBudgetBurn
          expr: |-
            {{- include "shortener.sloBurnRateAlertExpr" (dict "record" "namespace_job:http_server_requests_slow" "namespace" $namespace "job" $job "objective" .Values.slo.latency.objective) | nindent 12 }}
          for: 2m
          labels:
            severity: critical
            service: shortener
            slo: latency
          annotations:
            summary: '{{`{{ $labels.namespace }}`}}: 지연 SLO(요청의 {{ .Values.slo.latency.objective }}%가 {{ .Values.slo.latency.thresholdSeconds }}초 안)의 오류 예산이 빠르게 타고 있다'
            description: >-
              {{ .Values.slo.latency.thresholdSeconds }}초보다 오래 걸린 응답 비율 {{`{{ $value | humanizePercentage }}`}}(1시간 창, 6시간 짝으로만 울렸으면 6시간 창).
              오류 예산은 요청의 {{ $latencyBudget }}%다.
              1시간·5분 비율이 모두 예산의 14.4배({{ round (mulf 14.4 $latencyBudget) 6 }}%)를 넘었거나 6시간·30분 비율이 모두 6배({{ round (mulf 6 $latencyBudget) 6 }}%)를 넘었다.
              이 속도가 이어지면 30일치 예산이 14.4배에서는 약 2일, 6배에서는 5일 만에 바닥난다.
    {{- /*
    앱 파드 경보(머리말의 [앱 파드 경보]). 기록 규칙을 읽지 않으므로 SLO 그룹과 따로 둔다(그룹은 서로 따로 평가된다).
    식의 지표는 렌더링할 때 고른다: Rollout을 만들면 Argo Rollouts 컨트롤러의 지표, Deployment를 만들면 kube-state-metrics의 지표다.
    labels의 namespace·job은 식이 max로 지운 레이블을 이 릴리스의 값으로 다시 붙이는 것이다(SLO 경보의 namespace·job과 같은 값).
    */}}
    {{- $rollout := include "shortener.rolloutEnabled" . }}
    - name: {{ $job }}-pods
      rules:
        - alert: ShortenerNoAvailablePods
          expr: |-
            {{- if $rollout }}
            max(rollout_info_replicas_available{exported_namespace="{{ $namespace }}", name="{{ $job }}"}) == 0
            {{- else }}
            max(kube_deployment_status_replicas_available{namespace="{{ $namespace }}", deployment="{{ $job }}"}) == 0
            {{- end }}
          for: 1m
          labels:
            severity: critical
            service: shortener
            namespace: {{ $namespace }}
            job: {{ $job }}
          annotations:
            summary: '{{ $namespace }}: 요청을 받을 수 있는 앱 파드가 1분 넘게 하나도 없다'
            description: >-
              Ready인 앱 파드가 0개라 앱 Service의 엔드포인트가 비었다. Traefik이 이 환경의 모든 요청에 503을 직접 돌려주고,
              요청이 앱까지 가지 않아서 앱의 지표로 계산하는 SLO 경보는 이 장애를 보지 못한다.
              흔한 원인은 DB 장애(앱의 readiness에 DB가 들어 있다)와 모든 파드의 시작 실패다. kubectl -n {{ $namespace }} get pods로 파드의 상태와 이벤트를 본다.
              {{- if $rollout }}
              근거 지표는 Argo Rollouts 컨트롤러의 rollout_info_replicas_available(Rollout {{ $job }})이다.
              {{- else }}
              근거 지표는 kube-state-metrics의 kube_deployment_status_replicas_available(Deployment {{ $job }})이다.
              {{- end }}
{{- end }}

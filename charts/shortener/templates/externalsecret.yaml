{{- /*
DB 비밀번호를 클러스터 안에서 만든다. database.generatePassword가 true일 때만 렌더링한다(false이면 이 파일은 아무것도 만들지 않는다).
비밀번호는 Git에도 Helm 값에도 없다: ESO(External Secrets Operator)의 Password 생성기가 무작위 32자를 만들고, ExternalSecret이 그 값을 Secret에 담는다.
Secret의 이름과 키는 다른 경로와 같다(shortener.dbSecretName, 키 password). 그래서 앱(DB_PASSWORD)과 PostgreSQL(POSTGRES_PASSWORD)은 어느 경로에서든 같은 곳을 읽는다.
이때 차트가 직접 만드는 Secret(secret.yaml)은 렌더링되지 않는다. 두 곳이 같은 이름의 Secret을 만들면 안 되기 때문이다.

[조건부 생성] ESO의 CRD(Password, ExternalSecret)가 없는 클러스터에서는 동기화가 실패한다. 그래서 이 값은 ESO를 설치한 클러스터의 환경 값 파일(environments/dev, prod)에서만 켠다.
기본값은 false라서 k3d처럼 ESO가 없는 로컬 클러스터는 existingSecret이나 password 경로를 그대로 쓴다.

[sync-wave] Password는 -2, ExternalSecret은 -1이다. 웨이브가 낮은 것부터 적용하고, 앞 웨이브의 리소스가 모두 Healthy가 되어야 다음 웨이브로 간다.
- ExternalSecret이 존재하지 않는 생성기를 가리키는 일이 없다(Password가 먼저 적용된다).
- ArgoCD는 ExternalSecret의 Ready=True(Secret이 만들어졌다는 뜻)를 기다린 뒤에 웨이브 0의 앱과 PostgreSQL을 적용한다. Secret이 없는 채로 파드가 먼저 떠서 CreateContainerConfigError가 나는 일이 없다.
- 기본 웨이브는 0이라 이 차트의 나머지 리소스는 모두 이 둘보다 뒤에 적용된다.

[SkipDryRunOnMissingResource] 새 클러스터에서 ArgoCD가 ESO의 CRD보다 먼저 동기화하면 동기화 전 검증(dry-run)이 "kind를 모른다"로 실패한다. 이 어노테이션이 있으면
CRD가 없을 때 그 검증만 건너뛰고, 적용 단계에서 실패한 것은 Application의 retry가 다시 시도한다(argocd/apps/shortener-*.yaml의 retry 주석).

[refreshPolicy: CreatedOnce] Secret을 처음 만들 때 한 번만 값을 만든다. 기본값(Periodic)이면 refreshInterval(기본 1시간)마다 생성기를 다시 불러 비밀번호가 바뀌고,
PostgreSQL의 데이터 디렉터리(PVC)에는 처음 만든 비밀번호가 그대로라 앱이 접속하지 못하게 된다. CreatedOnce에서 값이 다시 만들어지는 때는 Secret이 없어졌을 때뿐이다(지웠거나, 네임스페이스·ExternalSecret이 새로 만들어졌을 때).
그때 새 비밀번호가 나오는데 PVC가 남아 있으면 DB 안의 비밀번호와 어긋난다. 같은 위험은 손으로 만든 Secret을 지웠을 때도 있다(README의 복구 절차).

[target.template.metadata] 템플릿에 metadata를 적으면 ESO는 ExternalSecret의 레이블·어노테이션을 Secret에 복사하지 않고 여기 적은 것만 쓴다.
복사되면 ArgoCD의 추적 정보(app.kubernetes.io/instance 레이블, argocd.argoproj.io/tracking-id 어노테이션)가 Secret에 붙어 ArgoCD가 그 Secret을 자기 것으로 알고 prune할 수 있다.
그러면 비밀번호가 새로 만들어져 PVC의 것과 어긋난다. platform/external-secrets-config/grafana-admin.yaml과 같은 방식이다.

[타입] 생성기는 password 키 하나만 내놓으므로 dataFrom으로 그대로 받으면 Secret의 키가 password가 된다(앱과 PostgreSQL이 읽는 키 이름 그대로). 따로 템플릿 data를 쓰지 않는다.
*/ -}}
{{- if .Values.database.generatePassword }}
{{- if .Values.database.password }}
{{- fail "database.generatePassword와 database.password를 함께 쓸 수 없다. 비밀번호는 둘 중 하나로만 정한다: ESO가 만든 무작위 값(generatePassword) 또는 직접 정한 값(password)" }}
{{- end }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "shortener.dbSecretName" . }}
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "app") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # 길이 32, 기호 없음(기호가 없으면 URL·셸에 넣을 때 이스케이프가 필요 없다). digits는 적지 않아 길이의 25%(8자)가 숫자다.
  # allowRepeat와 noUpper는 CRD의 필수 필드라 적는다(같은 문자가 반복돼도 되고, 대문자를 쓴다).
  length: 32
  symbols: 0
  allowRepeat: true
  noUpper: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "shortener.dbSecretName" . }}
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "app") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ include "shortener.dbSecretName" . }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "shortener.dbSecretName" . }}
{{- end }}

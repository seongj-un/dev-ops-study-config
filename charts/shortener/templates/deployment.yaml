{{- /*
앱(URL 단축 서비스) Deployment. 클러스터에 Argo Rollouts가 있고 rollout.enabled가 켜져 있으면 이것 대신 Rollout(rollout.yaml)을 만든다(조건은 _helpers.tpl의 shortener.rolloutEnabled).
파드 템플릿은 Rollout과 함께 쓰는 _helpers.tpl의 shortener.appPodTemplate이다.
*/ -}}
{{- if not (include "shortener.rolloutEnabled" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shortener.fullname" . }}
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "app" "version" .Values.image.tag) | nindent 4 }}
spec:
  {{- /*
  autoscaling이 켜져 있으면 replicas를 적지 않는다. 적으면 helm upgrade·kubectl apply·ArgoCD 동기화를 할 때마다 그 값(기본 1)으로 되돌려서
  HPA가 늘려 놓은 파드 수를 덮어쓴다. 특히 ArgoCD는 selfHeal이 켜져 있으면 HPA가 바꾼 replicas를 Git과 어긋난 상태로 보고 되돌리려 하므로, HPA와 서로 값을 되돌리는 다툼이 된다.
  필드를 빼 두면 처음 만들 때만 기본값 1이 들어가고, 그 뒤로는 HPA만 이 값을 바꾼다.
  */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "shortener.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
  {{- /*
  롤링 업데이트에서 새 파드가 Ready가 되기 전에는 옛 파드를 하나도 내리지 않는다(maxUnavailable 0). 대신 새 파드를 하나 더 띄울 수 있다(maxSurge 1).
  기본값(25%)은 replicas가 적으면 0으로 내림돼 결과가 같지만, 파드 수가 4 이상이 되면 1로 올라가서 Ready 파드가 줄어든 채로 교체가 진행된다.
  */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    {{- include "shortener.appPodTemplate" . | nindent 4 }}
{{- end }}

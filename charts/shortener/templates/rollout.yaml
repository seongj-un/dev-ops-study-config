{{- /*
앱 Rollout(Argo Rollouts의 CRD). rollout.enabled가 켜져 있고 클러스터에 Argo Rollouts가 있으면 Deployment(deployment.yaml) 대신 이것을 만든다.
Rollout은 Deployment처럼 ReplicaSet으로 파드를 띄우지만, 파드 템플릿이 바뀌면 새 버전을 한 번에 바꾸지 않고 아래 strategy.canary의 단계대로 올린다.
파드 템플릿은 Deployment와 같은 _helpers.tpl의 shortener.appPodTemplate이다. Argo Rollouts는 자기가 만든 ReplicaSet과 파드에 rollouts-pod-template-hash 레이블
(파드 템플릿의 해시)을 붙여 버전(stable, 카나리)을 구분한다.

[카나리] 트래픽 라우터(서비스 메시, Ingress 컨트롤러의 가중치 기능)를 쓰지 않는 기본 카나리다. 앱 Service는 stable 파드와 카나리 파드를 구분하지 않고 함께 고르므로
  요청은 파드 수의 비율로 나뉜다. 그래서 가중치(setWeight)는 파드 수로 맞춘다.
  - 0단계 setWeight 50: 새 버전의 ReplicaSet(카나리)을 만들고 카나리를 전체 파드의 절반으로 맞춘다. 파드 2개면 카나리 1·stable 1, 3개면 카나리 2·stable 2다
    (3개는 절반으로 나뉘지 않아서 maxSurge 1로 한 개를 더 띄워 2·2를 만든다). 카나리 파드가 Ready가 되어야 다음 단계로 간다(못 되면 아래 진행 기한에 걸려 중단된다).
  - 1단계 pause 1m: 재지 않고 1분 기다리기만 하는 준비 시간이다. 카나리 파드가 요청을 받기 시작한 뒤, 분석 쿼리의 1분 창이 카나리 파드의 표본으로 찰 때까지 기다린다
    (수집 주기가 30초라 계열마다 표본이 2개는 있어야 rate가 값을 낸다. analysistemplate.yaml의 [쿼리]).
  - 2단계 analysis: 아래 [분석]이 30초 간격으로 4번 잰다(약 1분 30초). 분석이 성공으로 끝나야 다음으로 가고, 실패하면 그 자리에서 중단(abort)된다.
  - 단계가 끝나면 전체 승격: 카나리를 전체 파드 수로 늘리고 옛 stable 파드를 내린다.
  정상 버전은 카나리 파드가 Ready가 되고 약 2분 30초 뒤에 전체로 바뀐다. 5xx를 내는 버전은 처음 두 측정에서 실패하면 약 1분 30초 뒤에 중단된다.
  Rollout을 처음 만들 때(stable이 아직 없을 때)와 stable과 같은 파드 템플릿으로 되돌릴 때는 단계 없이 바로 그 버전을 전체로 띄운다.
  파드 템플릿 밖의 변경(Service, Ingress 등)은 카나리 없이 동기화하자마자 반영된다. ConfigMap의 값은 파드 템플릿의 체크섬 어노테이션을 바꾸므로 카나리를 거친다.

[분석] 2단계에서 Argo Rollouts가 AnalysisTemplate <릴리스>-error-rate(analysistemplate.yaml)로 AnalysisRun을 만든다. 단계 안에 둔 분석(inline analysis)은
  승격 앞의 관문이다: AnalysisRun이 Successful로 끝나야 그 단계가 끝나고, Failed·Error로 끝나면 Rollout이 중단된다. 그래서 끝이 있어야 한다:
  템플릿의 측정 횟수(count 4)가 끝을 정한다(횟수가 없는 지표를 단계에 쓰면 Argo Rollouts가 Rollout을 InvalidSpec으로 거부한다).
  인자 canary-hash에는 카나리 ReplicaSet의 rollouts-pod-template-hash(podTemplateHashValue: Latest)가 들어가서, 분석이 카나리 파드의 요청만 고른다.
  예전에는 같은 템플릿을 백그라운드 분석(strategy.canary.analysis, startingStep 1)으로 2분 대기와 나란히 돌렸고, 두 가지가 약했다.
    - 백그라운드 분석은 승격을 기다리게 하지 않는다. 실패하는 순간에 중단시킬 뿐이라, 대기가 끝나면 분석이 아직 판정하지 못했어도 전체로 승격했다.
      v2 연습(장애 주입 0.5)에서 분석은 2분 대기가 끝나기 얼마 전에야 실패했다. 조금 늦었다면 나쁜 버전이 모든 파드로 퍼진 뒤에 중단됐을 것이다.
    - 대기가 시작되자마자 쟀기 때문에 처음 두 측정은 카나리 파드의 1분 창이 아직 비어 있었다(빈 결과 = 성공). v2의 정상 카나리에서도 처음 두 측정은 빈 결과였고
      값은 대기 60초 뒤의 3번째 측정부터 나왔다. 그래서 나쁜 버전도 3·4번째 측정에서야 잡혔다.
  지금은 1단계가 창을 채우고 2단계의 측정 4번이 모두 카나리 파드의 요청을 잰다. 대가로 정상 버전의 카나리가 30초 길어졌다(2분 대기 → 1분 대기 + 측정 약 1분 30초).
  백그라운드 분석은 함께 두지 않는다. 2단계 뒤에 남는 것은 카나리를 전체로 늘리는 몇십 초뿐이고, 그 뒤의 오류는 SLO 경보(prometheusrule.yaml)가 본다.
  두 분석을 같이 두면 2단계 동안 같은 쿼리를 두 번씩 묻고, 어느 쪽이 중단시켰는지도 메시지로 갈라 읽어야 한다.

[중단] 트래픽 라우터가 없는 기본 카나리에서 중단은 "stable로 되돌아가는 롤링 업데이트"다: 카나리의 가중치를 0으로 보고, Ready 파드가 spec.replicas 아래로
  줄지 않게(maxUnavailable 0) stable을 원래 파드 수로 다시 늘리면서 카나리 파드를 내린다. 그래서 다시 띄운 stable 파드가 Ready가 될 때까지 카나리 파드도 요청을 받는다.
  abortScaleDownDelaySeconds(중단 뒤 카나리를 내리기 전의 대기)와 scaleDownDelaySeconds(승격 뒤 옛 파드를 내리기 전의 대기)는 트래픽 라우터가 있을 때만 쓰는 값이라
  적지 않는다. Argo Rollouts(v1.10.0)는 기본 카나리에서 두 값을 0으로 다루고, scaleDownDelaySeconds를 적으면 Rollout을 InvalidSpec으로 거부한다.
  중단된 Rollout은 Git의 파드 템플릿(나쁜 버전)을 그대로 둔 채 stable로만 돈다. Git에서 되돌리거나 고친 커밋을 올려야 다시 배포된다(README의 카나리 배포).

[조건부 생성] Rollout과 AnalysisTemplate은 Argo Rollouts의 Helm 차트가 설치하는 CRD다. 클러스터가 두 kind를 모두 알 때만 만드는 이유는 prometheusrule.yaml 머리말의
  [조건부 생성]과 같다(CRD가 없는 클러스터에서 동기화 전체가 실패하지 않게). 둘 중 하나만 확인하면 Rollout이 분석 템플릿 없이 만들어져 InvalidSpec으로 멈출 수 있다.
  ArgoCD는 API 목록을 "그룹/버전"과 "그룹/버전/Kind"로 넘기는데, argoproj.io/v1alpha1은 ArgoCD 자신의 CRD(Application 등)의 그룹/버전이라 Argo Rollouts가 없어도 늘 있다.
  그래서 Kind까지 붙인 문자열로 확인해야 한다. Argo Rollouts를 나중에 설치하면 API 목록이 바뀌어 다시 렌더링되고 Deployment가 Rollout으로 바뀐다
  (옮기는 동안 Rollout의 파드가 Ready가 될 때까지 옛 Deployment의 파드가 요청을 받게 하는 것은 argocd/apps/shortener-<환경>.yaml의 PruneLast다).
*/ -}}
{{- if include "shortener.rolloutEnabled" . }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "shortener.fullname" . }}
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "app" "version" .Values.image.tag) | nindent 4 }}
spec:
  {{- /*
  autoscaling이 켜져 있으면 replicas를 적지 않는다(이유는 deployment.yaml과 같다: HPA와 ArgoCD가 서로 값을 되돌리는 다툼을 막는다).
  비워 두면 Argo Rollouts가 처음에 1을 써 넣고(HPA가 쓰는 scale 서브리소스가 이 필드를 읽는다), 그 뒤로는 HPA만 이 값을 바꾼다.
  */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- /*
  Deployment와 같은 셀렉터 레이블이다. 앱 Service도 같은 레이블로 파드를 고르므로, Deployment에서 Rollout으로 옮기는 동안 두 쪽의 파드가 함께 요청을 받는다.
  셀렉터가 같아도 서로의 파드를 가져가지 않는다: Deployment와 Rollout은 각자 만든(ownerReferences가 자기인) ReplicaSet만 관리한다.
  */}}
  selector:
    matchLabels:
      {{- include "shortener.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
  template:
    {{- include "shortener.appPodTemplate" . | nindent 4 }}
  {{- /*
  진행 기한: 배포가 앞으로 나아가지 못한 채(새 파드가 Ready가 되는 것 같은 진전이 없이) 300초가 지나면 중단한다(progressDeadlineAbort).
  기본값은 600초가 지나도 Degraded로 표시만 하고 중단하지 않는다. 분석은 2단계에서 돌므로, 시작에 실패해 재시작을 되풀이하는(CrashLoopBackOff) 버전은
  0단계에서 멈춘 채 분석에 걸리지 않는다. 이 기한이 그런 버전을 중단한다(그동안 stable은 maxUnavailable 0이라 파드를 줄이지 않고 요청을 받는다).
  300초는 파드 하나가 Ready가 되기까지 걸릴 수 있는 시간보다 넉넉하다: 시작 프로브가 기다려 주는 최대 120초(2초 × 60번)에 새 이미지를 받는 시간과
  readiness가 처음 성공하기까지의 몇 초를 더해도 남는다. 기한은 마지막으로 나아간 때(파드 하나가 Ready가 된 때 등)부터 다시 세고,
  pause 단계와 analysis 단계에 머무는 시간은 세지 않는다(Argo Rollouts가 두 단계를 끝을 모르는 단계로 보고 기한을 검사하지 않는다).
  */}}
  progressDeadlineSeconds: 300
  progressDeadlineAbort: true
  strategy:
    canary:
      {{- /*
      Deployment의 롤링 업데이트와 같은 값이다(deployment.yaml): Ready 파드가 spec.replicas 아래로 줄지 않고(maxUnavailable 0), 파드는 최대 하나만 더 띄운다(maxSurge 1).
      기본값(둘 다 25%)도 파드 3개까지는 같은 값이 되지만 4개부터는 maxUnavailable이 1이 된다. 그래서 배포 중 앱 파드는 최대 spec.replicas + 1개이고,
      PostgreSQL 커넥션과 노드 메모리의 예산(environments/<환경>/values.yaml)이 이것을 전제로 한다.
      */}}
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause:
            duration: 1m
        - analysis:
            templates:
              - templateName: {{ include "shortener.fullname" . }}-error-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
{{- end }}

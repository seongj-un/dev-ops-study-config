{{- /*
클러스터 안의 PostgreSQL (postgresql.enabled=true일 때만 만든다).

Deployment가 아니라 StatefulSet인 이유는 데이터 디렉터리가 있는 워크로드라서다.
  - 파드 이름이 <이름>-0으로 고정되고, 파드가 다시 만들어져도 같은 PVC(data-<이름>-0)에 다시 붙는다.
  - 같은 순번의 파드는 옛 파드가 완전히 끝난 뒤에 새로 만든다. 롤링 업데이트에서 새 파드를 먼저 띄우는 Deployment와 달리,
    같은 데이터 디렉터리를 PostgreSQL 두 개가 동시에 열 일이 없다.
*/ -}}
{{- if .Values.postgresql.enabled }}
{{- /* 세 프로브가 같은 명령을 쓰므로 한 번만 만든다. toJson이 JSON 배열(YAML 흐름 시퀀스로도 유효하다)로 바꿔 주고 특수문자를 알아서 이스케이프한다. */}}
{{- $pgIsReady := toJson (list "pg_isready" "-h" "127.0.0.1" "-U" .Values.database.username "-d" .Values.database.name) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "shortener.fullname" . }}-postgresql
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  {{- /*
  serviceName은 파드에 <파드 이름>.<이 Service 이름>.<네임스페이스>.svc 형태의 안정적인 DNS 이름을 주는 headless Service의 이름이다(postgresql-service.yaml).
  StatefulSet은 이 Service가 있어야 한다. 앱이 DB에 접속하는 데 쓰는 것은 이 Service가 아니라 일반 Service다.
  */}}
  serviceName: {{ include "shortener.fullname" . }}-postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "shortener.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shortener.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shortener.fullname" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- /*
      PostgreSQL 이미지가 만들어 둔 postgres 계정으로 처음부터 실행한다(alpine 이미지에서는 UID/GID 70).
      공식 이미지는 기본으로 root로 시작해서 데이터 디렉터리의 소유자를 고친 뒤 gosu로 postgres 계정으로 내려간다. 그러려면 root와
      CHOWN·SETUID·SETGID 같은 capability가 필요하다. 처음부터 postgres로 시작하면 그 단계를 건너뛰므로, non-root에 capability를 전부 버리고
      읽기 전용 루트 파일시스템으로도 띄울 수 있다. (앱과 UID가 다른 것은 이미지마다 자기 계정이 따로 있기 때문이다.)
      fsGroup은 지정하지 않았다. 필요가 없기 때문이다: local-path 프로비저너가 볼륨 디렉터리를 누구나 쓸 수 있게(0777) 만들어 주므로
      (기본 setup 스크립트의 mkdir -m 0777. 실제 클러스터에서 볼륨 루트가 drwxrwxrwx root:root로 보인다) UID 70이 그 안에 데이터 디렉터리를 만들 수 있다.
      (k3s의 local-path StorageClass에는 defaultVolumeType: local 어노테이션이 붙어 있어서 이 볼륨은 hostPath가 아니라 local 타입 PV다.
      kubelet은 local 볼륨에는 fsGroup을 적용해 소유권을 바꿔 주므로, fsGroup을 준다면 그대로 동작한다.)
      루트가 root 소유이고 닫혀 있는 다른 종류의 볼륨을 쓴다면 fsGroup: 70이 필요하다. 그때 fsGroupChangePolicy: OnRootMismatch를 함께 주면, 볼륨 루트의
      소유권이 이미 맞을 때 파드가 시작할 때마다 볼륨 전체를 재귀적으로 chown·chmod하는 작업(파일이 많으면 오래 걸린다)을 건너뛴다.
      (기본값 Always여도 PostgreSQL은 뜬다. 이미지의 엔트리포인트가 시작할 때마다 데이터 디렉터리 권한을 0700으로 되돌리기 때문이다.)
      */}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- /*
          args는 이미지의 CMD(postgres)를 대신한다. 이미지의 엔트리포인트(docker-entrypoint.sh)는 첫 인자가 -로 시작하면 앞에 postgres를 붙여 실행하므로,
          -c 이름=값만 넘겨도 "postgres -c shared_buffers=32MB ..."가 된다. 값의 이유는 values.yaml의 postgresql.args에 적었다.
          */}}
          {{- with .Values.postgresql.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            {{- /*
            공식 이미지는 데이터 디렉터리가 비어 있을 때(처음 시작할 때) 이 값들로 DB와 계정을 만든다. 이미 초기화된 볼륨에서는 이 값들을 읽지 않는다.
            그래서 나중에 Secret의 비밀번호를 바꿔도 DB 안의 비밀번호는 그대로이고, 앱은 새 비밀번호로 접속하다 인증에 실패한다.
            (비밀번호를 바꾸려면 psql에서 ALTER USER를 하거나, PVC를 지우고 처음부터 다시 만든다.)
            */}}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shortener.dbSecretName" . }}
                  key: password
          {{- /*
          프로브는 pg_isready로 서버가 접속을 받는지 본다(로그인은 하지 않는다). 세 프로브 모두 -h 127.0.0.1로 TCP 연결을 확인한다.
          공식 이미지는 첫 기동 때 초기화용 임시 서버를 listen_addresses=''로 띄워 유닉스 소켓으로만 접속을 받는데, 소켓으로 확인하면 그 임시 서버가 떠 있는 동안에도
          ready로 나온다. 그러면 TCP로 붙는 앱(Service를 거친다)이 초기화가 끝나기 전에 트래픽을 받게 된다 (앱 저장소 compose.yaml의 healthcheck와 같은 이유다).
          exec 프로브에도 timeoutSeconds가 적용되고(기본 1초) pg_isready 자체의 기본 대기는 3초라서, 5초로 늘렸다.
          startupProbe: 첫 기동의 데이터 디렉터리 초기화(initdb)나 비정상 종료 뒤의 복구가 끝날 때까지 liveness가 개입하지 않게 한다. 5초마다 최대 30번(150초)이다.
          */}}
          startupProbe:
            exec:
              command: {{ $pgIsReady }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          {{- /* livenessProbe: DB는 재시작 비용이 크므로(다시 시작하면 접속이 모두 끊긴다) 일시적 지연으로 죽이지 않게 60초(10초 × 6번) 연속 실패해야 재시작한다. */}}
          livenessProbe:
            exec:
              command: {{ $pgIsReady }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: {{ $pgIsReady }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          {{- /*
          컨테이너 보안 설정은 앱과 같은 의미다(deployment.yaml 참고). 읽기 전용 루트 파일시스템에서 PostgreSQL이 쓰는 곳은
          데이터 볼륨과 /var/run/postgresql(유닉스 소켓·잠금 파일)뿐이다. 같은 설정으로 docker run --read-only 컨테이너를 띄워 확인했다:
          /var/run/postgresql을 쓰기 가능하게 열지 않으면 "could not create lock file ... Read-only file system"으로 서버가 시작하지 못하고, /tmp는 필요 없다.
          */}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            {{- /*
            데이터 볼륨은 PGDATA가 아니라 그 상위인 /var/lib/postgresql에 붙인다 (앱 저장소 compose.yaml과 같다). PostgreSQL 18 이미지부터 PGDATA가
            /var/lib/postgresql/18/docker로 바뀌어 메이저 버전별 하위 디렉터리를 쓰기 때문이다. 볼륨 루트를 PGDATA로 쓰면 initdb는
            비어 있지 않은 디렉터리(예: ext4 볼륨의 lost+found)를 거부하는데, 상위를 붙이면 PGDATA는 볼륨 안의 하위 디렉터리라 이 문제가 없다.
            */}}
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        {{- /* 파드가 뜰 때 빈 디렉터리로 만들어지고 파드가 사라지면 함께 지워지는 임시 디렉터리다. 소켓·잠금 파일은 PostgreSQL이 시작할 때마다 다시 만든다. */}}
        - name: run
          emptyDir: {}
  {{- /*
  volumeClaimTemplates: 파드마다 PVC를 자동으로 만든다(이름은 data-<StatefulSet 이름>-<순번>). StatefulSet을 지워도(helm uninstall이든 ArgoCD의 prune이든)
  이 PVC는 지워지지 않는다(persistentVolumeClaimRetentionPolicy의 기본값이 Retain이다). 실수로 데이터가 사라지지 않게 하려는 기본 동작이고,
  같은 이름으로 다시 만들면 이 PVC에 다시 붙는다(그때 POSTGRES_PASSWORD가 무시되므로 옛 비밀번호가 남아 있다). 데이터까지 지우려면 PVC를 직접 지운다.
  이 템플릿은 StatefulSet을 만든 뒤에는 바꿀 수 없다(쿠버네티스가 helm upgrade와 ArgoCD 동기화를 거부한다).
  storageClassName을 비우면(값을 주지 않으면) 클러스터의 기본 StorageClass를 쓴다. 빈 문자열("")을 적으면 오히려 기본 클래스를 쓰지 않는 뜻이 되므로 필드를 아예 뺀다.
  */}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | quote }}
{{- end }}

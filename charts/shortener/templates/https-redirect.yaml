{{- /*
HTTP→HTTPS 리다이렉트(Traefik의 Middleware, traefik.io/v1alpha1). Ingress(ingress.yaml)가 어노테이션 traefik.ingress.kubernetes.io/router.middlewares로 이것을 가리킨다.

[하는 일] redirectScheme은 요청의 URL을 https://<같은 호스트><같은 경로>로 바꿔 Location 헤더로 돌려준다. port를 적지 않아 443이고 주소에 포트가 붙지 않는다.
  permanent: true이면 GET은 301, 그 밖의 메서드는 308이다(Traefik v3.7.8의 pkg/middlewares/redirect/redirect.go). 308은 메서드와 본문을 그대로 다시 보내라는 뜻이라
  http로 보낸 POST /api/v1/urls도 https로 같은 POST가 된다(301·302는 클라이언트가 GET으로 바꿀 수 있다).
  영구 리다이렉트라 브라우저가 301을 기억한다. 이 주소를 다시 평문 HTTP로만 쓰게 될 일은 없다고 보고 받아들인다.
  HSTS(브라우저에게 이 호스트는 앞으로 https로만 오라고 알리는 헤더)는 붙이지 않는다. staging 인증서인 동안 붙이면 브라우저가 경고를 넘어가는 길까지 막는다.

[어디에 걸리나] k3s의 Traefik은 Ingress 하나로 라우터를 entrypoint마다 만든다: web(80)과 websecure(443. 이 entrypoint에 TLS가 켜져 있어 그 라우터는 TLS로 받는다).
  미들웨어는 두 라우터에 모두 붙는다. https로 온 요청은 바꿀 URL이 지금 URL과 같아서 리다이렉트하지 않고 그대로 앱으로 넘긴다(같은 redirect.go). 그래서 80만 돌려보낸다.
  Traefik은 신뢰하지 않는 클라이언트가 보낸 X-Forwarded-Proto를 지우고 다시 채우므로(forwardedHeaders 기본값) 헤더로 리다이렉트를 건너뛸 수 없다.
  ACME HTTP-01 검증 요청(http://<호스트>/.well-known/acme-challenge/<토큰>)은 cert-manager가 따로 만드는 Ingress로 가므로 이 미들웨어를 거치지 않는다(ingress.yaml 머리말).

[조건부 생성] Middleware는 Traefik이 설치하는 CRD다(k3s는 노드가 뜰 때 traefik-crd 차트로 설치한다). 클러스터가 traefik.io/v1alpha1/Middleware kind를 알 때만 만들고,
  ingress.yaml도 같은 조건(_helpers.tpl의 shortener.httpsRedirectEnabled)일 때만 이것을 가리킨다. 조건을 묻는 방법은 prometheusrule.yaml 머리말의 [조건부 생성]과 같다
  (ArgoCD가 클러스터의 API를 "그룹/버전/Kind"로도 넘기고, Has는 글자 그대로 비교한다). Traefik이 없는 클러스터에서는 리다이렉트 없이 TLS만 붙는다.

[sync-wave -1] ArgoCD는 한 웨이브 안에서 내장 kind(Ingress)를 CRD kind(Middleware)보다 먼저 적용한다. 리다이렉트를 처음 켜는 동기화에서 Ingress의 어노테이션이 먼저 생기면
  Traefik은 없는 미들웨어를 가리키는 라우터를 오류로 버려서 Middleware가 생길 때까지 그 호스트가 404다(Traefik v3.7.8 pkg/server/router/router.go). 동기화가 그 사이에 실패하면 404가 이어진다.
  한 웨이브 앞에 두면 ArgoCD가 이것을 먼저 만든 뒤에 Ingress를 적용한다(Middleware에는 건강 상태가 없어 기다리지 않는다. AnalysisTemplate의 sync-wave -1과 같은 방법).
  끌 때는 반대 순서가 필요한데, Application의 PruneLast=true가 지우는 것을 동기화의 맨 끝으로 미뤄 Ingress에서 어노테이션이 먼저 빠진다.
*/ -}}
{{- if include "shortener.httpsRedirectEnabled" . }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "shortener.httpsRedirectName" . }}
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "app") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}

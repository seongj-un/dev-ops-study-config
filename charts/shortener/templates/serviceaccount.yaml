{{- /*
앱·PostgreSQL·Redis·테스트 파드가 함께 쓰는 ServiceAccount.
이 파드들은 쿠버네티스 API를 호출하지 않는다. ServiceAccount 토큰이 파드에 마운트되면(기본값) 컨테이너가 뚫렸을 때 공격자가 그 토큰으로
API 서버에 접근할 수 있으므로, 마운트하지 않는다. 파드 스펙에도 같은 설정을 적는다(둘 다 적으면 파드 쪽이 우선한다).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shortener.fullname" . }}
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "app") | nindent 4 }}
automountServiceAccountToken: false

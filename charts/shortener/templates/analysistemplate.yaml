{{- /*
카나리 분석 템플릿(Argo Rollouts의 AnalysisTemplate). Rollout(rollout.yaml)이 카나리의 1단계부터 이것으로 AnalysisRun을 만들고, Argo Rollouts 컨트롤러가
30초마다 Prometheus에 아래 쿼리를 물어 그 결과를 successCondition으로 판정한다. 만드는 조건은 Rollout과 같다(_helpers.tpl의 shortener.rolloutEnabled).

[쿼리] 카나리 파드의 최근 1분 5xx 비율 = 5xx 요청의 rate ÷ 전체 요청의 rate. SLO 규칙의 5xx 비율(prometheusrule.yaml)과 같은 모양이고 두 가지가 다르다.
  - 파드: rollouts_pod_template_hash가 카나리 ReplicaSet의 해시인 계열만 고른다. ServiceMonitor의 podTargetLabels가 파드 레이블 rollouts-pod-template-hash를
    수집한 계열에 붙인다(Prometheus 레이블 이름에는 -를 쓸 수 없어 _로 바뀐다). stable 파드의 요청은 섞지 않는다: 새 버전 탓이 아닌 오류로 카나리를 떨어뜨리지 않고,
    stable의 정상 요청이 비율을 묽혀 카나리의 오류를 놓치지도 않는다.
  - 창: 1분. 2분 대기 동안 여러 번 판정하려면 짧아야 한다. 수집 주기가 30초라 1분 창에는 계열마다 표본이 2개쯤 있는데, rate는 표본이 2개 이상일 때만 값을 낸다.
    그래서 카나리 파드가 처음 수집되고 30초쯤 지나야 값이 나오고, 수집이 한 번 늦거나 빠지면 그 측정은 비거나 일부 계열만으로 계산될 수 있다.
  /actuator로 시작하는 요청을 빼는 이유와 분자를 0으로 채우는 방법은 SLO 규칙과 같다. 0으로 채우면 요청이 있었고 5xx가 없었던 측정은 0으로 남아서,
  잴 요청이 없었던 측정(빈 결과, 아래)과 AnalysisRun의 측정값에서 구분된다.
  {{args.canary-hash}}는 Helm이 아니라 Argo Rollouts가 AnalysisRun을 만들 때 채우는 자리표시자라서, Helm이 해석하지 않도록 백틱 문자열로 감쌌다.

[판정] successCondition이 참이면 그 측정은 성공, 거짓이면 실패다(failureCondition을 따로 두지 않았다). result는 쿼리 결과의 값 목록이다.
  - 5xx 비율이 5% 미만이면 성공, 5% 이상이면 실패다.
  - 결과가 NaN이거나(카나리 파드가 요청을 받은 적은 있지만 최근 1분에는 없다: 0 ÷ 0) 비어 있으면(한 번도 요청을 받지 않아 계열이 없거나 아직 수집 전이다) 성공으로 센다.
    요청이 없으면 판단할 근거가 없어서다. 조건에 적지 않으면 NaN은 비교가 늘 거짓이라 실패가 되고, 빈 결과는 result[0]을 읽지 못해 측정 오류가 된다.
    대가로 카나리 동안 요청이 없으면 나쁜 버전도 통과한다. 연습에서 나쁜 버전을 잡으려면 카나리 동안 요청을 흘린다(README의 카나리 배포).
  - failureLimit 1: 실패한 측정 1번만 봐주고 2번째 실패에서 분석이 실패해 Rollout이 중단된다(실패가 연달아야 하는 것은 아니다). 2분 대기(측정 4~5번) 안에 판정이 끝나게 한 값이다.
    30초마다 1분 창을 재므로 이웃한 두 측정의 창은 30초씩 겹친다. 그래서 30초보다 짧은 5xx 몰림 하나도 그 겹친 구간에 들면 두 측정에 함께 잡혀
    연달아 실패하고, 그것만으로 중단될 수 있다. 봐주는 것은 측정 한 번의 실패이지 짧은 몰림 한 번이 아니다.
  - Prometheus에 닿지 않거나 쿼리가 실패하면 측정 오류다. 오류가 5번 이어지면(consecutiveErrorLimit 기본값 4를 넘으면) 분석이 Error가 되고, 이때도 Rollout은 중단된다.

[sync-wave -1] ArgoCD는 한 웨이브 안에서 리소스를 kind 순서로 적용하는데, CRD의 kind는 모두 맨 뒤에 두고 그 안에서는 이름순이라 Rollout(<릴리스>)을
  이것(<릴리스>-error-rate)보다 먼저 만든다. Argo Rollouts가 이것이 생기기 전에 Rollout을 보면 "AnalysisTemplate not found"로 Rollout을 InvalidSpec(Degraded)으로 두고
  다시 본다(늦으면 20초 뒤). 이미 이것이 있는 평소의 배포에는 상관없지만, Deployment에서 Rollout으로 처음 옮기는 동기화는 PruneLast 때문에 Rollout이 Healthy가 되기를
  기다리다가 Degraded를 보면 실패한다. 한 웨이브 앞(-1)에 두면 ArgoCD가 이것을 먼저 만든 뒤에 나머지를 적용한다(AnalysisTemplate에는 건강 상태가 없어 기다리지 않는다).
*/ -}}
{{- if include "shortener.rolloutEnabled" . }}
{{- $namespace := .Release.Namespace }}
{{- $job := include "shortener.fullname" . }}
{{- $canaryHash := `{{args.canary-hash}}` }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $job }}-error-rate
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "app") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  args:
    - name: canary-hash
  metrics:
    - name: error-rate
      interval: 30s
      failureLimit: 1
      successCondition: "len(result) == 0 || isNaN(result[0]) || result[0] < 0.05"
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: |-
            (
              sum by (namespace, job) (rate(http_server_requests_seconds_count{namespace="{{ $namespace }}", job="{{ $job }}", rollouts_pod_template_hash="{{ $canaryHash }}", uri!~"/actuator.*", status=~"5.."}[1m]))
              or
              0 * sum by (namespace, job) (rate(http_server_requests_seconds_count{namespace="{{ $namespace }}", job="{{ $job }}", rollouts_pod_template_hash="{{ $canaryHash }}", uri!~"/actuator.*"}[1m]))
            )
            /
            sum by (namespace, job) (rate(http_server_requests_seconds_count{namespace="{{ $namespace }}", job="{{ $job }}", rollouts_pod_template_hash="{{ $canaryHash }}", uri!~"/actuator.*"}[1m]))
{{- end }}

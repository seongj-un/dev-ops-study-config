{{- /*
Ingress: 클러스터 밖의 HTTP 요청을 Service로 이어 주는 규칙이다. 규칙을 실제로 처리하는 것은 Ingress 컨트롤러(k3s에서는 Traefik)다.
호스트 이름(Host 헤더)이 ingress.host와 같고 경로가 /로 시작하는 요청(Prefix)을 앱 Service의 80번 포트(http)로 보낸다.
management 포트(8081)는 라우팅하지 않으므로 actuator 엔드포인트는 클러스터 밖에서 닿지 않는다.

[TLS] ingress.tls.enabled이면 둘을 더한다.
  - spec.tls: 이 호스트의 인증서가 Secret <fullname>-tls에 있다고 알린다. Traefik은 그 Secret의 인증서를 읽어 443 포트에서 SNI가 이 호스트인 연결에 내놓는다.
    Secret이 아직 없으면(첫 발급 전) Traefik은 오류를 남기고 자기 기본 자체 서명 인증서로 응답한다. 라우팅은 그대로라서 80 포트는 계속 동작한다.
  - 어노테이션 cert-manager.io/cluster-issuer: cert-manager의 ingress-shim이 이것을 보고 Certificate(이름은 secretName과 같은 <fullname>-tls, 인증서에 넣을 도메인은 spec.tls의 hosts)를
    이 네임스페이스에 만들고 소유자를 이 Ingress로 둔다. 인증서를 받으면 그 Secret을 만들고, 만료 30일 전(수명 90일의 1/3)에 갱신한다. Secret은 ArgoCD가 추적하지 않아 prune되지 않는다.
[HTTP→HTTPS] shortener.httpsRedirectEnabled이면 Traefik 어노테이션 router.middlewares로 리다이렉트 미들웨어(https-redirect.yaml)를 이 Ingress의 라우터에 붙인다.
  값의 형식은 <미들웨어의 네임스페이스>-<이름>@kubernetescrd다(Traefik의 kubernetescrd 공급자가 Middleware를 그 이름으로 등록한다). 네임스페이스는 이 릴리스의 것(.Release.Namespace.
  ArgoCD에서는 Application의 destination.namespace)이고 Middleware도 같은 네임스페이스에 만들어지므로 다른 네임스페이스를 가리키지 않는다.
[ACME HTTP-01 검증은 리다이렉트되지 않는다] 검증하는 동안 cert-manager는 같은 호스트에 경로 /.well-known/acme-challenge/<토큰>(pathType Exact)만 가진 Ingress를 따로 만든다.
  그 Ingress에는 이 어노테이션이 없어서 리다이렉트가 붙지 않는다. Traefik은 같은 요청에 맞는 라우터가 여럿이면 규칙 문자열이 긴 쪽(우선순위의 기본값이 규칙의 길이)을 고르는데,
  검증 Ingress의 규칙(Host + 긴 Path)이 이 Ingress의 규칙(Host + PathPrefix("/"))보다 길어서 검증 요청은 80 포트에서 그대로 검증용 파드로 간다.
*/ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shortener.fullname" . }}
  labels:
    {{- include "shortener.labels" (dict "ctx" . "component" "app" "version" .Values.image.tag) | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ required "ingress.tls.enabled가 true이면 인증서를 받을 ClusterIssuer 이름(ingress.tls.clusterIssuer)을 넣어야 한다: letsencrypt-staging 또는 letsencrypt-prod" .Values.ingress.tls.clusterIssuer | quote }}
    {{- if include "shortener.httpsRedirectEnabled" . }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace (include "shortener.httpsRedirectName" .) | quote }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "shortener.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "shortener.fullname" . }}
                port:
                  number: 80
{{- end }}

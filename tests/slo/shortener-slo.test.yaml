# 앱 SLO 규칙(charts/shortener/templates/prometheusrule.yaml)의 단위 테스트. promtool이 가짜 시계열(input_series)을 넣고 규칙을 평가해서,
# 정한 시각(eval_time)에 울리는 알림(alert_rule_test)과 PromQL 결과(promql_expr_test)를 기대값과 비교한다.
# 규칙 파일은 저장소에 없고 차트를 렌더링해서 만든다(rendered/는 .gitignore). validate 워크플로의 "SLO 규칙 검사" 단계가 하는 일을 로컬에서 하려면 저장소 루트에서:
#   KUBERNETES_VERSION=$(yq '.jobs.validate.env.KUBERNETES_VERSION' .github/workflows/validate.yml)
#   PROMETHEUS_IMAGE=$(yq '.jobs.validate.steps[] | select(.env.PROMETHEUS_IMAGE) | .env.PROMETHEUS_IMAGE' .github/workflows/validate.yml)
#   mkdir -p tests/slo/rendered
#   for e in dev prod; do
#     helm template shortener-$e charts/shortener -n shortener-$e --kube-version "$KUBERNETES_VERSION" \
#       --api-versions monitoring.coreos.com/v1/PrometheusRule -f environments/$e/values.yaml \
#       | yq 'select(.kind == "PrometheusRule") | .spec' > tests/slo/rendered/shortener-$e.yaml
#   done
#   docker run --rm -v "$PWD/tests/slo:/slo:ro" --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" test rules /slo/shortener-slo.test.yaml
#
# 두 환경의 규칙 파일을 함께 읽는다. 실제 Prometheus도 하나가 dev와 prod를 함께 보므로, 한 환경의 장애가 다른 환경의 알림을 울리지 않는지도 함께 본다.
# 시계열의 레이블은 앱이 실제로 내보내는 것 중 규칙에 필요한 것만 적었다(application·outcome·exception·error 레이블은 규칙이 sum by (namespace, job)으로 합쳐 버린다).
# 버킷도 규칙이 쓰는 le="0.3"만 넣었다(앱은 le="0.1", "0.3", "1.0"과 퍼센타일 히스토그램 버킷을 함께 내보낸다).
# 값 표기: 'a+bxn'은 a에서 시작해 b씩 n번 늘린 n+1개의 표본, 'axn'은 a를 n+1번 되풀이한 것이다. 표본 간격(interval)과 평가 주기는 1분이다
# (클러스터는 둘 다 30초다. 1분이면 시각을 분 단위로 읽기 쉽고, 창과 for: 2m의 의미는 같다).
# 시나리오의 서비스는 분당 1000건을 받는다. 장애 전에 6시간의 정상 이력을 넣은 것은 Prometheus를 막 띄웠을 때처럼 이력이 짧으면
# 6시간 창도 그 짧은 이력만으로 계산되어(rate는 창 안에 있는 표본만 쓴다) 6시간·30분 짝이 1시간·5분 짝보다 먼저 울리기 때문이다.
# promql_expr_test의 round(…, 0.0001)은 부동소수점 꼬리(0.2가 0.20000000000000007로 나오는 것)를 잘라 기대값과 정확히 비교하려는 것이다.
rule_files:
  - rendered/shortener-dev.yaml
  - rendered/shortener-prod.yaml
evaluation_interval: 1m
tests:
  - name: (a) dev에서 모든 요청이 5xx가 되면 가용성 알림이 7분 뒤에 울리고, 10분째에도 울리고 있다 (prod는 조용하다)
    interval: 1m
    input_series:
      # dev: 360분까지 정상(201), 그 뒤 10분 동안 모든 요청이 500이다(DB 장애 같은 경우). 빠르게 실패해서 0.3초 안에 끝난다.
      # 500 계열은 처음부터 0으로 있다고 두었다(실제 앱은 첫 5xx 때 계열을 만든다).
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="201"}'
        values: '0+1000x360 360000x9'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="201", le="0.3"}'
        values: '0+1000x360 360000x9'
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="500"}'
        values: '0x360 1000+1000x9'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="500", le="0.3"}'
        values: '0x360 1000+1000x9'
      # prod: 내내 정상
      - series: 'http_server_requests_seconds_count{namespace="shortener-prod", job="shortener-prod", method="POST", uri="/api/v1/urls", status="201"}'
        values: '0+1000x370'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-prod", job="shortener-prod", method="POST", uri="/api/v1/urls", status="201", le="0.3"}'
        values: '0+1000x370'
    promql_expr_test:
      # 364분(장애 4분째): 5분 비율은 100%지만 1시간 비율이 아직 7.2%(예산 0.5%의 14.4배) 아래라 조건이 거짓이다. pending도 아니다.
      - expr: ALERTS{alertname="ShortenerAvailabilityBudgetBurn"}
        eval_time: 364m
        exp_samples: []
      # 366분: 365분부터 조건이 참이지만 for: 2m를 아직 채우지 못해 pending이다. ALERTS는 Prometheus가 pending·firing 알림마다 기록하는 시계열이다.
      - expr: ALERTS{alertname="ShortenerAvailabilityBudgetBurn"}
        eval_time: 366m
        exp_samples:
          - labels: 'ALERTS{alertname="ShortenerAvailabilityBudgetBurn", alertstate="pending", namespace="shortener-dev", job="shortener-dev", severity="critical", service="shortener", slo="availability"}'
            value: 1
      # 367분(장애 7분째): 2분 동안 계속 참이라 firing이 되어 Alertmanager로 간다.
      - expr: ALERTS{alertname="ShortenerAvailabilityBudgetBurn"}
        eval_time: 367m
        exp_samples:
          - labels: 'ALERTS{alertname="ShortenerAvailabilityBudgetBurn", alertstate="firing", namespace="shortener-dev", job="shortener-dev", severity="critical", service="shortener", slo="availability"}'
            value: 1
    alert_rule_test:
      # 370분(장애 10분째): dev의 알림 하나만 울린다. 값은 1시간 비율이다(6시간 비율은 약 2.8%로 아직 3% 아래).
      # 16.71%가 10분 ÷ 60분 = 16.67%와 조금 다른 것은 rate가 창의 시작과 창 안 첫 표본 사이를 평균 기울기로 외삽하기 때문이다(0에서 시작한 500 계열은 0 아래로 외삽하지 않는다).
      - eval_time: 370m
        alertname: ShortenerAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              namespace: shortener-dev
              job: shortener-dev
              severity: critical
              service: shortener
              slo: availability
            exp_annotations:
              summary: 'shortener-dev: 가용성 SLO(99.5%)의 오류 예산이 빠르게 타고 있다'
              description: >-
                5xx 응답 비율 16.71%(1시간 창, 6시간 짝으로만 울렸으면 6시간 창).
                오류 예산은 요청의 0.5%다.
                1시간·5분 비율이 모두 예산의 14.4배(7.2%)를 넘었거나 6시간·30분 비율이 모두 6배(3%)를 넘었다.
                이 속도가 이어지면 30일치 예산이 14.4배에서는 약 2일, 6배에서는 5일 만에 바닥난다.
      # 실패한 요청도 0.3초 안에 끝났으므로 지연 알림은 울리지 않는다.
      - eval_time: 370m
        alertname: ShortenerLatencyBudgetBurn
        exp_alerts: []

  - name: (b) 5xx가 0.1%(예산 0.5%의 0.2배)면 6시간이 넘게 이어져도 울리지 않는다
    interval: 1m
    input_series:
      # dev: 분당 999건 201, 1건 500
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="201"}'
        values: '0+999x370'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="201", le="0.3"}'
        values: '0+999x370'
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="500"}'
        values: '0+1x370'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="500", le="0.3"}'
        values: '0+1x370'
    promql_expr_test:
      # 기록 규칙이 6시간 창에서 0.1%를 계산한다.
      - expr: round(namespace_job:http_server_requests_errors:ratio_rate6h, 0.0001)
        eval_time: 370m
        exp_samples:
          - labels: '{namespace="shortener-dev", job="shortener-dev"}'
            value: 0.001
      # 370분 동안 한 번도 pending조차 되지 않았다.
      - expr: count_over_time(ALERTS{alertname=~"Shortener.*"}[370m])
        eval_time: 370m
        exp_samples: []
    alert_rule_test:
      - eval_time: 370m
        alertname: ShortenerAvailabilityBudgetBurn
        exp_alerts: []

  - name: (c) prod에서 요청의 20%가 0.3초를 넘기면 지연 알림이 울린다 (dev는 조용하다)
    interval: 1m
    input_series:
      # prod: 360분까지 모든 리다이렉트(302)가 0.3초 안, 그 뒤 분당 1000건 중 800건만 0.3초 안(le="0.3" 버킷)이고 200건(20%)은 더 걸린다. 5xx는 없다.
      - series: 'http_server_requests_seconds_count{namespace="shortener-prod", job="shortener-prod", method="GET", uri="/{code:[0-9a-zA-Z]+}", status="302"}'
        values: '0+1000x420'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-prod", job="shortener-prod", method="GET", uri="/{code:[0-9a-zA-Z]+}", status="302", le="0.3"}'
        values: '0+1000x360 360800+800x59'
      # dev: 내내 정상
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", method="GET", uri="/{code:[0-9a-zA-Z]+}", status="302"}'
        values: '0+1000x420'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", method="GET", uri="/{code:[0-9a-zA-Z]+}", status="302", le="0.3"}'
        values: '0+1000x420'
    promql_expr_test:
      # 420분: 1시간 창이 모두 느려진 뒤라 느린 요청 비율이 정확히 20%다. dev는 0이다(5xx가 없는 dev·prod의 오류 비율도 0으로 기록된다).
      - expr: round(namespace_job:http_server_requests_slow:ratio_rate1h, 0.0001)
        eval_time: 420m
        exp_samples:
          - labels: '{namespace="shortener-prod", job="shortener-prod"}'
            value: 0.2
          - labels: '{namespace="shortener-dev", job="shortener-dev"}'
            value: 0
      - expr: namespace_job:http_server_requests_errors:ratio_rate1h
        eval_time: 420m
        exp_samples:
          - labels: 'namespace_job:http_server_requests_errors:ratio_rate1h{namespace="shortener-prod", job="shortener-prod"}'
            value: 0
          - labels: 'namespace_job:http_server_requests_errors:ratio_rate1h{namespace="shortener-dev", job="shortener-dev"}'
            value: 0
    alert_rule_test:
      # 400분(느려진 지 40분): 1시간 비율이 약 13.3%로 14.4%(예산 1%의 14.4배) 아래이고, 6시간 비율(약 2.2%)도 6% 아래라 아직 울리지 않는다.
      - eval_time: 400m
        alertname: ShortenerLatencyBudgetBurn
        exp_alerts: []
      # 420분: 1시간 비율이 느려진 지 약 43분(14.4 ÷ 20 × 60분 = 43.2분. rate의 외삽 때문에 실제로는 403분)에 14.4%를 넘었고, 2분 뒤부터 울리고 있다.
      # prod의 알림 하나뿐이다. 값은 1시간 비율이고, 이때는 1시간 창 전체가 느려진 뒤라 정확히 20%다.
      - eval_time: 420m
        alertname: ShortenerLatencyBudgetBurn
        exp_alerts:
          - exp_labels:
              namespace: shortener-prod
              job: shortener-prod
              severity: critical
              service: shortener
              slo: latency
            exp_annotations:
              summary: 'shortener-prod: 지연 SLO(요청의 99%가 0.3초 안)의 오류 예산이 빠르게 타고 있다'
              description: >-
                0.3초보다 오래 걸린 응답 비율 20%(1시간 창, 6시간 짝으로만 울렸으면 6시간 창).
                오류 예산은 요청의 1%다.
                1시간·5분 비율이 모두 예산의 14.4배(14.4%)를 넘었거나 6시간·30분 비율이 모두 6배(6%)를 넘었다.
                이 속도가 이어지면 30일치 예산이 14.4배에서는 약 2일, 6배에서는 5일 만에 바닥난다.
      - eval_time: 420m
        alertname: ShortenerAvailabilityBudgetBurn
        exp_alerts: []

  - name: (d) 요청이 없으면 비율이 NaN(0 ÷ 0)이라 알림이 울리지 않는다
    interval: 1m
    input_series:
      # dev: 예전에 받은 요청 수가 그대로다(새 요청이 없다).
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="201"}'
        values: '5000x70'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="201", le="0.3"}'
        values: '5000x70'
      # actuator 요청은 SLI에서 빠진다. 지금 앱에서는 별도 포트라 이 계열이 없지만, 생겨서(분당 6건, 절반이 0.3초 초과) 섞였다면 느린 비율이 50%가 되어 지연 알림이 울렸을 것이다.
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", method="GET", uri="/actuator/prometheus", status="200"}'
        values: '0+6x70'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", method="GET", uri="/actuator/prometheus", status="200", le="0.3"}'
        values: '0+3x70'
    promql_expr_test:
      # NaN은 자기 자신과도 같지 않다. 그래서 "x != bool x"가 1이면 x는 NaN이다(promtool은 기대값 NaN을 직접 비교하지 못한다).
      # 5xx 계열이 한 번도 없었지만 분자가 0으로 채워져 결과가 비지 않고 0 ÷ 0 = NaN으로 기록된다.
      - expr: namespace_job:http_server_requests_errors:ratio_rate5m != bool namespace_job:http_server_requests_errors:ratio_rate5m
        eval_time: 70m
        exp_samples:
          - labels: '{namespace="shortener-dev", job="shortener-dev"}'
            value: 1
      - expr: namespace_job:http_server_requests_slow:ratio_rate6h != bool namespace_job:http_server_requests_slow:ratio_rate6h
        eval_time: 70m
        exp_samples:
          - labels: '{namespace="shortener-dev", job="shortener-dev"}'
            value: 1
      # 70분 동안 한 번도 pending조차 되지 않았다(NaN > 기준은 늘 거짓).
      - expr: count_over_time(ALERTS{alertname=~"Shortener.*"}[70m])
        eval_time: 70m
        exp_samples: []
    alert_rule_test:
      - eval_time: 70m
        alertname: ShortenerAvailabilityBudgetBurn
        exp_alerts: []
      - eval_time: 70m
        alertname: ShortenerLatencyBudgetBurn
        exp_alerts: []

  - name: (e) 5xx 4%(예산의 8배)는 1시간·5분 짝에 걸리지 않고, 약 4.5시간 뒤 6시간·30분 짝으로 울린다
    interval: 1m
    input_series:
      # dev: 360분까지 정상, 그 뒤 분당 960건 201 + 40건 500(4%)이 계속된다.
      # 6시간 비율 = 40 × 지난 분 ÷ 360000이 3%(예산의 6배)를 넘으려면 270분이 지나야 한다. 그때까지 30일 예산의 5%(8배 × 4.5시간 ÷ 720시간)를 쓴다.
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="201"}'
        values: '0+1000x360 360960+960x299'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="201", le="0.3"}'
        values: '0+1000x360 360960+960x299'
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="500"}'
        values: '0x360 40+40x299'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", method="POST", uri="/api/v1/urls", status="500", le="0.3"}'
        values: '0x360 40+40x299'
    promql_expr_test:
      # 640분: 1시간 비율은 4%라 7.2% 기준(1시간·5분 짝)에 한참 못 미치고, 6시간 비율이 3%를 넘었다.
      - expr: round(namespace_job:http_server_requests_errors:ratio_rate1h, 0.0001)
        eval_time: 640m
        exp_samples:
          - labels: '{namespace="shortener-dev", job="shortener-dev"}'
            value: 0.04
      - expr: round(namespace_job:http_server_requests_errors:ratio_rate6h, 0.0001)
        eval_time: 640m
        exp_samples:
          - labels: '{namespace="shortener-dev", job="shortener-dev"}'
            value: 0.0311
    alert_rule_test:
      # 625분(오류 4시간 25분째): 6시간 비율(40 × 265 ÷ 360000 ≈ 2.94%)이 아직 3% 아래다.
      - eval_time: 625m
        alertname: ShortenerAvailabilityBudgetBurn
        exp_alerts: []
      # 640분: 울리고 있다. 1시간·5분 짝이 거짓이라 값은 6시간 비율(40 × 280 ÷ 360000 ≈ 3.111%)이다.
      - eval_time: 640m
        alertname: ShortenerAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              namespace: shortener-dev
              job: shortener-dev
              severity: critical
              service: shortener
              slo: availability
            exp_annotations:
              summary: 'shortener-dev: 가용성 SLO(99.5%)의 오류 예산이 빠르게 타고 있다'
              description: >-
                5xx 응답 비율 3.111%(1시간 창, 6시간 짝으로만 울렸으면 6시간 창).
                오류 예산은 요청의 0.5%다.
                1시간·5분 비율이 모두 예산의 14.4배(7.2%)를 넘었거나 6시간·30분 비율이 모두 6배(3%)를 넘었다.
                이 속도가 이어지면 30일치 예산이 14.4배에서는 약 2일, 6배에서는 5일 만에 바닥난다.

  - name: (f) 롤아웃 중 le="0.3" 버킷이 없는 옛 파드와 있는 새 파드가 한 창에 섞여도 지연 알림은 울리지 않는다
    interval: 1m
    input_series:
      # dev: 360분까지는 그 경계를 넣기 전의 이미지로 뜬 옛 파드가 분당 1000건을 받는다(le="0.3" 버킷이 없다).
      # 360분에 새 이미지의 파드로 바뀌고(옛 파드가 사라져 361분에 stale 표시가 붙는다), 새 파드가 분당 1000건을 모두 0.3초 안에 처리한다.
      # 그 경계가 든 이미지를 처음 배포할 때(prod 승격 포함)와 경계가 없는 태그로 되돌릴 때 이렇게 섞인다.
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", pod="shortener-dev-old", method="GET", uri="/{code:[0-9a-zA-Z]+}", status="302"}'
        values: '0+1000x360 stale'
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", pod="shortener-dev-new", method="GET", uri="/{code:[0-9a-zA-Z]+}", status="302"}'
        values: '_x360 0+1000x60'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", pod="shortener-dev-new", method="GET", uri="/{code:[0-9a-zA-Z]+}", status="302", le="0.3"}'
        values: '_x360 0+1000x60'
    promql_expr_test:
      # 359분: le 버킷이 있는 계열이 아직 없어서 느린 요청 비율도 없다.
      - expr: namespace_job:http_server_requests_slow:ratio_rate30m
        eval_time: 359m
        exp_samples: []
      # 375분: 30분 창의 요청은 옛 파드(346~360분)와 새 파드가 반씩이다. 분모가 버킷이 있는 새 파드의 요청만 세므로 느린 비율은 0이다
      # (분모가 모든 계열을 세면 약 50%가 되어 지연 알림이 울린다).
      - expr: round(namespace_job:http_server_requests_slow:ratio_rate30m, 0.0001)
        eval_time: 375m
        exp_samples:
          - labels: '{namespace="shortener-dev", job="shortener-dev"}'
            value: 0
      # 420분까지 지연 알림이 한 번도 pending조차 되지 않았다.
      - expr: count_over_time(ALERTS{alertname="ShortenerLatencyBudgetBurn"}[420m])
        eval_time: 420m
        exp_samples: []

  - name: (g) 앱이 le="0.3" 버킷을 내보내지 않으면 느린 요청 비율이 비고 지연 알림도 울리지 않는다
    interval: 1m
    input_series:
      # dev: 그 경계를 넣기 전의 앱. 기본 퍼센타일 히스토그램 버킷 중 0.3초에 가장 가까운 경계는 0.357913941초인데, 규칙은 다른 경계를 세지 않는다.
      # 요청의 절반이 0.357913941초(그러니 0.3초도)를 넘어도 지연 SLO는 잴 수 없어서 비율이 빈다. 경계가 있는지는 앱 저장소의 테스트가
      # /actuator/prometheus에서 확인한다(OpsEndpointsTest).
      - series: 'http_server_requests_seconds_count{namespace="shortener-dev", job="shortener-dev", method="GET", uri="/{code:[0-9a-zA-Z]+}", status="302"}'
        values: '0+1000x70'
      - series: 'http_server_requests_seconds_bucket{namespace="shortener-dev", job="shortener-dev", method="GET", uri="/{code:[0-9a-zA-Z]+}", status="302", le="0.357913941"}'
        values: '0+500x70'
    promql_expr_test:
      - expr: namespace_job:http_server_requests_slow:ratio_rate5m
        eval_time: 70m
        exp_samples: []
      - expr: namespace_job:http_server_requests_slow:ratio_rate6h
        eval_time: 70m
        exp_samples: []
      # 5xx 비율은 버킷과 상관없이 기록된다(5xx가 없으니 0).
      - expr: namespace_job:http_server_requests_errors:ratio_rate5m
        eval_time: 70m
        exp_samples:
          - labels: 'namespace_job:http_server_requests_errors:ratio_rate5m{namespace="shortener-dev", job="shortener-dev"}'
            value: 0
      - expr: count_over_time(ALERTS{alertname="ShortenerLatencyBudgetBurn"}[70m])
        eval_time: 70m
        exp_samples: []
    alert_rule_test:
      - eval_time: 70m
        alertname: ShortenerLatencyBudgetBurn
        exp_alerts: []

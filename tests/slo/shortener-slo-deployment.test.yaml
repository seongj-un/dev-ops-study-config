# 앱 파드 경보(charts/shortener/templates/prometheusrule.yaml의 ShortenerNoAvailablePods)를 Deployment 갈래에서 시험한다.
# 클러스터가 Argo Rollouts의 Rollout을 모르면 차트는 앱을 Deployment로 만들고, 이 경보도 Argo Rollouts 컨트롤러 대신 kube-state-metrics의
# kube_deployment_status_replicas_available을 읽는다(Argo Rollouts를 설치하기 전의 새 클러스터, 로컬 k3d). 나머지 SLO 규칙은 두 갈래에서 같아서
# shortener-slo.test.yaml(Rollout 갈래)이 시험하고, 여기서는 갈래마다 다른 이 경보만 본다.
# 규칙 파일은 Argo Rollouts의 API 없이 렌더링한 결과다(만드는 명령은 shortener-slo.test.yaml 머리말, CI에서는 validate 워크플로의 "SLO 규칙 검사" 단계).
# kube-state-metrics의 ServiceMonitor는 honorLabels: true라서 지표의 namespace가 그대로 저장된다. 계열의 job·instance는 kube-state-metrics 파드의 것이다.
# 값 표기와 평가 주기(1분)는 shortener-slo.test.yaml과 같다.
rule_files:
  - rendered/shortener-dev-deployment.yaml
  - rendered/shortener-prod-deployment.yaml
evaluation_interval: 1m
tests:
  - name: (a) dev의 앱 Deployment에 available 파드가 1분 넘게 0개면 울리고 돌아오면 풀린다 (prod는 파드 하나만 빠져 조용하다)
    interval: 1m
    input_series:
      # dev: 2분까지 2개, 3~6분에 0개, 7분부터 다시 2개.
      - series: 'kube_deployment_status_replicas_available{namespace="shortener-dev", deployment="shortener-dev", job="kube-state-metrics", instance="10.42.0.20:8080"}'
        values: '2x2 0x3 2x2'
      # prod: 같은 동안 파드 하나만 빠진다.
      - series: 'kube_deployment_status_replicas_available{namespace="shortener-prod", deployment="shortener-prod", job="kube-state-metrics", instance="10.42.0.20:8080"}'
        values: '2x2 1x3 2x2'
    alert_rule_test:
      # 3분: 처음 0이라 아직 pending이다.
      - eval_time: 3m
        alertname: ShortenerNoAvailablePods
        exp_alerts: []
      # 4분: 1분 동안 계속 0이라 울린다. 설명의 근거 지표가 kube-state-metrics의 것이다.
      - eval_time: 4m
        alertname: ShortenerNoAvailablePods
        exp_alerts:
          - exp_labels:
              namespace: shortener-dev
              job: shortener-dev
              severity: critical
              service: shortener
            exp_annotations:
              summary: 'shortener-dev: 요청을 받을 수 있는 앱 파드가 1분 넘게 하나도 없다'
              description: >-
                Ready인 앱 파드가 0개라 앱 Service의 엔드포인트가 비었다. Traefik이 이 환경의 모든 요청에 503을 직접 돌려주고,
                요청이 앱까지 가지 않아서 앱의 지표로 계산하는 SLO 경보는 이 장애를 보지 못한다.
                흔한 원인은 DB 장애(앱의 readiness에 DB가 들어 있다)와 모든 파드의 시작 실패다. kubectl -n shortener-dev get pods로 파드의 상태와 이벤트를 본다.
                근거 지표는 kube-state-metrics의 kube_deployment_status_replicas_available(Deployment shortener-dev)이다.
      - eval_time: 7m
        alertname: ShortenerNoAvailablePods
        exp_alerts: []

  - name: (b) 같은 네임스페이스의 다른 Deployment(Redis)가 0개여도, 앱 Deployment의 계열이 없어도 울리지 않는다
    interval: 1m
    input_series:
      # 차트는 Redis도 Deployment(<릴리스>-redis)로 만든다. 경보는 이름이 앱과 같은 Deployment만 고른다.
      - series: 'kube_deployment_status_replicas_available{namespace="shortener-dev", deployment="shortener-dev-redis", job="kube-state-metrics", instance="10.42.0.20:8080"}'
        values: '0x5'
      # 앱 Deployment의 계열은 없다(kube-state-metrics가 아직 수집되지 않았거나 내려갔다). 잴 수 없을 뿐이라 울리지 않는다.
    promql_expr_test:
      - expr: count_over_time(ALERTS{alertname="ShortenerNoAvailablePods"}[5m])
        eval_time: 5m
        exp_samples: []
    alert_rule_test:
      - eval_time: 5m
        alertname: ShortenerNoAvailablePods
        exp_alerts: []

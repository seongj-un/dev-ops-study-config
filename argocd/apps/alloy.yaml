# 로그 수집 Application: Grafana Alloy(grafana/alloy 차트, DaemonSet)를 platform/alloy/values.yaml 값으로 monitoring 네임스페이스에 배포한다.
# 루트 Application(argocd/root.yaml)이 이 파일을 읽어 클러스터에 Application을 만든다.
#
# 모양은 kube-prometheus-stack Application과 같은 multi-source다(차트 저장소의 차트 + 이 저장소의 값 파일. 설명은 argocd/apps/kube-prometheus-stack.yaml).
# 차트 버전을 올릴 때는 아래 targetRevision과 값 파일 맨 위의 버전 표기를 함께 바꾼다. CI(validate.yml)가 이 파일에서 차트와 값 파일을 읽어 렌더링하고 스키마로 검사한다.
# Alloy 설정(파이프라인)은 값 파일의 alloy.configMap.content에 있다. 그것을 고쳐 머지하면 ArgoCD가 ConfigMap을 바꾸고, 파드 안의 config-reloader가 Alloy에 다시 읽게 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # ArgoCD는 이 이름을 Helm 릴리스 이름으로 쓴다. DaemonSet·ServiceAccount·ClusterRole 이름이 alloy가 된다.
  name: alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      # 정확한 버전으로 고정한다. 이미지 태그도 이 차트 버전이 정한다(값 파일 맨 위 주석).
      targetRevision: 1.13.0
      helm:
        valueFiles:
          - $values/platform/alloy/values.yaml
    - repoURL: https://github.com/seongj-un/dev-ops-study-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # 자동 동기화와 prune·selfHeal은 다른 Application과 같다(argocd/apps/shortener-dev.yaml 참고).
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # monitoring 네임스페이스가 없으면 만든다. 이미 있으면 건드리지 않는다.
      - CreateNamespace=true

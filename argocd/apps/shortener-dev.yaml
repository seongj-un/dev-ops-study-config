# dev 환경 Application: 이 저장소의 차트(charts/shortener)를 environments/dev/values.yaml 값으로 shortener-dev 네임스페이스에 배포한다.
# 루트 Application(argocd/root.yaml)이 이 파일을 읽어 클러스터에 Application을 만든다.
#
# 배포 흐름: 앱 저장소의 CI가 environments/dev/values.yaml의 image.tag를 새 커밋 SHA로 고쳐 이 저장소 main에 커밋한다 →
# ArgoCD가 폴링으로 그 커밋을 발견한다 → 자동 동기화가 새 이미지로 롤링 업데이트한다. 사람이 클러스터에 helm이나 kubectl을 쓰지 않는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # ArgoCD는 이 이름을 Helm 릴리스 이름으로 쓴다(helm.releaseName을 따로 주지 않으면 기본 동작이다). 차트가 리소스 이름을 릴리스 이름에서 만들므로
  # Deployment는 shortener-dev, PostgreSQL은 shortener-dev-postgresql, Redis는 shortener-dev-redis가 된다.
  name: shortener-dev
  # 루트 Application이 만드는 Application 리소스는 argocd 네임스페이스에 있어야 ArgoCD가 읽는다.
  namespace: argocd
spec:
  # ArgoCD가 기본으로 만들어 두는 프로젝트(저장소·클러스터·네임스페이스 제한 없음).
  project: default
  source:
    # 공개 저장소라서 ArgoCD에 저장소 자격 증명을 등록하지 않아도 읽힌다.
    repoURL: https://github.com/seongj-un/dev-ops-study-config.git
    # 브랜치 이름이다. main의 최신 커밋이 곧 배포할 상태다.
    targetRevision: main
    # 이 디렉터리가 Helm 차트(Chart.yaml이 있다)라서 ArgoCD가 helm template으로 렌더링한다. helm install처럼 릴리스를 만들지는 않는다:
    # 렌더링한 매니페스트를 ArgoCD가 직접 클러스터에 적용하고 관리한다(그래서 helm ls에는 보이지 않고, helm test도 쓸 수 없다).
    path: charts/shortener
    helm:
      valueFiles:
        # 값 파일 경로는 차트 디렉터리(path) 기준이다. ../../는 저장소 루트이고, 저장소 밖으로 나가는 경로는 ArgoCD가 거부한다.
        # 차트의 기본 values.yaml 위에 이 파일이 덮어써진다(ArgoCD 문서의 우선순위: parameters > valuesObject > values > valueFiles > 차트의 values.yaml).
        - ../../environments/dev/values.yaml
  destination:
    # 이 ArgoCD가 떠 있는 클러스터 자신(in-cluster)을 가리키는 고정 주소다.
    server: https://kubernetes.default.svc
    namespace: shortener-dev
  syncPolicy:
    # 자동 동기화: Git이 바뀌어 클러스터와 달라지면(OutOfSync) ArgoCD가 사람 손 없이 동기화한다. 기본은 수동 동기화다(UI나 CLI에서 Sync를 눌러야 한다).
    # 같은 커밋으로 동기화가 한 번 실패하면 자동 동기화는 그 커밋으로 다시 시도하지 않는다(재시도 retry를 두지 않았다).
    # 실패하면 Application의 상태에서 원인을 읽고, 고친 커밋을 올리거나 UI에서 직접 Sync를 눌러 다시 시도한다.
    automated:
      # Git에서 사라진 리소스를 클러스터에서도 지운다. 기본은 꺼짐이다(안전장치로, 자동 동기화는 만들고 고치기만 하고 지우지는 않는다).
      # 예를 들어 차트에서 리소스를 없애면 그 리소스가 클러스터에서도 지워진다.
      # 지워지는 것은 ArgoCD가 추적하는 리소스뿐이다: 손으로 만든 Secret(shortener-db)과 PostgreSQL의 PVC(StatefulSet이 만든다)는 추적 대상이 아니라 남는다.
      prune: true
      # 클러스터의 라이브 상태를 누가 손으로 바꿔도(예: kubectl scale, kubectl edit) Git의 내용으로 되돌린다.
      # 기본은 꺼짐이라 Git이 바뀔 때만 동기화하고, 손으로 바꾼 것은 OutOfSync로 표시만 하고 그대로 둔다. 이 환경에서 Git이 원본이라는 것을 강제하는 설정이다.
      # (dev는 오토스케일링이 없고 replicas를 Git의 replicaCount로 적으므로 kubectl scale로 파드 수를 바꿔도 되돌려진다. 바꾸려면 environments/dev/values.yaml의 replicaCount를 고친다.)
      selfHeal: true
    syncOptions:
      # destination.namespace(shortener-dev)가 없으면 동기화할 때 만든다. 이 옵션이 없으면 네임스페이스가 없을 때 동기화가 실패한다.
      # 이미 있으면 건드리지 않는다: 부트스트랩에서 DB 비밀번호 Secret을 넣으려고 네임스페이스를 미리 만들어 두어도 충돌하지 않는다.
      # ArgoCD가 만든 네임스페이스는 추적하지 않으므로 Application을 지우거나 prune해도 네임스페이스는 남는다.
      - CreateNamespace=true
# 삭제 finalizer(resources-finalizer.argocd.argoproj.io)는 붙이지 않았다. finalizer가 없으면 이 Application을 지워도(kubectl delete, 루트의 prune 포함)
# Application만 사라지고 배포된 리소스는 클러스터에 그대로 남는다. 리소스까지 함께 지우려면 metadata.finalizers에 그 finalizer를 넣는다.

# 시크릿 동기화 Application: External Secrets Operator(external-secrets 차트)를 platform/external-secrets/values.yaml 값으로 external-secrets 네임스페이스에 배포한다.
# 루트 Application(argocd/root.yaml)이 이 파일을 읽어 클러스터에 Application을 만든다.
#
# 모양은 cert-manager Application과 같은 multi-source다(차트 저장소의 차트 + 이 저장소의 값 파일. 설명은 argocd/apps/kube-prometheus-stack.yaml).
# 차트 버전을 올릴 때는 아래 targetRevision과 값 파일 맨 위의 버전 표기를 함께 바꾸고, ESO의 릴리스 노트와 CRD API 버전(external-secrets.io/v1, generators.external-secrets.io/v1alpha1)이 그대로인지 먼저 확인한다.
# CI(validate.yml)가 이 파일에서 차트와 값 파일을 읽어 렌더링하고 스키마로 검사한다.
# 이 Application은 컨트롤러·웹훅·cert-controller와 CRD만 설치한다. 어디서 읽어 어느 Secret을 만들지(ServiceAccount, SecretStore, ExternalSecret)는
# external-secrets-config Application이, 앱 차트의 Secret(데이터베이스 비밀번호)은 앱 차트가 따로 배포한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # ArgoCD는 이 이름을 Helm 릴리스 이름으로 쓴다. 릴리스 이름이 차트 이름과 같아서 리소스 이름이 external-secrets, external-secrets-webhook, external-secrets-cert-controller가 된다.
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      # 정확한 버전으로 고정한다(이 저장소의 차트 버전은 앞에 v가 붙지 않는다). 이미지 태그도 이 차트 버전이 정한다(값 파일 맨 위 주석).
      targetRevision: 2.12.0
      helm:
        valueFiles:
          - $values/platform/external-secrets/values.yaml
    - repoURL: https://github.com/seongj-un/dev-ops-study-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # 차트는 리소스를 이 네임스페이스(Helm의 릴리스 네임스페이스)에 만든다. SecretStore와 ExternalSecret은 이 네임스페이스가 아니라 Secret이 필요한 네임스페이스(monitoring 등)에 둔다.
    namespace: external-secrets
  syncPolicy:
    # 자동 동기화와 prune·selfHeal은 다른 Application과 같다(argocd/apps/shortener-dev.yaml 참고).
    # prune은 CRD도 대상이다. 이 차트는 CRD에 Prune=false를 붙일 수 없어서 값 파일의 installCRDs를 끄지 않는 것으로 지킨다(값 파일의 CRD 주석).
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # external-secrets 네임스페이스가 없으면 만든다. 이미 있으면 건드리지 않는다.
      - CreateNamespace=true
      # 서버 쪽 적용(설명은 argocd/apps/kube-prometheus-stack.yaml). 이 차트의 CRD는 SecretStore·ClusterSecretStore가 YAML로 각각 약 722KB라서
      # 클라이언트 쪽 적용이 CRD에 남기는 어노테이션(kubectl.kubernetes.io/last-applied-configuration)의 한도 256KiB를 넘는다. 클라이언트 쪽 적용으로는 이 CRD를 설치하지 못하고,
      # ESO 문서도 모든 곳에서 서버 쪽 적용을 쓰라고 한다.
      # caBundle: 웹훅 설정과 CRD의 caBundle은 cert-controller가 클러스터에서 채우는 값이고 차트는 이 필드를 렌더링하지 않는다.
      # 서버 쪽 적용은 객체 전체가 아니라 렌더링한 필드만 이 Application의 것으로 기록하고(metadata.managedFields), ArgoCD의 비교도 Git에 적힌 필드만 본다.
      # 그래서 caBundle은 cert-controller의 필드로 남아 동기화가 지우지 않고 OutOfSync로도 보이지 않는다(cert-manager의 cainjector와 같다. argocd/apps/cert-manager.yaml).
      - ServerSideApply=true
      # ServiceMonitor는 kube-prometheus-stack이 설치하는 CRD가 있어야 적용된다(값 파일의 serviceMonitor 주석). 이 차트에는 ServiceMonitor에만 SkipDryRunOnMissingResource를 붙일 값이 없어서
      # Application 전체에 건다. 이 Application에서 CRD가 정의하는 kind는 ServiceMonitor뿐이고 나머지는 내장 리소스와 CRD 자체라서(차트는 ExternalSecret 같은 CR을 만들지 않는다)
      # 동기화 전 검증(dry-run)을 건너뛰어도 잃는 것이 없다. 건너뛰면 CRD가 없는 ServiceMonitor의 적용만 실패하고(kind를 모른다), 나머지는 같은 동기화에서 적용된다.
      - SkipDryRunOnMissingResource=true
    # 새 클러스터에서 이쪽이 kube-prometheus-stack보다 먼저 동기화되면 ServiceMonitor 하나만 CRD가 생길 때까지 적용에 실패하고, 아래 retry가 다시 시도한다.
    # 웨이브(sync-wave)는 한 Application 안의 순서라서 Application 사이에는 쓰지 못한다(argocd/apps/cert-issuers.yaml의 동기화 순서 주석).
    # 재시도의 모양과 대가는 argocd/apps/argo-rollouts.yaml의 retry 주석과 같다: 10초에서 시작해 2배씩, 3분을 넘지 않게 6번(합쳐 약 8분).
    retry:
      limit: 6
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

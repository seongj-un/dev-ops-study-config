# prod 환경 Application: 이 저장소의 차트(charts/shortener)를 environments/prod/values.yaml 값으로 shortener-prod 네임스페이스에 배포한다.
# 루트 Application(argocd/root.yaml)이 이 파일을 읽어 클러스터에 Application을 만든다. dev와 다른 점은 배포되는 값 파일과 네임스페이스뿐이고, 동기화 정책은 같다.
#
# 배포 흐름: dev에서 확인한 SHA를 environments/prod/values.yaml의 image.tag에 옮기는 PR(승격)을 머지한다 → ArgoCD가 폴링으로 그 커밋을 발견한다 →
# 자동 동기화가 새 이미지로 롤링 업데이트한다. prod에 사람이 개입하는 관문은 클러스터가 아니라 Git의 PR 리뷰·머지다.
# 그래서 prod도 자동 동기화로 둔다. 수동 동기화로 두면 머지된 뒤에 누군가 Sync를 한 번 더 눌러야 하고, 그동안 Git과 클러스터가 어긋난 채로 남는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # ArgoCD는 이 이름을 Helm 릴리스 이름으로 쓴다(helm.releaseName을 따로 주지 않으면 기본 동작이다). 차트가 리소스 이름을 릴리스 이름에서 만들므로
  # Deployment는 shortener-prod, PostgreSQL은 shortener-prod-postgresql, Redis는 shortener-prod-redis가 된다.
  name: shortener-prod
  # 루트 Application이 만드는 Application 리소스는 argocd 네임스페이스에 있어야 ArgoCD가 읽는다.
  namespace: argocd
spec:
  # ArgoCD가 기본으로 만들어 두는 프로젝트(저장소·클러스터·네임스페이스 제한 없음).
  project: default
  source:
    # 공개 저장소라서 ArgoCD에 저장소 자격 증명을 등록하지 않아도 읽힌다.
    repoURL: https://github.com/seongj-un/dev-ops-study-config.git
    # 브랜치 이름이다. main의 최신 커밋이 곧 배포할 상태다.
    targetRevision: main
    # 이 디렉터리가 Helm 차트라서 ArgoCD가 helm template으로 렌더링하고, 그 매니페스트를 직접 클러스터에 적용한다(Helm 릴리스는 만들어지지 않는다).
    path: charts/shortener
    helm:
      valueFiles:
        # 값 파일 경로는 차트 디렉터리(path) 기준이다. 차트의 기본 values.yaml 위에 이 파일이 덮어써진다.
        - ../../environments/prod/values.yaml
  destination:
    # 이 ArgoCD가 떠 있는 클러스터 자신(in-cluster)을 가리키는 고정 주소다.
    server: https://kubernetes.default.svc
    namespace: shortener-prod
  syncPolicy:
    # 자동 동기화: Git이 바뀌어 클러스터와 달라지면(OutOfSync) ArgoCD가 사람 손 없이 동기화한다. 같은 커밋으로 한 번 실패하면 그 커밋으로는 다시 시도하지 않는다(dev 파일 참고).
    automated:
      # Git에서 사라진 리소스를 클러스터에서도 지운다. 지워지는 것은 ArgoCD가 추적하는 리소스뿐이다: 손으로 만든 Secret(shortener-db)과 PostgreSQL의 PVC는 남는다.
      prune: true
      # 클러스터의 라이브 상태를 누가 손으로 바꿔도 Git의 내용으로 되돌린다. prod에서는 kubectl로 임시 조치한 것이 조용히 되돌려진다는 뜻이니 조치는 Git으로 한다.
      # prod는 HPA가 파드 수를 정한다. 차트가 오토스케일링을 켜면 Deployment에 replicas를 적지 않으므로(charts/shortener/templates/deployment.yaml),
      # HPA가 파드를 늘려도 Git과 어긋난 것으로 보이지 않아 selfHeal이 HPA와 다투지 않는다.
      selfHeal: true
    syncOptions:
      # destination.namespace(shortener-prod)가 없으면 동기화할 때 만든다. 이미 있으면 건드리지 않는다(부트스트랩에서 Secret을 넣으려고 미리 만들어 둔 경우).
      - CreateNamespace=true
# 삭제 finalizer는 붙이지 않았다(dev 파일 참고): 이 Application을 지워도 배포된 리소스는 클러스터에 남는다. prod 리소스가 실수로 함께 지워지지 않게 하려는 것이기도 하다.

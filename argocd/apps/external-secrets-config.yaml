# 시크릿 설정 Application: 이 저장소의 platform/external-secrets-config에 있는 ServiceAccount·SecretStore·ExternalSecret·Password 생성기를 monitoring 네임스페이스에 만든다.
# 결과로 ESO가 Secret alertmanager-discord(SSM의 Discord 웹훅 URL)와 grafana-admin(무작위 비밀번호)을 만든다. 두 Secret은 kube-prometheus-stack이 읽는다(platform/kube-prometheus-stack/values.yaml).
# 루트 Application(argocd/root.yaml)이 이 파일을 읽어 클러스터에 Application을 만든다.
#
# 외부 차트가 없어서 소스가 하나다(cert-issuers처럼 이 저장소의 경로를 직접 가리킨다). kustomization.yaml이 없는 디렉터리라 ArgoCD가 안의 YAML을 그대로 읽는다.
# external-secrets Application과 나눈 이유: 어느 Secret을 어디서 읽을지는 이 저장소가 정하는 설정이고 차트가 아니다. 평범한 매니페스트로 두면 CI가 CRD 스키마로 바로 검사할 수 있다.
# 대가는 두 Application 사이에 동기화 순서가 없다는 것이고, 아래 retry가 그것을 맡는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seongj-un/dev-ops-study-config.git
    targetRevision: main
    path: platform/external-secrets-config
  # 이 디렉터리의 리소스는 모두 monitoring 네임스페이스의 것이고 각 매니페스트에도 metadata.namespace를 적었다.
  # monitoring 네임스페이스는 CreateNamespace=true인 다른 Application(kube-prometheus-stack·loki·alloy·monitoring-dashboards 가운데 먼저 동기화되는 것)이 만든다. 이 Application은 네임스페이스를 만들지 않는다(두 Application이 같은 네임스페이스를 만들려고 다투지 않게).
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # 자동 동기화와 prune·selfHeal은 다른 Application과 같다(argocd/apps/shortener-dev.yaml 참고).
    # 이 Application이 지우는 것은 ExternalSecret과 Password까지다. ESO가 만든 Secret은 ArgoCD가 추적하지 않아 prune 대상이 아니다
    # (매니페스트의 target.template.metadata가 ArgoCD의 추적 레이블·어노테이션이 Secret에 복사되지 않게 막는다. ArgoCD v3 기본인 annotation 추적에서는 복사돼도 tracking-id가 ExternalSecret을 가리켜 Secret과 맞지 않으니, 이것은 방어를 겹친 것이다). 다만 ExternalSecret을 지우면
    # creationPolicy: Owner라서 그것이 만든 Secret도 소유자 참조로 함께 지워진다.
    automated:
      prune: true
      selfHeal: true
    # 동기화 순서: ExternalSecret·SecretStore·Password의 CRD와 그것을 검사하는 웹훅은 external-secrets Application이 만든다. 웨이브(sync-wave)는 한 Application 안의 순서라서
    # 두 Application 사이에는 쓰지 못한다(ArgoCD v3.5.3은 Application 리소스의 건강 상태를 따로 설정하지 않으면 보지 않아 루트 Application이 자식 사이의 순서를 지키지 못한다).
    # 그래서 새 클러스터에서 이쪽이 먼저 동기화되면 이렇게 풀린다:
    #   1) CRD가 아직 없다: SecretStore·ExternalSecret·Password의 SkipDryRunOnMissingResource=true(platform/external-secrets-config/*.yaml)로 동기화 전 검증을 건너뛰고, 적용이 "kind를 모른다"로 실패한다.
    #   2) CRD는 있는데 웹훅 파드가 아직 뜨지 않았거나 cert-controller가 웹훅 설정에 CA를 아직 넣지 않았다: 웹훅 호출이 실패해 적용이 거부된다.
    #   3) 모두 적용됐지만 ESO가 아직 SSM을 읽지 못한다(예: 클러스터의 서명 키를 공개한 JWKS가 아직 S3에 없어 STS가 토큰을 거부한다): 동기화는 성공하고 ExternalSecret이 Ready=False가 된 채 ESO가 계속 다시 시도한다.
    #      이 경우 ArgoCD가 ExternalSecret을 Degraded로 보여 주지만 동기화는 다시 시도하지 않고, ESO가 성공할 때까지 Secret이 없어 Alertmanager 파드는 ContainerCreating으로 기다린다.
    #   4) monitoring 네임스페이스가 아직 없다(kube-prometheus-stack도 loki도 아직 동기화되지 않았다): ServiceAccount의 동기화 전 검증(dry-run)이 "네임스페이스 없음"으로 실패한다. 아래 retry가 다시 시도한다.
    #   1·2·4는 아래 retry가 다시 시도하고, ESO가 준비되고 네임스페이스가 생기면 적용된다. ArgoCD의 기본 재시도(합쳐 약 2분 반)는 새 노드에서 이미지를 받고 웹훅이 뜨기까지보다 짧을 수 있어서
    #   argo-rollouts와 같은 값으로 늘린다: 10초에서 시작해 2배씩, 3분을 넘지 않게 6번(합쳐 약 8분). 대가도 같다(argocd/apps/argo-rollouts.yaml의 retry 주석): 기다리는 동안 동기화 작업이
    #   Running으로 남아 새 커밋을 적용하지 않고, 다시 시도를 모두 쓰면 사람이 Sync를 눌러야 한다(README의 막혔을 때).
    # ServiceAccount는 내장 리소스라 검증을 건너뛰지 않는다. 건너뛰는 것은 CRD가 정의하는 kind의 매니페스트에만 붙인다: 리소스에 붙여 두면 다른 kind를 더해도 오타가 검증에서 걸린다.
    retry:
      limit: 6
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

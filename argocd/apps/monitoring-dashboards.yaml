# 대시보드 Application: 이 저장소의 platform/dashboards(kustomize)를 렌더링해 Grafana 대시보드 ConfigMap을 monitoring 네임스페이스에 배포한다.
# 루트 Application(argocd/root.yaml)이 이 파일을 읽어 클러스터에 Application을 만든다.
#
# 외부 차트가 없어서 다른 플랫폼 Application과 달리 소스가 하나다(앱 Application처럼 이 저장소의 경로를 직접 가리킨다).
# Grafana(kube-prometheus-stack Application)보다 먼저 동기화되어도 된다: ConfigMap이 먼저 있으면 Grafana의 사이드카가 뜰 때 읽는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seongj-un/dev-ops-study-config.git
    targetRevision: main
    # kustomization.yaml이 있는 디렉터리라서 ArgoCD가 kustomize build로 렌더링한다(ArgoCD v3.5.3에 들어 있는 kustomize 5.8.1).
    path: platform/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # 자동 동기화와 prune·selfHeal은 다른 Application과 같다(argocd/apps/shortener-dev.yaml 참고). 사이드카가 넣은 대시보드는 Grafana가 파일에서 읽는 것이라
    # (프로비저닝, allowUiUpdates: false) UI에서 고쳐 저장할 수 없다. 고치려면 JSON을 고쳐 PR로 머지한다.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # monitoring 네임스페이스가 없으면 만든다. 이미 있으면 건드리지 않는다.
      - CreateNamespace=true

# app-of-apps의 루트 Application. 이 저장소의 argocd/apps 디렉터리를 감시하고, 거기 있는 Application 매니페스트(shortener-dev, shortener-prod, kube-prometheus-stack 등)를
# 클러스터에 만들어 준다. 환경을 하나 더 늘리려면 argocd/apps에 Application 파일을 추가하는 PR을 머지하면 되고, 클러스터에 손댈 필요가 없다.
#
# 이 파일만 클러스터에 손으로 한 번 적용한다(ArgoCD를 설치한 뒤): kubectl apply -f argocd/root.yaml
# 그 뒤로는 ArgoCD가 알아서 한다. 이 파일이 argocd/apps 밖에 있는 것은 루트가 자기 자신을 관리하지 않게 하려는 것이다.
# 안에 두면 루트의 prune이 루트 자신을 지울 수도 있다. 게다가 루트가 없으면 argocd/apps를 읽어 줄 것이 없으니 처음 한 번은 어차피 손으로 만들어야 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  # Application 리소스는 ArgoCD가 설치된 네임스페이스에 있어야 ArgoCD가 읽는다(다른 네임스페이스의 Application을 보려면 별도 설정이 필요하다).
  namespace: argocd
spec:
  # 프로젝트는 Application이 쓸 수 있는 저장소·클러스터·네임스페이스를 제한하는 단위다. default는 ArgoCD가 기본으로 만들어 두는 프로젝트이고 제한이 없다.
  project: default
  source:
    # 공개 저장소라서 ArgoCD에 저장소 자격 증명을 등록하지 않아도 읽힌다(비공개로 바꾸면 자격 증명이 필요하다).
    repoURL: https://github.com/seongj-un/dev-ops-study-config.git
    # 브랜치 이름이다. ArgoCD는 이 브랜치가 가리키는 커밋을 주기적으로 확인한다(bootstrap/argocd/values.yaml의 timeout.reconciliation).
    targetRevision: main
    # 차트나 kustomization이 없는 디렉터리라서 ArgoCD는 안의 YAML 파일(*.yaml, *.yml, *.json)을 그대로 매니페스트로 읽는다.
    # 하위 디렉터리까지 읽는 옵션(directory.recurse)은 기본이 꺼짐이라 argocd/apps 바로 아래 파일만 대상이다.
    path: argocd/apps
  destination:
    # 이 ArgoCD가 떠 있는 클러스터 자신(in-cluster)을 가리키는 고정 주소다.
    server: https://kubernetes.default.svc
    # 자식 Application 매니페스트가 만들어질 네임스페이스. 자식은 Application 리소스라서 위에서 말한 대로 argocd 네임스페이스에 있어야 한다.
    namespace: argocd
  syncPolicy:
    # 자동 동기화: Git이 바뀌어 클러스터와 달라지면(OutOfSync) ArgoCD가 사람 손 없이 동기화한다. 기본은 수동 동기화다(UI나 CLI에서 Sync를 눌러야 한다).
    automated:
      # Git에서 사라진 리소스를 클러스터에서도 지운다. 기본은 꺼짐이다(안전장치로, 자동 동기화는 만들고 고치기만 하고 지우지는 않는다).
      # 여기서는 argocd/apps에서 Application 파일을 지우면 루트가 그 Application을 지운다는 뜻이다.
      # 자식 Application에는 삭제 finalizer를 붙이지 않았으므로 Application만 지워지고 그것이 배포한 리소스는 클러스터에 남는다(apps/*.yaml 참고).
      prune: true
      # 클러스터의 라이브 상태를 누가 손으로 바꿔도(예: kubectl edit으로 자식 Application 수정) Git의 내용으로 되돌린다.
      # 기본은 꺼짐이라 Git이 바뀔 때만 동기화하고, 손으로 바꾼 것은 OutOfSync로 표시만 하고 그대로 둔다.
      selfHeal: true

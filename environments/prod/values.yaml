# prod 환경 값. ArgoCD의 shortener-prod Application(argocd/apps/shortener-prod.yaml)이 차트 기본값(charts/shortener/values.yaml) 위에
# 이 파일을 얹어 shortener-prod 네임스페이스에 배포한다. 여기에는 이 환경에서 정한 값을 적는다: 차트 기본값과 다른 것, 그리고 같더라도 일부러 적어 두는 것(아래 autoscaling, resources).
#
# 클러스터는 EC2 m7i-flex.large(2 vCPU, 메모리 8GiB) 한 대의 k3s이고(ap-northeast-2), dev·prod 두 환경과 ArgoCD가 이 노드 하나를 나눠 쓴다.
# 로컬 k3d 클러스터(Docker VM 2.84GiB)는 dev 롤링 업데이트 중에 메모리가 모자라서 프로젝트를 EC2로 옮겼고 멈춰 두었다. 그래서 prod의 HPA를 다시 켜고 앱 메모리를 차트 기본값(요청 384Mi·한도 512Mi)으로 되돌렸다.
# 로컬 k3d로 다시 띄우려면 baseUrl·ingress.host를 *.localhost 이름으로, HPA와 앱 메모리를 예전 크기로 덮어써야 한다(README의 메모리 메모).
# dev와 다른 점은 이미지 태그를 올리는 방법(prod는 PR로 승격), 호스트 이름·공개 주소, 인증서 발급자, prod만 HPA가 켜져 있다는 것, 그리고 prod의 PostgreSQL이 더 크다는 것(맨 아래 postgresql)이다. 앞의 넷의 비교는 environments/dev/values.yaml의 머리말에 있다.
#
# 이 파일에도 dev 파일처럼 빈 줄이 하나도 없다. yq는 값을 고쳐 다시 쓸 때 키 사이의 빈 줄을 지우므로(dev 파일 머리말 참고),
# 처음부터 그 모양으로 커밋해 두어야 yq로 승격할 때도 바뀌는 줄이 태그 하나뿐이다.
image:
  # 배포할 앱 이미지의 태그, 곧 앱 저장소 main 커밋 SHA 전체 40자다 (차트가 이 형식이 아니면 렌더링을 거부한다).
  # 이 줄은 사람이 PR로 바꾼다(승격): dev(environments/dev/values.yaml)에서 확인한 SHA를 그대로 옮겨 온다.
  # "prod는 PR로만 바뀐다"는 규칙은 사람에게 저장소 룰셋이 강제한다(main 직접 푸시 금지, PR 필수). 앱 저장소 CI가 쓰는 deploy key는 그 룰셋을 우회(bypass)하도록 등록되어 있고,
  # 우회는 저장소 전체에 미치므로 기술적으로는 이 파일도 main에 직접 커밋할 수 있다. 그런데도 prod가 그대로인 것은 CI 스크립트가 dev 파일(environments/dev/values.yaml)만 고치기 때문이다.
  # 이 파일을 지켜 주는 것은 룰셋이 아니라 그 스크립트의 절제다.
  # 값은 따옴표로 감싼다: dev 파일과 같은 형식으로 두어 SHA를 통째로 복사·붙여넣을 수 있게 하고, 숫자나 지수 표기로 읽히지 않게 한다.
  tag: "fc2c8d1647d73f0a4dba17acbefdb5cb02464957"
# 응답의 shortUrl 앞에 붙는 공개 주소. Ingress로 들어오는 주소와 같아야 한다. DuckDNS 이름 dev-ops-study가 EC2 노드의 IP를 가리키고, 그 노드의 443 포트로 들어온 요청을
# k3s 기본 Traefik이 아래 ingress.tls의 인증서로 받는다. HTTPS의 기본 포트(443)라서 주소에 포트 번호가 없다. 80 포트로 온 요청은 Traefik이 https로 돌려보낸다(dev 파일과 같다).
baseUrl: https://dev-ops-study.duckdns.org
ingress:
  # DuckDNS에 등록한 이름 그대로다. dev(dev.dev-ops-study.duckdns.org)도 같은 IP로 들어오므로, 이름이 달라야 Traefik이 Host 헤더(HTTPS에서는 SNI도)로 요청을 나눈다.
  host: dev-ops-study.duckdns.org
  # HTTPS(6단계): 인증서는 Secret shortener-prod-tls에 들어간다. 발급자는 브라우저가 믿는 인증서를 주는 letsencrypt-prod다.
  # dev처럼 letsencrypt-staging으로 시작해 발급 흐름을 확인한 뒤 이 한 줄을 바꿨다(README의 HTTPS 절). dev는 staging에 남는다(이유는 environments/dev/values.yaml의 ingress 주석).
  # prod 발급자는 같은 이름 묶음으로 7일에 5장까지라서, 인스턴스를 없애고 다시 만들 때마다(Secret과 ACME 계정 키가 사라진다) 한 장씩 쓴다. 한 주에 다시 만들기를 4번 넘게 하지 않는다.
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
# HPA를 켠다(파드 2~3개). autoscaling.enabled가 true이면 차트가 HPA를 만들고 워크로드(Rollout, Argo Rollouts가 없으면 Deployment)에는 replicas를 적지 않으므로 파드 수는 HPA가 정한다.
# 그래서 replicaCount는 이 파일에 적지 않는다(쓰이지 않는다). 최소 2개는 파드 하나가 죽어도(5단계 장애 훈련) 다른 파드가 요청을 받고,
# 카나리(setWeight 50)가 파드를 더 띄워 두지 않고도 카나리 1개·stable 1개로 나뉘게 하려는 것이다.
# 최대 3개는 이 노드의 메모리 예산으로 정했다. 앱과 Redis는 차트 기본값의 요청·한도로, prod의 PostgreSQL은 아래 postgresql에서 키운 값으로 계산한다(단위 Mi):
#   - 노드: m7i-flex.large의 8GiB = 8192. 명목 크기라 실제 MemTotal은 조금 작고 호스트 OS도 메모리를 쓴다(띄운 뒤 free -m으로 확인한다).
#   - k3s와 기본 구성요소(Traefik 등): 약 800. 로컬 k3d의 빈 클러스터에서 잰 약 770을 올려 잡은 값이고 EC2에서는 재지 않았다.
#   - ArgoCD: 요청 합 560, 한도 합 1792 (README의 ArgoCD 표. 4단계에서 repo-server 한도를 256에서 512로, application-controller를 요청 128에서 384로·한도 256에서 1024로 올렸다).
#   - 모니터링(4단계): kube-prometheus-stack 요청 합 1056·한도 합 2432(추정), Loki·Alloy 요청 합 368·한도 합 832 (README의 모니터링 표).
#   - 점진 배포(5단계): Argo Rollouts 컨트롤러·대시보드 요청 합 96·한도 합 320(추정) (README의 Argo Rollouts 표).
#   - 인증서(6단계): cert-manager 컨트롤러·웹훅·cainjector 요청 합 160·한도 합 480(추정) (README의 HTTPS 표). 발급·갱신 때 앱 네임스페이스마다 수십 초 뜨는 검증 파드(64/64)는 넣지 않았다.
#   - 앱 파드 하나는 요청 384·한도 512, Redis는 32/128이다. PostgreSQL은 dev가 차트 기본값 128/256이고, prod는 아래 postgresql에서 키운 256/512다.
#   - dev(앱 2개 + PostgreSQL 128/256 + Redis 32/128): 요청 928, 한도 1408. prod(앱 3개 + PostgreSQL 256/512 + Redis 32/128): 요청 1440, 한도 2176.
#   - 새 버전을 배포하는 동안(Rollout의 카나리. Argo Rollouts가 없으면 Deployment의 롤링 업데이트)에는 환경마다 앱 파드가 하나 더 뜬다(maxSurge 1): 요청 +384, 한도 +512.
#     카나리는 그 하나를 잠깐이 아니라 대기와 분석(약 2분 30초) 동안 띄워 둘 수 있다(prod가 3개면 카나리 2개·stable 2개). 차트의 파드 템플릿을 고치면 두 환경이 같은 main의 차트를 읽으므로 동시에 배포된다.
#   최악(prod가 3개인 채 두 환경이 동시에 배포하는 경우)의 요청 합은 800 + 560 + 1056 + 368 + 96 + 160 + 928 + 1440 + 384 + 384 = 6176으로 노드 안에 든다(요청은 스케줄러가 자리를 계산하는 값이다).
#   4단계에서 새로 더하는 요청은 약 1.6GiB까지로 잡았고(ArgoCD 컨트롤러 요청을 올린 256은 위 ArgoCD 몫에 따로 들어 있다) 그중 kube-prometheus-stack이 1056, Loki·Alloy가 368을 쓴다(합 1424).
#   5단계에서 dev 앱을 2개로 늘린 요청 384도 위 dev 몫에 들어 있다.
#   같은 경우의 한도 합은 800 + 1792 + 2432 + 832 + 320 + 480 + 1408 + 2176 + 512 + 512 = 11264로 노드(8192)를 넘는다(오버커밋). 3단계까지는 이 최악(5664)도 노드 안에 들었지만
#   4단계에서 모니터링과 ArgoCD의 한도를 더해 넘었다. 모든 컨테이너가 한꺼번에 한도까지 쓰는 일은 드물다고 보고 받아들인다: 한도는 폭주하는 컨테이너 하나만 멈추게 하는 상한이고,
#   한도보다 노드가 먼저 모자라면 kubelet이 요청을 넘게 쓰는 파드부터 내쫓는다(README의 메모리 메모).
# 한도는 상한일 뿐 평소 사용량은 훨씬 작다: 2단계에서 한도 512Mi로 띄웠을 때 유휴 상태의 앱 파드는 약 320Mi였다. 실제 값은 띄운 뒤 kubectl top pods -A --sort-by=memory로 잰다.
# prod가 최대까지 늘 수 있다고 보고 예산을 잡았다: 2단계에서는 새 파드가 뜬 직후 HPA가 앱을 1개에서 2개로 늘렸다가 5분쯤 뒤에 줄이는 일이 여러 번 있었다(콜드 JVM의 CPU 급증 때문으로 추정하지만 그 순간의 CPU는 재지 않았다).
# 메모리 말고 DB 커넥션도 파드 수를 받쳐 줘야 한다: 앱 파드마다 Hikari 풀이 커넥션을 10개씩 잡아서 최대 4개(3개 + 배포(카나리) 중 1개)면 40개다.
# 차트 PostgreSQL의 max_connections(30)로는 모자라서 prod는 아래 postgresql에서 60으로 키웠다(계산은 거기에 있다). 목표 CPU 사용률(70%)은 차트 기본값이다.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
# 앱 컨테이너의 리소스: 요청 cpu 100m·memory 384Mi, 한도 memory 512Mi. 차트 기본값과 같은 값이지만 일부러 적어 둔다:
# 위 예산 계산이 기대는 값이라 계산과 값을 한 파일에서 읽게 하고, 차트 기본값을 고쳐도 이 크기가 저절로 바뀌지 않게 하려는 것이다(로컬 Docker VM에서는 요청 256Mi·한도 384Mi로 줄여 덮어썼다).
# JVM 최대 힙은 컨테이너 메모리 한도의 75%(앱 이미지의 -XX:MaxRAMPercentage=75.0)라서 한도 512Mi에서는 384Mi이고, 나머지 128Mi에 메타스페이스·스레드 스택·코드 캐시 같은 힙 밖 메모리가 들어간다.
# 부하 때 OOMKilled(exit 137)가 보이면 한도를 올린다(힙 상한도 한도의 75%로 따라 오른다). cpu 요청 100m는 HPA가 CPU 사용률(%)을 셈하는 분모이기도 하다(차트 values.yaml의 resources 주석).
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
database:
  # DB 비밀번호가 든 Secret의 이름 (키는 password). Secret은 Git에 없다: 클러스터의 shortener-prod 네임스페이스에 손으로 만든다 (README의 부트스트랩).
  existingSecret: shortener-db
# 클러스터 안의 PostgreSQL을 prod 크기로 키운다. 차트 기본값(max_connections=30)은 앱 파드 최대 2개(커넥션 20개)에 맞춘 값이라서, 최대 3개에 배포(카나리) 중 1개가 더 뜨는 prod를 받지 못한다.
# dev도 파드 2개에 배포 중 1개가 더 떠서 차트 기본값으로는 모자라 커넥션 상한만 덮어쓴다(environments/dev/values.yaml의 postgresql, max_connections=50).
postgresql:
  # postgres -c 이름=값 인자다. Helm은 맵을 키 단위로 합치지만 리스트는 통째로 바꾸므로, 이 목록은 차트 기본값(shared_buffers=32MB, max_connections=30)과 합쳐지지 않고 그것을 대신한다.
  # max_connections=60은 커넥션 예산에서 나왔다:
  #   - 앱 파드마다 Hikari 풀이 커넥션을 10개씩 연다. 앱이 풀 크기를 정하지 않아 최대 10개가 기본값이고, 최소 유휴 수(minimumIdle)의 기본값이 최대와 같아서 풀은 시작하자마자 10개를 모두 열고 줄어들지도 않는다.
  #   - prod는 HPA로 최대 3개이고 배포 중에는 maxSurge 1로 하나가 더 떠서 최대 4개 × 10 = 40개가 동시에 열린다. 차트 기본값(30)에서는 파드 3개가 30개를 다 잡고 있어서 4번째 파드는 첫 커넥션부터 "sorry, too many clients already"로 거절당한다.
  #     카나리(setWeight 50)에서는 롤링 업데이트와 달리 4개가 잠깐이 아니라 대기와 분석(약 2분 30초) 동안 이어진다: 파드 3개의 절반을 맞추려고 카나리 2개·stable 2개를 띄운다(차트 templates/rollout.yaml).
  #   - 40에 더해 풀 밖의 커넥션이 있다: 사람이 psql로 붙는 세션, pg_isready 프로브가 잠깐씩 여는 커넥션, 배포에서 내려가는 파드가 풀을 닫기 전에 새 파드가 풀을 여는 겹침(내려가는 파드의 풀 10개까지)이다.
  #     마이그레이션(Flyway)은 앱과 같은 DataSource를 써서 풀의 10개 안에서 돌므로 따로 더하지 않는다.
  #   - superuser_reserved_connections(기본 3)는 max_connections 중 슈퍼유저 전용으로 남겨 두는 자리라서, 일반 계정은 60 - 3 = 57개까지만 쓴다. 40 + 10(겹침) + psql·프로브 몇 개는 이 57 안에 든다.
  #     지금 앱 계정(shortener)은 슈퍼유저라서 예약 자리까지 쓸 수 있지만(공식 이미지는 POSTGRES_USER로 만든 계정을 슈퍼유저로 만든다) 57을 기준으로 잡았다: 나중에 앱 계정을 일반 계정으로 바꿔도 예산이 그대로 맞는다.
  # shared_buffers는 메모리 한도에 대한 비율을 차트와 같게 맞춘 값이다(32MB/256Mi = 64MB/512Mi = 1/8).
  args:
    - -c
    - shared_buffers=64MB
    - -c
    - max_connections=60
  # 메모리: PostgreSQL은 연결마다 백엔드 프로세스를 하나씩 띄워 메모리를 쓰고, 거기에 연결 수와 상관없이 한 번 잡히는 공유 메모리(shared_buffers)가 더해진다. 최대 60개 연결 + 64MB + 기본 프로세스들이 한도 안에 들어야 한다.
  # 차트의 요청·한도(128Mi·256Mi)는 shared_buffers 32MB·연결 30개에 맞춘 크기다. prod는 둘 다 두 배가 되므로 요청·한도도 두 배(256Mi·512Mi)로 키웠다. 요청 : 한도 = 1 : 2는 차트와 같다.
  # 로컬(arm64) Docker에서 이 인자로 띄워 쟀다(EC2에서는 재지 않았다): 연결이 없을 때 PostgreSQL 프로세스 9개가 합쳐 약 28MB, 쿼리를 하나씩 돌리는 연결 40개를 맺으면 약 81MB(연결당 약 1.3MB)였다.
  # 앱이 쿼리를 돌린 연결은 이보다 더 쓰고 shared_buffers는 차면 64MB까지 늘어나므로, 한도는 이 값보다 훨씬 크게 잡았다. 띄운 뒤 kubectl top pods -n shortener-prod로 확인한다.
  # cpu 요청은 적지 않았다: 맵은 키 단위로 합쳐지므로 차트 기본값(50m)이 그대로 남는다.
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
# 관측(4단계): 이 릴리스의 메트릭 수집(ServiceMonitor)과 SLO 규칙·알림(PrometheusRule)을 켠다. SLO 목표(가용성 99.5%, 요청의 99%가 0.3초 안)는 차트 기본값을 쓴다.
# 둘 다 kube-prometheus-stack이 설치하는 CRD라서, CRD가 아직 없는 새 클러스터에서는 차트가 만들지 않고 CRD가 생긴 뒤 ArgoCD가 다시 렌더링할 때 추가된다
# (차트 templates/prometheusrule.yaml 머리말의 [조건부 생성]).
metrics:
  serviceMonitor:
    enabled: true
slo:
  enabled: true
# 카나리 배포(5단계): 앱을 Argo Rollouts의 Rollout으로 배포한다. 새 버전은 파드의 절반(파드 2개면 1개, 3개면 카나리 2개·stable 2개)에 먼저 올라가고,
# 1분 대기 뒤 분석(30초 간격으로 4번)을 통과하면 전체로 바뀐다. 그 분석에서 카나리 파드들의 5xx 비율이 5% 이상인 측정이 두 번이면(또는 카나리 파드가 5분 안에 Ready가 되지 못하면)
# Argo Rollouts가 배포를 중단하고 옛 버전으로 되돌린다(README의 카나리 배포).
# prod의 카나리는 dev에서 확인하고 승격한 버전을 prod의 요청으로 한 번 더 확인하는 관문이다(차트의 파드 템플릿을 고쳐 승격 없이 두 환경에 함께 배포될 때도 같다).
# 장애 주입(fault.errorRate)은 prod에 적지 않는다(차트 기본값 "0").
rollout:
  enabled: true

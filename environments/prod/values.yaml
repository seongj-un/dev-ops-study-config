# prod 환경 값. ArgoCD의 shortener-prod Application(argocd/apps/shortener-prod.yaml)이 차트 기본값(charts/shortener/values.yaml) 위에
# 이 파일을 얹어 shortener-prod 네임스페이스에 배포한다. 여기에는 차트 기본값과 다른 것만 적는다.
#
# prod는 차트 기본값을 그대로 쓴다: 오토스케일링(HPA 파드 1~2개, CPU 사용률 목표 70%), 앱 메모리 요청 384Mi·한도 512Mi.
# dev와 다른 점은 environments/dev/values.yaml의 머리말에 정리해 두었다.
#
# 이 파일에도 dev 파일처럼 빈 줄이 하나도 없다. yq는 값을 고쳐 다시 쓸 때 키 사이의 빈 줄을 지우므로(dev 파일 머리말 참고),
# 처음부터 그 모양으로 커밋해 두어야 yq로 승격할 때도 바뀌는 줄이 태그 하나뿐이다.
image:
  # 배포할 앱 이미지의 태그, 곧 앱 저장소 main 커밋 SHA 전체 40자다 (차트가 이 형식이 아니면 렌더링을 거부한다).
  # 이 줄은 사람이 PR로만 바꾼다(승격): dev(environments/dev/values.yaml)에서 확인한 SHA를 그대로 옮겨 온다.
  # 앱 저장소의 CI는 이 파일을 건드리지 않으므로 prod는 PR을 머지해야만 바뀐다.
  # 값은 따옴표로 감싼다: dev 파일과 같은 형식으로 두어 SHA를 통째로 복사·붙여넣을 수 있게 하고, 숫자나 지수 표기로 읽히지 않게 한다.
  tag: "3d911e42d788f0021a82e8e973b1335a412220f2"
# 응답의 shortUrl 앞에 붙는 공개 주소. Ingress로 들어오는 주소와 같아야 한다 (k3d가 맥의 8090 포트를 Traefik에 이어 준다: clusters/local/k3d.yaml).
baseUrl: http://shortener.localhost:8090
ingress:
  # *.localhost는 루프백으로 해석되므로 /etc/hosts를 고치지 않아도 된다. dev(shortener-dev.localhost)와 다른 이름이어야 Traefik이 요청을 나눈다.
  host: shortener.localhost
database:
  # DB 비밀번호가 든 Secret의 이름 (키는 password). Secret은 Git에 없다: 클러스터의 shortener-prod 네임스페이스에 손으로 만든다 (README의 부트스트랩).
  existingSecret: shortener-db

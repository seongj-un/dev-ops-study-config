# prod 환경 값. ArgoCD의 shortener-prod Application(argocd/apps/shortener-prod.yaml)이 차트 기본값(charts/shortener/values.yaml) 위에
# 이 파일을 얹어 shortener-prod 네임스페이스에 배포한다. 여기에는 차트 기본값과 다른 것만 적는다.
#
# prod도 로컬 클러스터에서는 dev와 같은 크기로 띄운다: 파드 1개(HPA 끔), 앱 메모리 요청 256Mi·한도 384Mi (차트 기본값은 HPA로 파드 1~2개, 요청 384Mi·한도 512Mi).
# dev와 다른 점은 이미지 태그를 올리는 방법(prod는 PR로 승격)과 호스트 이름·공개 주소뿐이다. 비교는 environments/dev/values.yaml의 머리말에 있다.
#
# 이 파일에도 dev 파일처럼 빈 줄이 하나도 없다. yq는 값을 고쳐 다시 쓸 때 키 사이의 빈 줄을 지우므로(dev 파일 머리말 참고),
# 처음부터 그 모양으로 커밋해 두어야 yq로 승격할 때도 바뀌는 줄이 태그 하나뿐이다.
image:
  # 배포할 앱 이미지의 태그, 곧 앱 저장소 main 커밋 SHA 전체 40자다 (차트가 이 형식이 아니면 렌더링을 거부한다).
  # 이 줄은 사람이 PR로 바꾼다(승격): dev(environments/dev/values.yaml)에서 확인한 SHA를 그대로 옮겨 온다.
  # "prod는 PR로만 바뀐다"는 규칙은 사람에게 저장소 룰셋이 강제한다(main 직접 푸시 금지, PR 필수). 앱 저장소 CI가 쓰는 deploy key는 그 룰셋을 우회(bypass)하도록 등록되어 있고,
  # 우회는 저장소 전체에 미치므로 기술적으로는 이 파일도 main에 직접 커밋할 수 있다. 그런데도 prod가 그대로인 것은 CI 스크립트가 dev 파일(environments/dev/values.yaml)만 고치기 때문이다.
  # 이 파일을 지켜 주는 것은 룰셋이 아니라 그 스크립트의 절제다.
  # 값은 따옴표로 감싼다: dev 파일과 같은 형식으로 두어 SHA를 통째로 복사·붙여넣을 수 있게 하고, 숫자나 지수 표기로 읽히지 않게 한다.
  tag: "3d911e42d788f0021a82e8e973b1335a412220f2"
# 응답의 shortUrl 앞에 붙는 공개 주소. Ingress로 들어오는 주소와 같아야 한다 (k3d가 맥의 8090 포트를 Traefik에 이어 준다: clusters/local/k3d.yaml).
baseUrl: http://shortener.localhost:8090
ingress:
  # *.localhost는 루프백으로 해석되므로 /etc/hosts를 고치지 않아도 된다. dev(shortener-dev.localhost)와 다른 이름이어야 Traefik이 요청을 나눈다.
  host: shortener.localhost
# 파드 1개로 고정하고 HPA를 끈다: autoscaling.enabled가 false이면 차트가 HPA를 만들지 않고 Deployment에 replicas를 적으므로(replicaCount) 그 값이 쓰인다.
# 이유는 이 로컬 클러스터의 메모리 예산이다. dev와 prod 두 벌이 ArgoCD와 함께 한 Docker VM에 뜬다.
#   - Docker VM은 약 2.84GiB(약 2908MiB)이고, 그중 사용자의 다른 컨테이너가 약 600MiB, 빈 클러스터(k3s·Traefik 등)가 약 770MiB를 써서 이 클러스터의 워크로드에 쓸 여유는 약 1.5GiB다.
#   - 그 안에 ArgoCD(메모리 요청 약 304Mi)와 환경 두 벌(각각 앱 + PostgreSQL + Redis, 요청 416Mi)이 들어가 요청 합이 1136Mi다. 한도(limits) 합은 2304Mi로 여유를 넘는다.
#     한도는 상한일 뿐 평소 사용량은 훨씬 작다는 것에 기대는 예산이라, 실제 사용량은 띄운 뒤에 잰다(README의 메모리 메모).
#   - 롤링 업데이트 중에는 그 환경의 앱 JVM 파드가 하나 더 뜬다(maxSurge 1, 요청 256Mi·한도 384Mi). HPA가 prod를 2개로 늘려 둔 채 롤링 업데이트를 하면 prod의 앱 JVM만 3개가 된다.
# HPA(파드 1~2개)는 prod를 EC2로 옮기는 6단계에서 다시 켠다. HPA 자체는 2단계에서 이미 연습했다.
autoscaling:
  enabled: false
replicaCount: 1
# 앱 컨테이너의 리소스: dev와 같다(요청 cpu 100m·memory 256Mi, 한도 memory 384Mi). 차트 기본값은 요청 memory 384Mi·한도 512Mi다.
# JVM 최대 힙은 컨테이너 메모리 한도의 75%(앱 이미지의 -XX:MaxRAMPercentage=75.0)라서 한도 384Mi에서는 288Mi다. 나머지 96Mi는 메타스페이스·스레드 스택·코드 캐시 같은 힙 밖 몫이다.
# 이 수치가 빠듯한지는 띄운 뒤 kubectl top pods로 보고, OOMKilled(exit 137)가 보이면 한도를 올린다. 자세한 근거는 environments/dev/values.yaml의 resources 위 주석에 있다.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 384Mi
database:
  # DB 비밀번호가 든 Secret의 이름 (키는 password). Secret은 Git에 없다: 클러스터의 shortener-prod 네임스페이스에 손으로 만든다 (README의 부트스트랩).
  existingSecret: shortener-db

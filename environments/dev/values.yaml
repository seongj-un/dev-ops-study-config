# dev 환경 값. ArgoCD의 shortener-dev Application(argocd/apps/shortener-dev.yaml)이 차트 기본값(charts/shortener/values.yaml) 위에
# 이 파일을 얹어 shortener-dev 네임스페이스에 배포한다. Helm은 값 파일을 나중에 나온 것이 앞선 것을 덮어쓰게 합치고, 맵은 키 단위로 합치므로
# (리스트는 통째로 바뀐다) 여기에는 차트 기본값과 다른 것만 적는다.
#
# dev와 prod(environments/prod/values.yaml)의 차이
#   - 이미지 태그를 올리는 방법: dev는 앱 저장소의 CI가 main에 머지될 때마다 자동으로 바꾼다(아래 image.tag). prod는 사람이 PR로 바꾼다(승격).
#   - 호스트 이름과 공개 주소: dev는 shortener-dev.localhost, prod는 shortener.localhost
#   - 파드 수와 앱 메모리는 같다: 둘 다 파드 1개(HPA 없음), 앱 메모리 요청 256Mi·한도 384Mi. 로컬 클러스터에 두 환경이 함께 뜨는 메모리 예산 때문이고,
#     계산은 environments/prod/values.yaml의 autoscaling 위 주석에 있다. (차트 기본값은 HPA로 파드 1~2개, 앱 메모리 요청 384Mi·한도 512Mi다.)
#
# 이 파일에는 빈 줄이 하나도 없고, 설명은 모두 그 설명이 붙는 키 바로 위 줄에 있다. CI가 쓰는 yq는 값을 고쳐 다시 쓸 때 키 사이의 빈 줄을 지운다(yq 4.53.6에서 확인).
# 빈 줄이 있는 파일을 커밋해 두면 첫 자동 커밋이 태그 한 줄만이 아니라 파일 곳곳의 빈 줄까지 바꾸게 된다. 처음부터 yq가 쓰는 모양(yq -i '.'를 돌려도 그대로다)으로
# 커밋해 두었으므로 자동 커밋마다 바뀌는 줄은 태그 하나뿐이다. 새 설정을 추가할 때도 빈 줄로 구역을 나누지 말고 이 모양을 지킨다(validate 워크플로가 이 모양을 검사한다).
image:
  # 배포할 앱 이미지의 태그, 곧 앱 저장소 main 커밋 SHA 전체 40자다 (차트가 이 형식이 아니면 렌더링을 거부한다).
  # 이 줄은 CI가 고친다: 앱 저장소의 deploy-dev 잡이 main 푸시마다 아래 명령으로 태그를 바꾸고 이 저장소 main에 직접 커밋한다(CI에서 IMAGE_TAG는 커밋 SHA다).
  #   IMAGE_TAG=<커밋 SHA> yq -i '.image.tag = strenv(IMAGE_TAG)' environments/dev/values.yaml
  # strenv를 쓰는 이유: 값이 yq 식에 글자로 끼워 넣어지지 않고 환경 변수로 들어가며, 항상 문자열로 남는다(env()는 값을 YAML로 해석해 숫자처럼 생긴 값을 숫자로 읽을 수 있다).
  # 이 식이 image.tag 위치를 가리키므로 image: 아래에 tag 키를 한 줄로 유지해야 하고, 손으로는 고치지 않는다.
  # 값은 따옴표로 감싼다: 40자 16진수가 우연히 숫자(예: 1234...)나 지수 표기(예: 1234e5...)처럼 생겨도 YAML이 숫자가 아닌 문자열로 읽게 하려는 것이다.
  tag: "b3e7d17fc986e40f4bff44d751e88deeb4eae340"
# 응답의 shortUrl 앞에 붙는 공개 주소. Ingress로 들어오는 주소와 같아야 한다 (k3d가 맥의 8090 포트를 Traefik에 이어 준다: clusters/local/k3d.yaml).
baseUrl: http://shortener-dev.localhost:8090
ingress:
  # *.localhost는 루프백으로 해석되므로 /etc/hosts를 고치지 않아도 된다. prod(shortener.localhost)와 다른 이름이어야 Traefik이 요청을 나눈다.
  host: shortener-dev.localhost
# 파드 1개로 고정한다(prod도 같다). autoscaling.enabled가 false이면 차트가 HPA를 만들지 않고 Deployment에 replicas를 적으므로(replicaCount) 그 값이 쓰인다.
# 메모리가 빠듯한 Docker VM에서 파드가 늘어나 다른 환경의 자리를 뺏지 않게 하려는 것이다(예산 계산은 environments/prod/values.yaml의 autoscaling 위 주석).
autoscaling:
  enabled: false
replicaCount: 1
# 앱 컨테이너의 리소스. 차트 기본값(요청 cpu 100m·memory 384Mi, 한도 memory 512Mi)보다 메모리를 줄였다: 요청 256Mi, 한도 384Mi (prod도 같다).
# JVM 최대 힙은 컨테이너의 메모리 한도(요청이 아니다)의 75%다(앱 이미지의 -XX:MaxRAMPercentage=75.0). 한도 384Mi에서는 힙 상한이 288Mi이고(기본 한도 512Mi에서는 384Mi),
# 나머지 96Mi에 메타스페이스·스레드 스택·코드 캐시 같은 힙 밖 메모리가 들어간다. 힙 밖 메모리의 필요량은 한도를 줄여도 크게 줄지 않으므로 이 몫(96Mi)이 기본값의 몫(128Mi)보다 빠듯하다.
# 2단계에서 한도 512Mi로 띄웠을 때 앱 파드의 유휴 메모리 사용량(kubectl top)은 약 320Mi였다. 힙 상한이 줄었으니 이 값도 줄 것으로 보지만 재어 본 것은 아니다(추정).
# 띄운 뒤 kubectl top pods로 확인하고, 부하 때 OOMKilled(exit 137)가 보이면 한도를 올린다(힙 상한도 한도의 75%로 따라 오른다).
# 요청은 스케줄러가 자리를 계산하는 값일 뿐 사용량의 상한이 아니다. cpu 요청 100m는 차트 기본값 그대로다(HPA가 꺼져 있어 스케줄러의 자리 계산과 CPU 가중치로만 쓰인다).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 384Mi
database:
  # DB 비밀번호가 든 Secret의 이름 (키는 password). Secret은 Git에 없다: 클러스터의 shortener-dev 네임스페이스에 손으로 만든다 (README의 부트스트랩).
  existingSecret: shortener-db

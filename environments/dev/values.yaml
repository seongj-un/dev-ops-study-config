# dev 환경 값. ArgoCD의 shortener-dev Application(argocd/apps/shortener-dev.yaml)이 차트 기본값(charts/shortener/values.yaml) 위에
# 이 파일을 얹어 shortener-dev 네임스페이스에 배포한다. Helm은 값 파일을 나중에 나온 것이 앞선 것을 덮어쓰게 합치고, 맵은 키 단위로 합치므로
# (리스트는 통째로 바뀐다) 여기에는 이 환경에서 정한 값을 적는다: 차트 기본값과 다른 것, 그리고 같더라도 일부러 적어 두는 것(아래 resources).
#
# 클러스터는 EC2 m7i-flex.large(2 vCPU, 메모리 8GiB) 한 대의 k3s다(ap-northeast-2). 로컬 k3d 클러스터(Docker VM 2.84GiB)는 dev 롤링 업데이트 중에 메모리가 모자라서
# 프로젝트를 EC2로 옮겼고 멈춰 두었다. 로컬 k3d로 다시 띄우려면 baseUrl·ingress.host를 *.localhost 이름으로, 앱 메모리를 예전 크기로 덮어써야 한다(README의 메모리 메모).
#
# dev와 prod(environments/prod/values.yaml)의 차이
#   - 이미지 태그를 올리는 방법: dev는 앱 저장소의 CI가 main에 머지될 때마다 자동으로 바꾼다(아래 image.tag). prod는 사람이 PR로 바꾼다(승격).
#   - 호스트 이름과 공개 주소: dev는 dev.dev-ops-study.duckdns.org, prod는 dev-ops-study.duckdns.org
#   - 파드 수: dev는 1개 고정(HPA 없음), prod는 HPA가 1~3개로 조절한다. 앱 메모리는 같다(요청 384Mi·한도 512Mi, 차트 기본값과 같은 값).
#     두 환경이 한 노드의 메모리를 나눠 쓰는 예산 계산은 environments/prod/values.yaml의 autoscaling 위 주석에 있다.
#
# 이 파일에는 빈 줄이 하나도 없고, 설명은 모두 그 설명이 붙는 키 바로 위 줄에 있다. CI가 쓰는 yq는 값을 고쳐 다시 쓸 때 키 사이의 빈 줄을 지운다(yq 4.53.6에서 확인).
# 빈 줄이 있는 파일을 커밋해 두면 첫 자동 커밋이 태그 한 줄만이 아니라 파일 곳곳의 빈 줄까지 바꾸게 된다. 처음부터 yq가 쓰는 모양(yq -i '.'를 돌려도 그대로다)으로
# 커밋해 두었으므로 자동 커밋마다 바뀌는 줄은 태그 하나뿐이다. 새 설정을 추가할 때도 빈 줄로 구역을 나누지 말고 이 모양을 지킨다(validate 워크플로가 이 모양을 검사한다).
image:
  # 배포할 앱 이미지의 태그, 곧 앱 저장소 main 커밋 SHA 전체 40자다 (차트가 이 형식이 아니면 렌더링을 거부한다).
  # 이 줄은 CI가 고친다: 앱 저장소의 deploy-dev 잡이 main 푸시마다 아래 명령으로 태그를 바꾸고 이 저장소 main에 직접 커밋한다(CI에서 IMAGE_TAG는 커밋 SHA다).
  #   IMAGE_TAG=<커밋 SHA> yq -i '.image.tag = strenv(IMAGE_TAG)' environments/dev/values.yaml
  # strenv를 쓰는 이유: 값이 yq 식에 글자로 끼워 넣어지지 않고 환경 변수로 들어가며, 항상 문자열로 남는다(env()는 값을 YAML로 해석해 숫자처럼 생긴 값을 숫자로 읽을 수 있다).
  # 이 식이 image.tag 위치를 가리키므로 image: 아래에 tag 키를 한 줄로 유지해야 하고, 손으로는 고치지 않는다.
  # 값은 따옴표로 감싼다: 40자 16진수가 우연히 숫자(예: 1234...)나 지수 표기(예: 1234e5...)처럼 생겨도 YAML이 숫자가 아닌 문자열로 읽게 하려는 것이다.
  tag: "95bc45ab177e666e5ce8287de051aeab985efa8c"
# 응답의 shortUrl 앞에 붙는 공개 주소. Ingress로 들어오는 주소와 같아야 한다. DuckDNS 이름 dev-ops-study가 EC2 노드의 IP를 가리키고, DuckDNS가 그 아래의 하위 이름(dev.dev-ops-study.duckdns.org)도 같은 IP로 해석한다.
# 그 노드의 80 포트로 들어온 요청을 k3s 기본 Traefik이 받는다. 평문 HTTP의 기본 포트(80)라서 주소에 포트 번호가 없다. HTTPS는 나중에 cert-manager로 붙인다(붙이면 이 주소도 https로 바꾼다).
baseUrl: http://dev.dev-ops-study.duckdns.org
ingress:
  # prod(dev-ops-study.duckdns.org)와 같은 IP로 들어오므로, 이름이 달라야 Traefik이 Host 헤더로 요청을 나눈다.
  host: dev.dev-ops-study.duckdns.org
# 파드 1개로 고정한다. autoscaling.enabled가 false이면 차트가 HPA를 만들지 않고 Deployment에 replicas를 적으므로(replicaCount) 그 값이 쓰인다(차트 기본값은 HPA를 켠다).
# dev는 prod로 승격하기 전에 확인하는 환경이라 부하에 맞춰 늘릴 이유가 없다. 노드의 메모리 예산도 dev 앱 1개(롤링 업데이트 중에는 2개)를 전제로 계산했다(environments/prod/values.yaml의 autoscaling 위 주석).
autoscaling:
  enabled: false
replicaCount: 1
# 앱 컨테이너의 리소스: 요청 cpu 100m·memory 384Mi, 한도 memory 512Mi (prod도 같다). 차트 기본값과 같은 값이지만 일부러 적어 둔다:
# 메모리 예산 계산(environments/prod/values.yaml의 autoscaling 위 주석)이 기대는 값이라 계산과 값을 한 곳에서 읽게 하고, 차트 기본값을 고쳐도 이 크기가 저절로 바뀌지 않게 하려는 것이다.
# 로컬 Docker VM(2.84GiB)에서는 요청 256Mi·한도 384Mi로 줄여 덮어썼다. 메모리 8GiB인 EC2 노드에서는 줄일 이유가 없어 기본값으로 되돌렸다.
# JVM 최대 힙은 컨테이너의 메모리 한도(요청이 아니다)의 75%다(앱 이미지의 -XX:MaxRAMPercentage=75.0). 한도 512Mi에서는 힙 상한이 384Mi이고(한도 384Mi에서는 288Mi였다),
# 나머지 128Mi에 메타스페이스·스레드 스택·코드 캐시 같은 힙 밖 메모리가 들어간다. 2단계에서 이 한도로 띄웠을 때 앱 파드의 유휴 메모리 사용량(kubectl top)은 약 320Mi였다.
# 부하 때 OOMKilled(exit 137)가 보이면 한도를 올린다(힙 상한도 한도의 75%로 따라 오른다).
# 요청은 스케줄러가 자리를 계산하는 값일 뿐 사용량의 상한이 아니다. cpu 요청 100m는 HPA가 꺼져 있어 스케줄러의 자리 계산과 CPU 가중치로만 쓰인다.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
database:
  # DB 비밀번호가 든 Secret의 이름 (키는 password). Secret은 Git에 없다: 클러스터의 shortener-dev 네임스페이스에 손으로 만든다 (README의 부트스트랩).
  existingSecret: shortener-db
# 관측(4단계): 이 릴리스의 메트릭 수집(ServiceMonitor)과 SLO 규칙·알림(PrometheusRule)을 켠다. SLO 목표(가용성 99.5%, 요청의 99%가 0.3초 안)는 차트 기본값을 쓴다.
# 둘 다 kube-prometheus-stack이 설치하는 CRD라서, CRD가 아직 없는 새 클러스터에서는 차트가 만들지 않고 CRD가 생긴 뒤 ArgoCD가 다시 렌더링할 때 추가된다
# (차트 templates/prometheusrule.yaml 머리말의 [조건부 생성]).
metrics:
  serviceMonitor:
    enabled: true
slo:
  enabled: true

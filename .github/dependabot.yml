# Dependabot: 주 1회 GitHub Actions 갱신 PR을 자동으로 연다. PR은 하나로 묶는다.
#
# 이 저장소는 워크플로의 액션을 전체 커밋 SHA로 고정한다(.github/workflows/validate.yml). 고정한 값은 저절로 갱신되지 않아서
# Dependabot이 없으면 보안 패치가 나와도 옛 버전에 머문다. Dependabot은 액션의 SHA와 그 뒤의 `# vX.Y.Z` 주석을 함께 올려 준다.
# 갱신 PR에도 validate 워크플로가 돌아서 새 버전을 머지 전에 검증한다.
#
# groups로 묶는 이유: 갱신마다 PR이 따로 열리면 검사가 PR 수만큼 돌고 리뷰 부담이 커진다. 한 번에 모아서 검토하고 머지한다.
#
# 이 파일이 감시하는 것은 액션 참조(uses:)뿐이다. 다른 곳에 고정해 둔 값은 Dependabot이 올려 주지 않으니 손으로 올린다:
#   - validate.yml의 setup-helm 입력 version(Helm 버전), KUBECONFORM_IMAGE(kubeconform 태그@다이제스트), K8S_SCHEMA_LOCATION·CRD_SCHEMA_LOCATION(스키마 모음의 커밋 SHA)
#     (액션의 입력값과 env 값이라 github-actions 생태계가 읽지 않는다)
#   - bootstrap/argocd/values.yaml과 README의 ArgoCD 차트 버전
#   - charts/shortener/values.yaml의 PostgreSQL·Redis·busybox 이미지(태그@다이제스트). Helm 생태계는 설정하지 않았다.
version: 2
updates:
  # .github/workflows의 액션 (SHA + 버전 주석)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

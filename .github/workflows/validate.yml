# 검증: PR과 main 푸시마다 차트를 lint하고, dev·prod 값으로 렌더링한 매니페스트와 ArgoCD Application 매니페스트를 스키마로 검사한다.
# 클러스터 없이 하는 정적 검증이다. 이 저장소의 main은 곧 클러스터에 배포될 상태라서, 깨진 커밋이 main에 들어가기 전에 여기서 걸러 낸다.
# main 푸시에서도 돈다: 앱 저장소의 CI가 dev 이미지 태그를 직접 커밋하는 경우(PR 없이 main에 들어간다)에도 그 결과를 한 번 더 검사한다.
#
# 잡 표시 이름(validate)은 룰셋 "PR 필수"가 필수 상태 검사로 요구하는 이름이라 바꾸면 안 된다(룰셋은 이름으로 검사를 찾는다).
# 같은 이유로 paths 필터도 두지 않는다. 필터로 워크플로가 건너뛰어지면 그 검사는 "Pending"으로 남고, 필수 검사를 요구하는 PR은 머지할 수 없게 된다.
# 환경마다 잡을 나누는 matrix도 쓰지 않는다: 그러면 표시 이름이 "validate (dev)"처럼 바뀌어 필수 검사 이름과 맞지 않는다. 한 잡 안에서 dev와 prod를 차례로 돈다.
# (앱 저장소 CI의 deploy key는 그 룰셋을 우회하므로 CI의 dev 태그 직접 커밋은 이 검사를 기다리지 않는다. 그 커밋에는 푸시된 뒤에 위 push 이벤트로 검사가 돈다.)
name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 기본 권한은 저장소 읽기뿐이다 (permissions에 적지 않은 권한은 모두 none이 된다). 이 워크플로는 쓰기가 필요한 일이 없다.
permissions:
  contents: read

# 같은 ref(브랜치 또는 PR)에서 새 실행이 시작되면 이전 실행을 취소한다. 취소는 PR에서만 한다. main에서는 진행 중인 검사를 끊지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    # ubuntu-latest는 GitHub가 가리키는 이미지를 새 LTS로 옮기면 워크플로를 고치지 않아도 환경이 바뀐다(곧 26.04로 바뀐다고 공지됐다). 버전을 고정해 환경을 예측 가능하게 둔다.
    runs-on: ubuntu-24.04
    # 기본 타임아웃은 360분이다. 멈춘 잡(예: 스키마 내려받기 대기)이 러너를 오래 붙잡지 않게 상한을 둔다.
    timeout-minutes: 10
    env:
      # 검증 기준이 되는 쿠버네티스 버전. 클러스터의 k3s(v1.35.8)와 같은 마이너 버전이다. helm이 .Capabilities와 차트의 kubeVersion 조건을 평가할 때와
      # kubeconform이 스키마를 고를 때 같은 값을 쓰게 한다(ArgoCD도 helm template에 클러스터의 버전을 넘긴다).
      KUBERNETES_VERSION: 1.35.0
      # kubeconform 이미지: 태그@다이제스트로 고정한다(다이제스트가 실제로 가리키는 이미지이고, 태그는 사람이 읽으라고 남긴 표시다). 멀티 아키텍처 인덱스의 다이제스트다.
      # 이 값은 액션이 아니라 셸 명령에서 쓰여서 Dependabot이 갱신해 주지 않는다. 올릴 때는 docker buildx imagetools inspect ghcr.io/yannh/kubeconform:<태그>로 다이제스트를 확인해 함께 바꾼다.
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
      # 쿠버네티스 내장 리소스(Deployment, Service 등)의 스키마 위치. kubeconform이 -schema-location 없이 실행될 때 쓰는 기본값
      # (https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json)에서
      # master만 커밋 SHA로 바꾼 것이다. 이 master는 스키마 저장소의 브랜치 이름이라 며칠마다 새 커밋이 쌓인다(최근 커밋은 쿠버네티스 master의 스키마를 갱신하거나 새 패치 버전의 스키마를 추가한 것이다).
      # 우리가 쓰는 v1.35.0 디렉터리는 2025-12-19에 추가된 뒤 바뀐 적이 없지만 앞으로도 그렇다는 보장은 없다. 브랜치 이름 대신 커밋 SHA로 고정하면 남의 저장소가 바뀌어도
      # 이 저장소의 검증 결과가 어느 날 갑자기 달라지지 않는다(아래 CRD 스키마 모음과 같은 이유). 고른 SHA는 2026-09-29의 최신 커밋이다.
      # 자리표시자는 kubeconform이 채운다: {{.NormalizedKubernetesVersion}}은 -kubernetes-version 값(1.35.0)에 v를 붙인 v1.35.0, {{.StrictSuffix}}는 -strict를 줄 때만 -strict다.
      # Dependabot이 갱신해 주지 않으니 쿠버네티스 마이너 버전을 올려 새 스키마가 필요할 때 손으로 새 커밋 SHA로 바꾼다.
      K8S_SCHEMA_LOCATION: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/8df8a883b68a24a104b4a9e43c1288090ae60b3b/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json
      # CRD(쿠버네티스 내장 리소스가 아닌 kind)의 스키마 위치. CRD는 위 내장 리소스 스키마에 없어서 datreeio의 CRD 스키마 모음에서 받는다. 이 저장소는 이것으로
      # ArgoCD의 Application(argoproj.io, Argo CD 3.5.0 CRD 기준)과 차트의 ServiceMonitor·PrometheusRule(monitoring.coreos.com, Prometheus Operator의 CRD),
      # 차트의 Middleware(traefik.io/middleware_v1alpha1.json), 발급자 ClusterIssuer(cert-manager.io/clusterissuer_v1.json)를 검사한다.
      # 이 커밋의 두 스키마에는 쓰는 필드(redirectScheme의 scheme·permanent, headers의 stsSeconds·stsIncludeSubdomains·stsPreload,
      # ACME의 server·privateKeySecretRef·solvers[].http01.ingress.ingressClassName)가 모두 있다.
      # 이 커밋의 monitoring.coreos.com 스키마는 클러스터의 Prometheus Operator(v0.94.1, kube-prometheus-stack 91.8.2)보다 오래됐다(PrometheusRule은 0.80.1,
      # ServiceMonitor는 2026-02의 main 기준). 차트가 쓰는 필드는 모두 들어 있지만, 그 뒤에 생긴 필드를 쓰면 스키마에 없는 필드라서 검사가 실패한다.
      # 모음의 main 브랜치는 거의 매일 바뀌어서 브랜치 이름이 아니라 커밋 SHA로 고정했다: 남이 스키마를 바꿔도 이 저장소의 검증 결과가 어느 날 갑자기 달라지지 않는다.
      # Dependabot이 갱신해 주지 않으니, ArgoCD나 kube-prometheus-stack(Prometheus Operator)을 CRD가 바뀌는 버전으로 올릴 때(새 필드가 필요할 때 포함) 손으로 새 커밋 SHA로 바꾼다.
      CRD_SCHEMA_LOCATION: https://raw.githubusercontent.com/datreeio/CRDs-catalog/d373c2da9702bc9509a004db83e57263fe3bdfc1/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
      # promtool을 돌리는 Prometheus 이미지. "SLO 규칙 검사"와 "카나리 분석 쿼리 검사" 두 단계가 함께 쓴다.
      # promtool은 클러스터의 Prometheus와 같은 버전을 쓴다(v3.15.0: kube-prometheus-stack 91.8.2가 띄우는 버전. 클러스터는 같은 버전의 distroless 변형을 quay.io에서 받는다).
      # 규칙 문법과 PromQL 함수는 Prometheus 버전마다 다를 수 있어서다. kube-prometheus-stack을 올리면 그 차트의 Prometheus 이미지 태그에 맞춰 이 값도 올린다.
      # 태그@다이제스트(멀티 아키텍처 인덱스)로 고정하는 방식과 이유는 KUBECONFORM_IMAGE와 같고(docker.io와 quay.io의 다이제스트가 같다), 같은 이유로 Dependabot이 갱신해 주지 않는다.
      PROMETHEUS_IMAGE: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    steps:
      # 이 파일의 액션은 태그(v5 등)가 아니라 전체 커밋 SHA로 고정하고, 뒤에 버전을 주석으로 남긴다.
      # 태그는 저장소 소유자(또는 계정을 탈취한 공격자)가 다른 커밋으로 옮길 수 있는 이름이라, 태그로 참조하면 그 시점의 코드가 그대로 실행된다.
      # 커밋 SHA는 내용의 해시라서 가리키는 코드가 바뀔 수 없다. 주석의 버전은 사람이 읽으라고 남긴 것이고, Dependabot이 SHA와 주석을 함께 올려 준다(dependabot.yml 참고).
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 체크아웃에 쓴 토큰을 러너에 남기지 않는다. 이 워크플로는 git push 같은 인증된 git 작업을 하지 않는다.
          persist-credentials: false

      # 값 파일이 "yq가 쓰는 모양" 그대로인지 확인한다. 앱 저장소 CI(deploy-dev 잡)는 dev의 image.tag를 yq -i로 고쳐 커밋하는데, yq는 파일을 다시 쓰면서
      # 키 사이의 빈 줄을 지우고 들여쓰기를 2칸으로, 줄 끝 주석 앞 공백을 한 칸으로 정리한다. 파일이 이미 그 모양이 아니면 첫 자동 커밋이 태그 한 줄이 아니라 파일 곳곳을 바꾼다.
      # `yq '.'`는 파일을 고치지 않고 yq가 쓸 모양으로 출력만 한다. 그 출력이 파일과 같아야(diff가 비어야) 자동 커밋이 언제나 태그 한 줄만 바꾼다는 불변식이 지켜진다.
      # 사람이 PR로 값 파일에 빈 줄을 넣는 식의 변경을 머지 전에 걸러 내는 것이 목적이다. prod 파일도 같은 모양이어야 승격 PR(yq로 태그만 옮긴다)의 diff가 한 줄이다.
      # yq(mikefarah v4)는 ubuntu-24.04 러너 이미지에 미리 깔려 있다. deploy-dev 잡도 같은 러너 이미지의 yq를 쓰므로 실제로 파일을 고쳐 쓰는 바로 그 yq로 검사하는 셈이고,
      # 러너 이미지가 갱신되어 yq의 출력 모양이 바뀌면 이 검사가 먼저 알려 준다. diff의 < 줄은 yq가 쓸 모양, > 줄은 지금 파일이다.
      - name: 값 파일이 yq가 쓰는 모양인지 확인 (dev, prod)
        run: |
          yq --version
          status=0
          for environment in dev prod; do
            file="environments/$environment/values.yaml"
            if diff <(yq '.' "$file") "$file"; then
              echo "$file: yq가 다시 써도 바뀌지 않는다"
            else
              echo "::error file=$file::yq가 다시 쓰면 이 파일이 바뀐다. yq -i '.' $file 로 정규화해서 커밋한다"
              status=1
            fi
          done
          exit "$status"

      # 러너 이미지에는 Helm 3이 미리 깔려 있다(3.22.0, 2026-09 기준). 그대로 쓰면 로컬(4.3.0)과 다른 메이저 버전으로 검증하게 되므로 Helm 4를 직접 설치한다.
      # 4.3.0은 로컬에서 쓰는 버전과 같다. ArgoCD v3.5.3의 repo-server가 실제로 렌더링에 쓰는 Helm은 4.2.1(ArgoCD 저장소의 hack/tool-versions.sh)이고,
      # 이 차트를 두 버전으로 렌더링해 비교하면 문서 사이의 빈 줄 하나만 다르고 나머지는 같다.
      - name: Helm 설치 (v4.3.0)
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Helm 버전 확인
        run: helm version

      # --strict: 경고도 실패로 취급한다. 값 파일(environments/<환경>/values.yaml)을 넘기는 이유는 image.tag와 DB Secret 이름이 차트의 필수 값이라
      # 값 없이 lint하면 템플릿이 안내 메시지와 함께 실패하기 때문이다. 그 값 파일이 차트 검증(태그가 커밋 SHA 40자인가 등)을 통과하는지도 함께 확인된다.
      # 차트의 ServiceMonitor·PrometheusRule·Rollout·AnalysisTemplate·Middleware(리다이렉트, HSTS)는 여기서 렌더링되지 않는다. 이 템플릿들은 클러스터에 그 CRD가 있을 때(.Capabilities.APIVersions)만 만들어지는데,
      # helm lint에는 API 목록을 더하는 --api-versions 옵션이 없어서 CRD가 없는 클러스터처럼 렌더링한다(템플릿 문법 오류는 파일을 읽을 때 걸린다). 그래서 lint에서 앱은 Deployment다.
      # 그 내용은 아래 단계들(렌더링 + 스키마 검사, 두 갈래 확인, HTTPS 확인, promtool)이 검사한다.
      - name: 차트 lint (dev, prod)
        run: |
          for environment in dev prod; do
            echo "::group::helm lint ($environment)"
            helm lint charts/shortener --strict --kube-version "$KUBERNETES_VERSION" -f "environments/$environment/values.yaml"
            echo "::endgroup::"
          done

      # ArgoCD가 렌더링하는 것과 같은 방식으로 렌더링한다: 릴리스 이름은 Application 이름(shortener-dev, shortener-prod), 네임스페이스는 대상 네임스페이스,
      # 값은 차트 기본값 위에 환경별 파일이다. 그래서 리소스 이름까지 실제 배포와 같다.
      # 결과는 파일로 받아 kubeconform의 표준 입력(-)에 넣는다. helm이 실패하면 그 자리에서 잡이 실패한다.
      # kubeconform 옵션: -strict는 스키마에 없는 필드와 중복된 키를 오류로 본다(오타를 잡는다). -kubernetes-version은 그 버전의 스키마로 검사한다.
      # -schema-location은 위에서 커밋 SHA로 고정한 내장 리소스 스키마 위치(K8S_SCHEMA_LOCATION)다. 이 옵션을 주면 기본 위치(master 브랜치)는 쓰이지 않는다.
      # 렌더링 결과에는 helm test용 파드도 들어 있어서 함께 검사된다(ArgoCD는 그 파드를 배포하지 않는다).
      # --api-versions: 클러스터에 있다고 칠 API를 더한다. ServiceMonitor·PrometheusRule 템플릿은 .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/<Kind>"가
      # 참일 때만 렌더링되는데(CRD가 아직 없는 새 클러스터에서 동기화가 실패하지 않게 하는 조건, 차트 templates/prometheusrule.yaml 머리말),
      # Has는 목록의 문자열과 글자 그대로 비교하므로 그룹/버전(monitoring.coreos.com/v1)만 넣으면 거짓이다. ArgoCD는 클러스터의 API를 그룹/버전과 그룹/버전/Kind
      # 두 형태로 모두 넘기므로, 여기서도 둘 다 넣어 kube-prometheus-stack이 설치된 클러스터에서 ArgoCD가 렌더링하는 것과 같은 결과를 만든다.
      # 그 두 리소스는 CRD라서 내장 리소스 스키마에 없다. 두 번째 -schema-location은 아래 ArgoCD Application 검사도 쓰는 CRD_SCHEMA_LOCATION(커밋 SHA로 고정한 CRD 스키마 모음)이고,
      # 그 커밋에 monitoring.coreos.com/servicemonitor_v1.json과 prometheusrule_v1.json이 있다. kubeconform은 -schema-location을 적은 순서대로 찾아 처음 찾은 스키마를 쓴다.
      # 앱은 두 갈래로 렌더링한다. 차트는 클러스터가 Argo Rollouts의 Rollout·AnalysisTemplate kind를 알면 앱을 Deployment 대신 Rollout으로 만들기 때문이다
      # (차트 templates/rollout.yaml 머리말의 [조건부 생성]).
      #   - Rollout 갈래(<환경>.yaml): Argo Rollouts가 설치된 클러스터에서 ArgoCD가 렌더링하는 결과다. argoproj.io/v1alpha1/Rollout·AnalysisTemplate을 더한다.
      #   - Deployment 갈래(<환경>-deployment.yaml): Argo Rollouts가 아직 없는 새 클러스터의 결과다. 그룹/버전 argoproj.io/v1alpha1은 이쪽에도 넣는다.
      #     ArgoCD 자신의 CRD(Application 등)가 이 그룹/버전이라 클러스터에 늘 있으므로, 이것만으로 Rollout이 나온다면 조건이 틀린 것이다(다음 단계가 잡는다).
      # Rollout·AnalysisTemplate의 스키마도 CRD_SCHEMA_LOCATION의 커밋에 있다(argoproj.io/rollout_v1alpha1.json, analysistemplate_v1alpha1.json). Rollout의 스키마에는
      # 파드 템플릿 전체가 들어 있어서 -strict가 그 안의 오타까지 잡는다.
      # 두 갈래 모두 Traefik의 traefik.io/v1alpha1/Middleware도 더한다. k3s는 노드가 뜰 때 Traefik의 CRD를 설치하므로 ArgoCD가 렌더링할 때 늘 있는 kind이고,
      # 그러면 차트가 HTTP→HTTPS 리다이렉트 Middleware(prod는 HSTS Middleware도)와 그것을 가리키는 Ingress 어노테이션을 만든다(차트 templates/https-redirect.yaml, hsts.yaml).
      # Traefik이 없는 경우는 다음다음 단계가 따로 렌더링한다.
      - name: 렌더링 + 쿠버네티스 스키마 검사 (dev, prod × Rollout, Deployment)
        run: |
          for environment in dev prod; do
            for workload in rollout deployment; do
              echo "::group::helm template + kubeconform ($environment, $workload)"
              api_versions=(
                --api-versions monitoring.coreos.com/v1
                --api-versions monitoring.coreos.com/v1/ServiceMonitor
                --api-versions monitoring.coreos.com/v1/PrometheusRule
                --api-versions argoproj.io/v1alpha1
                --api-versions traefik.io/v1alpha1
                --api-versions traefik.io/v1alpha1/Middleware
              )
              if [ "$workload" = rollout ]; then
                api_versions+=(--api-versions argoproj.io/v1alpha1/Rollout --api-versions argoproj.io/v1alpha1/AnalysisTemplate)
                rendered="$RUNNER_TEMP/$environment.yaml"
              else
                rendered="$RUNNER_TEMP/$environment-deployment.yaml"
              fi
              helm template "shortener-$environment" charts/shortener \
                --namespace "shortener-$environment" \
                --kube-version "$KUBERNETES_VERSION" \
                "${api_versions[@]}" \
                -f "environments/$environment/values.yaml" > "$rendered"
              docker run -i --rm "$KUBECONFORM_IMAGE" \
                -strict -summary \
                -schema-location "$K8S_SCHEMA_LOCATION" \
                -schema-location "$CRD_SCHEMA_LOCATION" \
                -kubernetes-version "$KUBERNETES_VERSION" - < "$rendered"
              echo "::endgroup::"
            done
          done

      # 위 단계의 두 갈래가 차트의 의도대로 나뉘었는지 yq로 확인한다. kubeconform은 리소스 하나하나의 모양만 보므로 무엇이 렌더링됐는지는 따로 본다.
      #   - Rollout 갈래: Rollout과 AnalysisTemplate이 하나씩 있고 앱 Deployment는 없다. HPA가 있으면 Rollout을 가리키고,
      #     prod에는 HPA가 정확히 하나 있어 argoproj.io/v1alpha1의 Rollout shortener-prod를 가리킨다(HPA가 통째로 빠지는 실수도 잡는다).
      #   - Deployment 갈래: 그 반대다. Rollout·AnalysisTemplate이 없고 앱 Deployment가 하나 있으며, HPA는 Deployment를 가리킨다.
      #   - 두 갈래의 파드 템플릿이 같다. 둘 다 차트의 shortener.appPodTemplate 하나에서 나오므로, 다르면 한쪽에만 따로 손댄 것이다.
      #     위에서 Deployment의 파드 템플릿은 쿠버네티스 내장 스키마로, Rollout의 것은 CRD 스키마로 검사했으니 두 스키마가 모두 받아들이는 템플릿이기도 하다.
      #   - AnalysisTemplate의 모든 지표에 측정 횟수(count)가 있다. Rollout은 이 템플릿을 카나리의 단계 안(analysis 단계)에서 쓰는데, 그 분석은 끝나야 다음 단계로 간다.
      #     횟수가 없는 지표는 끝나지 않으므로 Argo Rollouts가 Rollout을 InvalidSpec으로 거부한다. 스키마로는 잡히지 않고 클러스터에서야 드러나서 여기서 본다.
      # 기대와 다른 것이 있어도 바로 멈추지 않고 모두 오류로 남긴 뒤 실패한다.
      - name: 앱 워크로드 두 갈래 확인 (Rollout, Deployment)
        run: |
          status=0
          # 인자: 설명, 기대값, yq ea 식, 파일
          expect() {
            actual="$(yq ea "$3" "$4")"
            if [ "$actual" != "$2" ]; then
              echo "::error::${1}: ${2}이어야 하는데 ${actual}이다"
              status=1
            fi
          }
          app='.metadata.labels."app.kubernetes.io/component" == "app"'
          for environment in dev prod; do
            rollout="$RUNNER_TEMP/$environment.yaml"
            deployment="$RUNNER_TEMP/$environment-deployment.yaml"
            expect "$environment Rollout 갈래의 Rollout 수" 1 '[select(.kind == "Rollout")] | length' "$rollout"
            expect "$environment Rollout 갈래의 AnalysisTemplate 수" 1 '[select(.kind == "AnalysisTemplate")] | length' "$rollout"
            expect "$environment Rollout 갈래의 앱 Deployment 수" 0 "[select(.kind == \"Deployment\" and $app)] | length" "$rollout"
            expect "$environment Rollout 갈래에서 Rollout이 아닌 것을 가리키는 HPA 수" 0 '[select(.kind == "HorizontalPodAutoscaler" and .spec.scaleTargetRef.kind != "Rollout")] | length' "$rollout"
            expect "$environment Rollout 갈래의 AnalysisTemplate에서 측정 횟수(count)가 없는 지표 수" 0 '[select(.kind == "AnalysisTemplate") | .spec.metrics[] | select(.count == null)] | length' "$rollout"
            expect "$environment Deployment 갈래의 Rollout·AnalysisTemplate 수" 0 '[select(.kind == "Rollout" or .kind == "AnalysisTemplate")] | length' "$deployment"
            expect "$environment Deployment 갈래의 앱 Deployment 수" 1 "[select(.kind == \"Deployment\" and $app)] | length" "$deployment"
            expect "$environment Deployment 갈래에서 Deployment가 아닌 것을 가리키는 HPA 수" 0 '[select(.kind == "HorizontalPodAutoscaler" and .spec.scaleTargetRef.kind != "Deployment")] | length' "$deployment"
            if ! diff <(yq "select(.kind == \"Deployment\" and $app) | .spec.template" "$deployment") \
                      <(yq 'select(.kind == "Rollout") | .spec.template' "$rollout"); then
              echo "::error::$environment: 두 갈래의 파드 템플릿이 다르다(위 diff의 < 줄이 Deployment, > 줄이 Rollout)"
              status=1
            fi
          done
          expect "prod Rollout 갈래의 HPA(apiVersion/kind/name)" argoproj.io/v1alpha1/Rollout/shortener-prod \
            '[select(.kind == "HorizontalPodAutoscaler") | .spec.scaleTargetRef | .apiVersion + "/" + .kind + "/" + .name] | join(",")' "$RUNNER_TEMP/prod.yaml"
          exit "$status"

      # 앱 Ingress의 HTTPS 설정을 yq로 확인한다. kubeconform은 리소스 하나하나의 모양만 보고, 이름으로 서로를 가리키는 것이 맞는지는 보지 않는다.
      #   - 위 렌더링 단계의 네 결과(dev·prod × 두 갈래)마다: Ingress와 리다이렉트 Middleware(redirectScheme)가 하나씩 있고, Ingress의 TLS 호스트가 규칙의 호스트와 같으며 Secret이 <릴리스>-tls다.
      #     HSTS Middleware(headers)는 환경 값 파일의 ingress.hsts.enabled가 true일 때만 하나 있다(지금은 prod). 그 헤더는 max-age가 1 이상의 정수이고 includeSubDomains·preload가 꺼져 있다
      #     (켜면 하위 도메인인 dev까지 HSTS가 걸린다. 차트 templates/hsts.yaml 머리말).
      #     어노테이션 router.middlewares가 같은 결과의 Middleware를 <네임스페이스>-<이름>@kubernetescrd로, 리다이렉트·HSTS 순서로 가리킨다(어긋나면 Traefik이 그 라우터를 버려 호스트가 404다).
      #     어노테이션 cert-manager.io/cluster-issuer가 platform/cert-issuers에 있는 ClusterIssuer의 이름이다(오타면 Certificate가 발급자를 찾지 못해 인증서가 영영 나오지 않는다).
      #     HSTS를 켠 환경은 그 발급자가 letsencrypt-prod여야 한다. staging 인증서에 HSTS가 걸리면 브라우저가 경고를 넘어가는 길을 막아 그 호스트를 열 수 없다.
      #   - Traefik의 Middleware kind를 모르는 클러스터처럼 한 번 더 렌더링해서, Middleware(리다이렉트·HSTS)와 router.middlewares 어노테이션이 함께 빠지고 TLS는 남는지 본다
      #     (차트의 shortener.httpsRedirectEnabled 하나가 둘을 정하고 shortener.hstsEnabled도 그것을 조건으로 쓴다. 어노테이션만 남으면 위와 같은 404다).
      #   - TLS를 끈 경로(차트 기본값)를 HSTS만 켜서 한 번 렌더링해 kubeconform으로 검사하고, Middleware·어노테이션·spec.tls가 없는지 본다(HSTS는 TLS 없이 만들지 않는다).
      # 기대와 다른 것이 있어도 바로 멈추지 않고 모두 오류로 남긴 뒤 실패한다.
      - name: 앱 Ingress HTTPS 확인 (TLS, 리다이렉트, HSTS, 발급자 이름)
        run: |
          status=0
          # 인자: 설명, 기대값, yq ea 식, 파일
          expect() {
            actual="$(yq ea "$3" "$4")"
            if [ "$actual" != "$2" ]; then
              echo "::error::${1}: ${2}이어야 하는데 ${actual}이다"
              status=1
            fi
          }
          ingress='select(.kind == "Ingress")'
          middlewares='.metadata.annotations."traefik.ingress.kubernetes.io/router.middlewares"'
          redirect_mw='select(.kind == "Middleware" and .spec.redirectScheme != null)'
          hsts_mw='select(.kind == "Middleware" and .spec.headers != null)'
          issuers="$(yq ea '[select(.kind == "ClusterIssuer") | .metadata.name] | join(" ")' platform/cert-issuers/*.yaml)"
          for environment in dev prod; do
            # 릴리스 이름과 네임스페이스는 둘 다 shortener-<환경>이다(Application 이름과 destination.namespace).
            release="shortener-$environment"
            # 이 환경이 HSTS를 켰는지(적지 않았으면 차트 기본값 false).
            hsts_enabled="$(yq '.ingress.hsts.enabled // false' "environments/$environment/values.yaml")"
            if [ "$hsts_enabled" = true ]; then hsts_count=1; else hsts_count=0; fi
            for suffix in "" -deployment; do
              rendered="$RUNNER_TEMP/$environment$suffix.yaml"
              expect "$release$suffix의 Ingress 수" 1 "[$ingress] | length" "$rendered"
              expect "$release$suffix의 Middleware 수" "$((1 + hsts_count))" '[select(.kind == "Middleware")] | length' "$rendered"
              expect "$release$suffix의 리다이렉트 Middleware 수" 1 "[$redirect_mw] | length" "$rendered"
              expect "$release$suffix의 HSTS Middleware 수" "$hsts_count" "[$hsts_mw] | length" "$rendered"
              expect "$release$suffix Ingress의 TLS Secret" "$release-tls" "[$ingress | .spec.tls[].secretName] | join(\",\")" "$rendered"
              expect "$release$suffix Ingress의 TLS 호스트" "$(yq ea "[$ingress | .spec.rules[].host] | join(\",\")" "$rendered")" \
                "[$ingress | .spec.tls[].hosts[]] | join(\",\")" "$rendered"
              # 기대하는 어노테이션: 리다이렉트, (HSTS를 켰으면) 쉼표 뒤에 HSTS.
              wanted="$release-$(yq ea "[$redirect_mw | .metadata.name] | join(\",\")" "$rendered")@kubernetescrd"
              if [ "$hsts_count" = 1 ]; then
                wanted="$wanted,$release-$(yq ea "[$hsts_mw | .metadata.name] | join(\",\")" "$rendered")@kubernetescrd"
                # 정수 태그(!!int)인지도 본다: 지수 표기(3.1536e+07)로 렌더링되면 stsSeconds의 정수 스키마에 맞지 않는다.
                expect "$release$suffix HSTS 헤더(max-age의 태그, max-age > 0, includeSubDomains, preload)" "!!int true false false" \
                  "$hsts_mw | .spec.headers | (.stsSeconds | tag) + \" \" + ((.stsSeconds > 0) | tostring) + \" \" + ((.stsIncludeSubdomains // false) | tostring) + \" \" + ((.stsPreload // false) | tostring)" "$rendered"
              fi
              expect "$release$suffix Ingress의 router.middlewares" "$wanted" "$ingress | $middlewares" "$rendered"
              issuer="$(yq ea "$ingress | .metadata.annotations.\"cert-manager.io/cluster-issuer\"" "$rendered")"
              if [[ " $issuers " != *" $issuer "* ]]; then
                echo "::error::$release$suffix Ingress의 cert-manager.io/cluster-issuer($issuer)가 platform/cert-issuers의 ClusterIssuer($issuers) 중 하나가 아니다"
                status=1
              fi
              if [ "$hsts_count" = 1 ] && [ "$issuer" != letsencrypt-prod ]; then
                echo "::error::$release$suffix: HSTS를 켰는데 발급자가 letsencrypt-prod가 아니다($issuer). staging 인증서에 HSTS가 걸리면 브라우저가 그 호스트를 열지 못한다. HSTS를 먼저 끈다"
                status=1
              fi
            done
            no_traefik="$RUNNER_TEMP/$environment-no-traefik.yaml"
            helm template "$release" charts/shortener --namespace "$release" --kube-version "$KUBERNETES_VERSION" \
              -f "environments/$environment/values.yaml" > "$no_traefik"
            expect "$release(Traefik 없음)의 Middleware 수" 0 '[select(.kind == "Middleware")] | length' "$no_traefik"
            expect "$release(Traefik 없음) Ingress의 router.middlewares" null "$ingress | $middlewares" "$no_traefik"
            expect "$release(Traefik 없음) Ingress의 TLS Secret" "$release-tls" "[$ingress | .spec.tls[].secretName] | join(\",\")" "$no_traefik"
          done
          # TLS를 끈 경로(차트 기본값 ingress.tls.enabled: false. 로컬 k3d처럼 인증서를 받을 수 없는 클러스터)를 한 번 렌더링한다. Traefik이 있는 클러스터처럼 Middleware kind를 넘기고
          # HSTS를 켜도 리다이렉트와 HSTS는 TLS가 켜져 있을 때만 만들어야 하므로 Middleware·어노테이션·spec.tls가 하나도 없어야 한다. 환경 값 파일은 dev를 쓰고 TLS를 끄고 HSTS를 켠다.
          # kubeconform으로 모양도 검사한다.
          no_tls="$RUNNER_TEMP/dev-no-tls.yaml"
          helm template shortener-dev charts/shortener --namespace shortener-dev --kube-version "$KUBERNETES_VERSION" \
            --api-versions traefik.io/v1alpha1 --api-versions traefik.io/v1alpha1/Middleware \
            -f environments/dev/values.yaml --set ingress.tls.enabled=false --set ingress.hsts.enabled=true > "$no_tls"
          docker run -i --rm "$KUBECONFORM_IMAGE" \
            -strict -summary \
            -schema-location "$K8S_SCHEMA_LOCATION" \
            -schema-location "$CRD_SCHEMA_LOCATION" \
            -kubernetes-version "$KUBERNETES_VERSION" - < "$no_tls"
          expect "shortener-dev(TLS 끔, HSTS 켬)의 Ingress 수" 1 "[$ingress] | length" "$no_tls"
          expect "shortener-dev(TLS 끔, HSTS 켬)의 Middleware 수" 0 '[select(.kind == "Middleware")] | length' "$no_tls"
          expect "shortener-dev(TLS 끔, HSTS 켬) Ingress의 어노테이션" null "$ingress | .metadata.annotations" "$no_tls"
          expect "shortener-dev(TLS 끔, HSTS 켬) Ingress의 spec.tls" null "$ingress | .spec.tls" "$no_tls"
          exit "$status"

      # 차트의 SLO 규칙과 앱 파드 경보(PrometheusRule)를 Prometheus의 도구 promtool로 검사한다. kubeconform은 리소스의 모양만 보고 그 안의 PromQL은 문자열로만 본다.
      #   1) 위 단계의 두 갈래 렌더링 결과에서 yq로 PrometheusRule의 spec만 꺼내 tests/slo/rendered/<릴리스>.yaml(Rollout 갈래)과
      #      <릴리스>-deployment.yaml(Deployment 갈래)에 쓴다. spec(groups)이 곧 Prometheus 규칙 파일의 형식이다.
      #      두 갈래는 앱 파드 경보가 읽는 지표만 다르다(Rollout이면 Argo Rollouts 컨트롤러의 지표, Deployment이면 kube-state-metrics의 지표. 차트 templates/prometheusrule.yaml).
      #      갈래마다 PrometheusRule이 정확히 하나여야 한다. 없으면 값 파일에서 slo가 꺼졌거나 위 --api-versions 조건이 깨진 것이라 실패시킨다.
      #   2) promtool check rules: YAML 구조, PromQL 문법, 어노테이션의 템플릿 문법, 같은 규칙의 중복을 검사한다(--lint-fatal: 중복 경고도 실패로 본다).
      #   3) promtool test rules: 테스트 파일이 가짜 시계열을 넣고, 정한 시각에 울려야 할 알림과 울리지 않아야 할 알림을 확인한다.
      #      tests/slo/shortener-slo.test.yaml은 Rollout 갈래의 두 환경 규칙을 함께 읽는다(5xx 100%, 5xx 0.1%, 20%가 느린 요청, 요청 없음, 5xx 4%의 느린 소진,
      #      le 버킷이 없는 옛 파드와 있는 새 파드가 섞인 롤아웃, le 버킷이 없는 앱, 앱 파드 0개·순간 0개·컨트롤러 교체와 지표 없음·노드 부팅 직후).
      #      tests/slo/shortener-slo-deployment.test.yaml은 Deployment 갈래의 앱 파드 경보만 본다(앱 Deployment 0개, 다른 Deployment 0개, 지표 없음, 노드 부팅 직후).
      # promtool의 버전과 이미지는 잡의 PROMETHEUS_IMAGE(위 env)다. promtool은 파일을 읽기만 하므로 tests/slo를 읽기 전용으로 마운트한다.
      - name: SLO 규칙 검사 (promtool check + test)
        run: |
          mkdir -p tests/slo/rendered
          for environment in dev prod; do
            # 빈 접미사는 Rollout 갈래, -deployment는 Deployment 갈래다(위 렌더링 단계의 파일 이름과 같다).
            for suffix in "" -deployment; do
              rendered="$RUNNER_TEMP/$environment$suffix.yaml"
              count="$(yq ea '[select(.kind == "PrometheusRule")] | length' "$rendered")"
              if [ "$count" != 1 ]; then
                echo "::error::shortener-${environment}${suffix}의 렌더링 결과에 PrometheusRule이 ${count}개 있다(1개여야 한다)"
                exit 1
              fi
              yq 'select(.kind == "PrometheusRule") | .spec' "$rendered" > "tests/slo/rendered/shortener-$environment$suffix.yaml"
            done
          done
          docker run --rm -v "$GITHUB_WORKSPACE/tests/slo:/slo:ro" --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" \
            check rules --lint-fatal /slo/rendered/shortener-dev.yaml /slo/rendered/shortener-prod.yaml \
            /slo/rendered/shortener-dev-deployment.yaml /slo/rendered/shortener-prod-deployment.yaml
          docker run --rm -v "$GITHUB_WORKSPACE/tests/slo:/slo:ro" --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" \
            test rules /slo/shortener-slo.test.yaml /slo/shortener-slo-deployment.test.yaml

      # 카나리 분석(차트의 AnalysisTemplate)의 PromQL을 promtool로 검사한다. kubeconform은 쿼리를 문자열로만 본다.
      #   1) Rollout 갈래의 렌더링 결과에서 쿼리를 꺼낸다. Argo Rollouts가 AnalysisRun을 만들 때 채우는 자리표시자 {{args.canary-hash}}가 글자 그대로
      #      남아 있어야 한다(차트에서 Helm이 해석하지 않게 감싸 둔 것이 렌더링 뒤에도 살아 있는지 본다). 없으면 실패시킨다.
      #   2) 자리표시자를 테스트용 해시 canary로 바꾸고, 쿼리를 기록 규칙 하나(canary:http_server_requests_errors:ratio_rate1m)로 감싼 규칙 파일을
      #      tests/canary/rendered/<릴리스>.yaml에 쓴다(.gitignore). promtool은 규칙 파일을 읽어 계산하므로 감싼다.
      #   3) promtool check rules로 PromQL 문법을, promtool test rules로 tests/canary/analysis.test.yaml의 시나리오를 검사한다
      #      (카나리 파드의 5xx 30%, stable 파드에만 5xx, 최근 1분 요청 없음(NaN), 새 카나리 파드의 첫 수집 직후(빈 결과)).
      # 결과를 판정하는 successCondition은 Argo Rollouts의 식(expr)이라 promtool이 계산하지 못한다. 판정 규칙은 차트 templates/analysistemplate.yaml 머리말에 있다.
      - name: 카나리 분석 쿼리 검사 (promtool check + test)
        run: |
          mkdir -p tests/canary/rendered
          placeholder='{{args.canary-hash}}'
          for environment in dev prod; do
            query="$(yq 'select(.kind == "AnalysisTemplate") | .spec.metrics[] | select(.name == "error-rate") | .provider.prometheus.query' "$RUNNER_TEMP/$environment.yaml")"
            if [[ $query != *"rollouts_pod_template_hash=\"$placeholder\""* ]]; then
              echo "::error::shortener-${environment}의 AnalysisTemplate 쿼리에 rollouts_pod_template_hash=\"$placeholder\"가 없다"
              exit 1
            fi
            QUERY="${query//"$placeholder"/canary}" GROUP="shortener-$environment-canary-analysis" \
              yq -n '.groups = [{"name": strenv(GROUP), "rules": [{"record": "canary:http_server_requests_errors:ratio_rate1m", "expr": strenv(QUERY)}]}]' \
              > "tests/canary/rendered/shortener-$environment.yaml"
          done
          docker run --rm -v "$GITHUB_WORKSPACE/tests/canary:/canary:ro" --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" \
            check rules --lint-fatal /canary/rendered/shortener-dev.yaml /canary/rendered/shortener-prod.yaml
          docker run --rm -v "$GITHUB_WORKSPACE/tests/canary:/canary:ro" --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" \
            test rules /canary/analysis.test.yaml

      # argocd/ 아래의 Application 매니페스트(루트와 dev·prod)를 스키마로 검사한다. 내장 리소스는 위 K8S_SCHEMA_LOCATION(고정한 기본 스키마)에서,
      # Application은 위 CRD 스키마 모음에서 찾는다. 찾지 못하면 통과시키지 않고 실패한다(-ignore-missing-schemas를 쓰지 않았다).
      # -strict 덕분에 필드 이름의 오타(예: selfHeall)나 잘못된 위치의 필드가 여기서 걸린다. 디렉터리를 넘기면 하위 디렉터리까지 검사한다.
      - name: ArgoCD Application 스키마 검사
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work "$KUBECONFORM_IMAGE" \
            -strict -summary \
            -schema-location "$K8S_SCHEMA_LOCATION" \
            -schema-location "$CRD_SCHEMA_LOCATION" \
            -kubernetes-version "$KUBERNETES_VERSION" \
            argocd/

      # platform/cert-issuers(cert-issuers Application)의 ClusterIssuer를 검사한다. ArgoCD가 이 디렉터리의 YAML을 렌더링 없이 그대로 적용하므로 파일을 바로 넘긴다.
      #   1) kubeconform: 스키마는 CRD_SCHEMA_LOCATION의 커밋에 있다(cert-manager.io/clusterissuer_v1.json). -strict가 필드 이름의 오타(예: ingressClassname)를 잡는다.
      #   2) yq: 이름과 ACME 서버 주소의 짝이 맞는지 본다. 스키마는 주소를 문자열로만 본다. 둘이 뒤바뀌면 staging이라고 믿고 하는 시험이 production의 발급 한도(같은 이름 묶음으로 7일에 5장)를 쓴다.
      - name: 인증서 발급자 검사 (platform/cert-issuers)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work "$KUBECONFORM_IMAGE" \
            -strict -summary \
            -schema-location "$K8S_SCHEMA_LOCATION" \
            -schema-location "$CRD_SCHEMA_LOCATION" \
            -kubernetes-version "$KUBERNETES_VERSION" \
            platform/cert-issuers/
          status=0
          for pair in "letsencrypt-staging https://acme-staging-v02.api.letsencrypt.org/directory" \
                      "letsencrypt-prod https://acme-v02.api.letsencrypt.org/directory"; do
            read -r name server <<< "$pair"
            actual="$(yq ea "[select(.kind == \"ClusterIssuer\" and .metadata.name == \"$name\") | .spec.acme.server] | join(\",\")" platform/cert-issuers/*.yaml)"
            if [ "$actual" != "$server" ]; then
              echo "::error::ClusterIssuer $name의 ACME 서버가 ${server}이어야 하는데 ${actual}이다"
              status=1
            fi
          done
          exit "$status"

      # argocd/apps의 Application 가운데 Helm 차트 저장소의 차트를 쓰는 것(chart가 있는 소스. 예: kube-prometheus-stack)을 ArgoCD처럼 렌더링해 스키마로 검사한다.
      # 차트 저장소·차트 이름·버전·릴리스 이름(helm.releaseName, 없으면 Application 이름)·네임스페이스·값 파일을 모두 Application 파일에서 yq로 읽으므로
      # 차트 버전을 올리거나 이런 Application을 더해도 이 단계는 고칠 필요가 없다. helm repo add 없이 --repo로 Application의 repoURL을 그대로 쓴다.
      # 값 파일은 $values/(ref: values로 이름 붙인 이 저장소)로 시작해야 하고, 그 파일이 없거나(ArgoCD도 매니페스트를 만들지 못한다)
      # yq가 쓰는 모양이 아니면(환경 값 파일과 같은 규칙. 맨 위 단계 참고) 실패한다.
      # --include-crds: ArgoCD처럼 차트의 crds/ 디렉터리도 렌더링해서 CRD 객체 자체도 검사한다.
      # kubeconform은 스키마를 세 곳에서 차례로 찾는다: 내장 리소스(K8S_SCHEMA_LOCATION), CRD로 정의된 리소스(CRD_SCHEMA_LOCATION. Prometheus·ServiceMonitor 등),
      # CustomResourceDefinition 자체(아래 K8S_LOCAL_SCHEMA_LOCATION). 어디에서도 못 찾으면 실패한다.
      - name: 플랫폼 차트 렌더링 + 스키마 검사 (argocd/apps의 Helm 차트 저장소 소스)
        env:
          # CustomResourceDefinition 객체의 스키마 위치(K8S_SCHEMA_LOCATION과 같은 커밋). 그쪽 -standalone-strict 디렉터리에는 CustomResourceDefinition이 없다:
          # CRD 안의 스키마 정의(JSONSchemaProps)가 자기 자신을 참조하는 재귀 구조라, 모든 $ref를 한 파일에 펼쳐 넣는 standalone 형식으로는 만들 수 없다.
          # -local 디렉터리는 정의를 같은 디렉터리의 _definitions.json으로 상대 참조해서 CRD 스키마가 있고, 그 참조도 같은 커밋 안에서 풀린다.
          # strict 형식이 아니라서 CRD 객체의 모르는 필드는 잡지 못하고 타입과 필수 필드를 검사한다. Dependabot이 갱신해 주지 않는다(K8S_SCHEMA_LOCATION과 함께 올린다).
          K8S_LOCAL_SCHEMA_LOCATION: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/8df8a883b68a24a104b4a9e43c1288090ae60b3b/{{.NormalizedKubernetesVersion}}-local/{{.ResourceKind}}{{.KindSuffix}}.json
        run: |
          set -euo pipefail
          # 문제가 있으면 그 Application 파일을 가리키는 오류를 남기고 바로 멈춘다.
          fail() { echo "::error file=$app::$*"; exit 1; }
          # $values가 가리켜야 하는 저장소(이 저장소). Application의 repoURL과 같은 모양이다.
          this_repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          checked=0
          for app in argocd/apps/*.yaml; do
            name=$(yq '.metadata.name' "$app")
            namespace=$(yq '.spec.destination.namespace' "$app")
            # 소스가 하나인 형태(.spec.source)와 여럿인 형태(.spec.sources)를 모두 보고, chart가 있는 소스(Helm 차트 저장소)만 고른다.
            charts='[(.spec.sources // [.spec.source])[] | select(has("chart"))]'
            count=$(yq "$charts | length" "$app")
            for ((i = 0; i < count; i++)); do
              # yq 식 "[...][i]"(i번째 차트 소스)를 만든다. 셸 배열이 아니다.
              src="${charts}[$i]"
              repo=$(yq "$src.repoURL" "$app")
              chart=$(yq "$src.chart" "$app")
              version=$(yq "$src.targetRevision" "$app")
              release=$(yq "$src.helm.releaseName // \"\"" "$app")
              release=${release:-$name}
              for value in "$repo" "$chart" "$version" "$namespace"; do
                [ "$value" != null ] || fail "repoURL·chart·targetRevision·destination.namespace 가운데 빈 것이 있다"
              done
              case $repo in
                https://*) ;;
                *) fail "HTTP(S) Helm 차트 저장소만 검사한다(OCI 등은 이 단계를 고쳐야 한다): $repo" ;;
              esac
              # yq에서는 or가 |보다 늦게 묶이므로 괄호로 감싼다(감싸지 않으면 뒤의 has가 문서 맨 위를 본다).
              [ "$(yq "$src.helm | (has(\"values\") or has(\"valuesObject\") or has(\"parameters\"))" "$app")" = false ] ||
                fail "helm.values·valuesObject·parameters는 이 검사가 렌더링에 넣지 않는다. 값은 \$values/의 값 파일에 둔다"
              values_args=()
              while IFS= read -r ref; do
                case $ref in
                  "\$values/"*) file=${ref#"\$values/"} ;;
                  *) fail "값 파일은 \$values/(이 저장소)로 시작해야 한다: $ref" ;;
                esac
                [ "$(yq '.spec.sources[] | select(.ref == "values") | .repoURL' "$app")" = "$this_repo" ] ||
                  fail "ref: values 소스가 이 저장소($this_repo)를 가리키지 않는다"
                [ -f "$file" ] || fail "값 파일이 없다: $file"
                diff <(yq '.' "$file") "$file" ||
                  fail "yq가 다시 쓰면 $file 이 바뀐다. yq -i '.' $file 로 정규화해서 커밋한다"
                values_args+=(-f "$file")
              done < <(yq "($src.helm.valueFiles // []) | .[]" "$app")
              echo "::group::helm template + kubeconform ($name: $chart $version)"
              helm template "$release" "$chart" --repo "$repo" --version "$version" \
                --namespace "$namespace" --kube-version "$KUBERNETES_VERSION" --include-crds \
                "${values_args[@]}" > "$RUNNER_TEMP/platform-$name-$i.yaml"
              docker run -i --rm "$KUBECONFORM_IMAGE" \
                -strict -summary \
                -schema-location "$K8S_SCHEMA_LOCATION" \
                -schema-location "$CRD_SCHEMA_LOCATION" \
                -schema-location "$K8S_LOCAL_SCHEMA_LOCATION" \
                -kubernetes-version "$KUBERNETES_VERSION" - < "$RUNNER_TEMP/platform-$name-$i.yaml"
              echo "::endgroup::"
              checked=$((checked + 1))
            done
          done
          # 고르는 식이 깨져 아무것도 검사하지 않고 통과하는 일을 막는다.
          [ "$checked" -gt 0 ] || { echo "::error::chart 소스가 있는 Application을 argocd/apps에서 하나도 찾지 못했다"; exit 1; }

      # platform/dashboards(monitoring-dashboards Application)를 ArgoCD처럼 kustomize로 렌더링해 스키마로 검사하고, 대시보드 JSON 파일을 jq로 검사한다.
      #   1) kustomize: ArgoCD v3.5.3에 들어 있는 것과 같은 5.8.1(ArgoCD 저장소의 hack/tool-versions.sh)을 릴리스에서 내려받고 SHA-256을 맞춰 본 뒤 쓴다.
      #      러너 이미지에도 kustomize가 깔려 있지만(2026-09 기준 5.8.1) 러너 이미지가 갱신되면 버전이 저절로 바뀐다. 그 버전이 5.8.1인지 비교해 아니면 실패시키는
      #      방법도 있지만, 그러면 러너 이미지가 바뀌는 날 이 필수 검사가 PR의 내용과 상관없이 실패한다. 내려받기는 그날도 늘 같은 바이너리를 쓴다. ArgoCD 이미지도
      #      같은 방식이다(Dockerfile의 hack/install.sh kustomize가 같은 릴리스 파일을 받아 아래와 같은 체크섬으로 확인한다). ubuntu-24.04 러너는 x86-64라 linux_amd64를 받는다.
      #      KUSTOMIZE_SHA256은 릴리스의 checksums.txt와 ArgoCD 저장소(v3.5.3)의 hack/installers/checksums/kustomize_5.8.1_linux_amd64.tar.gz.sha256이 같은 값이다.
      #      Dependabot이 갱신해 주지 않으니, ArgoCD를 올려 그 kustomize 버전이 바뀌면 두 값을 함께 바꾼다(체크섬은 새 릴리스의 checksums.txt에서 읽는다).
      #   2) jq: 파일마다 JSON으로 읽히고, 객체이며 uid·title이 문자열인지 본다. 깨진 JSON은 사이드카가 넣어도 Grafana가 읽지 못하고 로그에 오류만 남긴다.
      #      uid가 없으면 Grafana가 대시보드를 읽을 때마다 새 uid를 만들어(Grafana의 DB는 emptyDir이라 파드가 다시 뜨면 처음부터 읽는다) 대시보드 주소(/d/<uid>)가 바뀐다.
      #   3) kustomize build: ArgoCD가 하는 렌더링이다. kustomization.yaml의 오류(목록에 있는데 없는 파일 등)가 여기서 걸린다.
      #   4) kubeconform: 렌더링 결과(ConfigMap)를 내장 리소스 스키마로 검사한다(-strict).
      - name: 대시보드 렌더링 + 스키마 검사, JSON 검사 (platform/dashboards)
        env:
          KUSTOMIZE_VERSION: v5.8.1
          KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
        run: |
          set -euo pipefail
          archive="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/$KUSTOMIZE_VERSION/$archive"
          # 체크섬이 다르면 sha256sum이 실패하고(set -e) 내려받은 파일은 쓰지 않는다.
          echo "$KUSTOMIZE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" kustomize
          kustomize="$RUNNER_TEMP/kustomize"
          "$kustomize" version
          status=0
          for file in platform/dashboards/*.json; do
            if jq -e 'type == "object" and (.uid | type == "string") and (.title | type == "string")' "$file" > /dev/null; then
              echo "$file: JSON이고 uid·title이 있다"
            else
              echo "::error file=$file::JSON으로 읽히지 않거나(위 jq의 오류) uid·title이 문자열이 아니다"
              status=1
            fi
          done
          [ "$status" = 0 ] || exit 1
          "$kustomize" build platform/dashboards > "$RUNNER_TEMP/dashboards.yaml"
          docker run -i --rm "$KUBECONFORM_IMAGE" \
            -strict -summary \
            -schema-location "$K8S_SCHEMA_LOCATION" \
            -kubernetes-version "$KUBERNETES_VERSION" - < "$RUNNER_TEMP/dashboards.yaml"
